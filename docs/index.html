'hotdog|Préchauffer le four à 220 °C. Cuire les frites ({frites}) 20 à 25 min en les retournant à mi-cuisson. // Cuire {saucisse} de saucisses 12 min dans une poêle à feu moyen, en les retournant, jusqu’à ce qu’elles soient dorées et cuites à cœur. // Ouvrir les pains ({painburger}), les réchauffer 1 min à la poêle. // Garnir de saucisses, {ketchup} de ketchup et {moutarde} de moutarde. Servir avec les frites.',
'burgerboeuf|Préchauffer le four à 220 °C. Cuire {frites} de frites 20 à 25 min. Laver la salade ({salade}), trancher {tomate} de tomates. // Façonner les steaks avec {boeufmorc} de bœuf haché (2 cm d’épaisseur), saler, poivrer. Les cuire 3 à 4 min par face dans une poêle chaude. // Poser {gruyere} de gruyère sur le steak pour la dernière minute. // Toaster les pains ({painburger}) 1 min. // Monter : pain, ketchup ({ketchup}), salade, tomate, steak fondant, pain.',
'pitapoulet|Couper {poulet} de poulet en lamelles. Chauffer un filet d’huile dans une poêle à feu vif, cuire le poulet 6 min en remuant, saler, poivrer, jusqu’à ce qu’il soit doré et blanc à cœur. // Sauce : mélanger {yaourt} yaourt(s) nature avec {concombre} de concombre râpé et essoré, sel, poivre. // Laver la salade ({salade}), trancher {tomate} de tomates. // Chauffer {pita} pain(s) pita 30 s à la poêle. Garnir de poulet, salade, tomate et sauce.',
'kebabboeuf|Émincer {oignon} d’oignon, couper {tomate} de tomates en tranches. Laver la salade ({salade}). // Chauffer un filet d’huile dans une poêle à feu vif. Cuire {boeufmorc} de bœuf haché 6 min en l’émiettant avec {epices} d’épices (cumin, paprika), sel, poivre. // Sauce : mélanger {yaourt} yaourt(s) nature, sel, un trait de citron. // Chauffer {pita} pain(s) pita 30 s. Garnir de viande, oignon, salade, tomate et sauce.',
'tacosleg|Couper {poivron} de poivron en lanières, {tomate} de tomates en dés. Râper {gruyere} de gruyère. Rincer {mais} de maïs et les haricots rouges ({haricotsr} boîte). // Cuire le poivron 6 min dans une poêle huilée, ajouter haricots et maïs, 3 min, épicer (cumin, paprika), saler. // Réchauffer les {tortillas} tortillas 20 s par face. // Garnir de légumes, tomate et fromage. Plier en deux.',
'gratinbroc|Préchauffer le four à 200 °C. Détailler {brocoli} de brocoli en bouquets. Éplucher {pdt} de pommes de terre, couper en rondelles de 5 mm. // Cuire pommes de terre et brocoli 10 min dans l’eau salée, égoutter. // Mélanger avec {cremeliq} de crème, ail ({ail}) haché, sel, poivre. Verser dans un plat, parsemer de {gruyere} de gruyère. // Gratiner 25 min jusqu’à ce que le dessus soit doré et bouillonnant.',
'gratincourge|Préchauffer le four à 190 °C. Couper {courgette} de courgettes en rondelles. Les faire revenir 8 min dans un filet d’huile, jusqu’à ce qu’elles soient tendres. // Battre {oeufs} œuf(s) avec {cremeliq} de crème, sel, poivre, muscade. Ajouter {gruyere} de gruyère. // Mélanger avec les courgettes, verser dans un plat. // Cuire 25 min jusqu’à ce que le dessus soit pris et doré.',
'gratinbutter|Préchauffer le four à 190 °C. Éplucher {butternut} de butternut, retirer les graines, couper en tranches de 3 mm. // Disposer en couches dans un plat avec ail ({ail}) haché, sel, poivre, muscade. // Verser {cremeliq} de crème, parsemer de {gruyere} de gruyère. // Cuire 40 min : le butternut doit être tendre à la pointe du couteau et le dessus doré.',
'gratinpdt|Préchauffer le four à 180 °C. Éplucher {pdt} de pommes de terre, couper en rondelles de 3 mm (ne pas les rincer : l’amidon lie le gratin). Frotter un plat avec ail ({ail}). // Disposer les pommes de terre en couches, saler, poivrer, muscade. // Verser {cremeliq} de crème mélangée à {lait} de lait. Parsemer de {gruyere} de gruyère. // Cuire 50 min : la pointe d’un couteau doit s’enfoncer sans résistance, le dessus doit être doré. // Servir avec la salade ({salade}).',
'gratinlegumes|Préchauffer le four à 200 °C. Éplucher {carotte} de carottes et {pdt} de pommes de terre, couper en rondelles. Détailler {chouf} de chou-fleur en bouquets. // Cuire les légumes 10 min dans l’eau salée, égoutter. // Les disposer dans un plat, napper de {cremeliq} de crème, saler, poivrer, muscade. Parsemer de {gruyere} de gruyère. // Gratiner 25 min jusqu’à ce que le dessus soit bien doré.',
'ratatouillee|Couper {aubergine} d’aubergine, {courgette} de courgette, {poivron} de poivron et {oignon} d’oignon en dés de 2 cm. // Faire revenir aubergine et oignon 6 min dans un filet d’huile, ajouter courgette et poivron, 5 min. // Ajouter {tomconc} de tomates, sel, poivre, thym. Couvrir, mijoter 30 min à feu doux en remuant de temps en temps. // Cuire {riz} de riz dans 2 fois son volume d’eau salée pendant ce temps. // Servir la ratatouille sur le riz.',
'poivronsriz|Préchauffer le four à 190 °C. Cuire {riz} de riz 8 min à l’eau bouillante, égoutter. Hacher {oignon} d’oignon. Couper les chapeaux des poivrons ({poivron}) et les évider. // Mélanger riz, oignon, {tomconc} de tomates, sel, poivre. // Farcir les poivrons, parsemer de {gruyere} de gruyère, remettre les chapeaux. // Les caler dans un plat avec un peu d’eau au fond. Cuire 35 min jusqu’à ce que les poivrons soient tendres.',
'aubergineparm|Préchauffer le four à 190 °C. Couper {aubergine} d’aubergines en rondelles de 1 cm. Les badigeonner d’{huile} d’huile, saler. Les cuire 15 min au four ou 5 min par face à la poêle, jusqu’à ce qu’elles soient dorées. // Dans un plat, superposer : une couche d’aubergines, {tomconc} de tomates, {mozza} de mozzarella en tranches. Répéter. // Parsemer de {parmesan} de parmesan. // Cuire 25 min jusqu’à ce que le dessus soit doré et bouillonnant.',
'courgettespag|Faire des spaghettis de courgettes avec un économe ou une râpe ({courgette}). Hacher {oignon} d’oignon. // Mélanger {boeufmorc} de bœuf, oignon, {chapelure} de chapelure, sel, poivre. Former des boulettes de 3 cm. // Dorer les boulettes 6 min dans une poêle huilée en les retournant. Ajouter {tomconc} de tomates, mijoter 15 min à couvert. // Faire sauter les courgettes 3 min à feu vif dans une poêle huilée (elles doivent rester croquantes). // Servir les boulettes sur les spaghettis de courgettes.',
'epinardsfeta|Préchauffer le four à 190 °C. Hacher {oignon} d’oignon et le faire revenir 3 min. Ajouter {epinards} d’épinards, laisser tomber 3 min, puis bien les égoutter en les pressant. // Mélanger avec {feta} de feta émiettée, {oeufs} œuf(s) battu(s), poivre. // Dérouler la pâte feuilletée ({feuillet} pâte), garnir la moitié, replier et souder les bords à la fourchette. // Cuire 30 min jusqu’à ce qu’elle soit gonflée et dorée. Servir tiède.',
'feuilletejam|Préchauffer le four à 200 °C. Dérouler la pâte feuilletée ({feuillet} pâte), la couper en carrés. // Garnir chaque carré de {jambon} de jambon et {gruyere} de gruyère. Replier en triangles et souder les bords à la fourchette. // Disposer sur une plaque, cuire 20 min jusqu’à ce qu’ils soient gonflés et dorés. // Servir avec la salade ({salade}) assaisonnée.',
'feuilletesaumon|Préchauffer le four à 200 °C. Faire tomber {epinards} d’épinards 3 min dans une poêle, bien égoutter. Couper {saumon} de saumon en dés. // Dérouler la pâte feuilletée ({feuillet} pâte). Garnir d’épinards, saumon, {cremeliq} de crème, sel, poivre. // Replier, souder les bords à la fourchette. Inciser la surface en 2 ou 3 endroits. // Cuire 25 min jusqu’à ce que la pâte soit gonflée et dorée.',
'tartinecamembert|Préchauffer le four à 200 °C. Cuire {pdt} de pommes de terre en rondelles 12 min dans l’eau salée, égoutter. Trancher {baguette} de baguette en deux dans la longueur. // Garnir de rondelles de pommes de terre, {lardons} de lardons crus, tranches de reblochon ({reblochon}). Poivrer. // Gratiner 15 min jusqu’à ce que le fromage soit fondu et doré. // Servir avec la salade ({salade}) assaisonnée.',
'raclettepdt|Brosser {pdt} de pommes de terre et les cuire 20 min dans l’eau bouillante salée avec la peau, jusqu’à ce qu’un couteau entre sans résistance. // Préchauffer le four à 200 °C (ou le gril). Disposer {raclette} de fromage en tranches dans un plat. // Faire fondre 5 min jusqu’à ce que le fromage bulle. // Servir sur les pommes de terre avec {jambon} de jambon et la salade ({salade}) assaisonnée.',
'tofucoco|Cuire {riz} de riz. Éponger {tofu} de tofu avec du papier absorbant, le couper en cubes de 2 cm. Couper {poivron} de poivron en lanières et {brocoli} de brocoli en bouquets. // Dorer le tofu 6 min dans une poêle huilée, en le retournant. Le retirer. // Faire revenir poivron et brocoli 5 min avec {curry} de curry. // Ajouter {laitcoco} de lait de coco, le tofu, saler, mijoter 10 min. // Servir sur le riz.',
'tofunouilles|Cuire {nouilles} de nouilles selon le paquet, égoutter. Éponger {tofu} de tofu, le couper en cubes. Râper {gingembre} de gingembre. // Dorer le tofu 6 min dans un wok huilé à feu vif, le retirer. // Sauter {poelee} de légumes 5 min avec le gingembre. // Ajouter nouilles, tofu et {soja} de sauce soja, sauter 2 min. Servir tout de suite.',
'steakvegsemoule|Hydrater {semoule} de semoule : la couvrir d’eau bouillante salée à hauteur, couvrir 5 min, égrener. Couper {courgette} de courgettes et {tomate} de tomates en dés. // Cuire les steaks végétaux ({steakveg}) 3 à 4 min par face dans une poêle huilée, selon l’emballage. // Faire sauter les courgettes 6 min dans {huile} d’huile, ajouter les tomates 2 min. Saler, poivrer. // Servir steaks, légumes et semoule.',
'pouletfrites|Préchauffer le four à 200 °C. Couper {poulet} de poulet en morceaux de 3 cm. Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s), chapelure ({chapelure}). // Saler et poivrer le poulet. Le passer dans la farine, l’œuf, puis la chapelure. // Étaler nuggets et frites ({frites}) sur une plaque. // Cuire 20 min en retournant à mi-cuisson : panure dorée, poulet blanc à cœur. // Servir avec {ketchup} de ketchup.',
'saucissetom|Hacher {oignon} d’oignon. Hydrater {semoule} de semoule avec de l’eau bouillante salée, couvrir 5 min. // Piquer {saucisse} de saucisses, les dorer 8 min dans une poêle à feu moyen. Ajouter l’oignon, cuire 3 min. // Verser {tomconc} de tomates, saler, poivrer. Mijoter 15 min à couvert. // Égrener la semoule. Servir les saucisses et la sauce dessus.',
'lentilleslard|Rincer {lentilles} de lentilles. Couper {carotte} de carottes et {oignon} d’oignon en petits dés. // Cuire lentilles, carottes et oignon 25 min dans l’eau non salée jusqu’à ce que les lentilles soient tendres. Égoutter. // Dorer {lardons} de lardons 4 min à sec. // Mélanger lentilles, légumes, lardons et {moutarde} de moutarde. Poivrer, rectifier le sel.',
'poischichesepin|Hacher {oignon} d’oignon et ail ({ail}). Cuire {riz} de riz. Rincer les pois chiches ({poischiches} boîte). // Faire revenir oignon et ail 4 min dans un filet d’huile, ajouter {epices} d’épices (cumin, paprika), 30 s. // Ajouter les pois chiches et {epinards} d’épinards, cuire 8 min en écrasant légèrement quelques pois chiches. Saler, poivrer. // Servir sur le riz.',
'galettecrepe|Mélanger {farine} de farine, {oeufs} œuf(s), {lait} de lait et une pincée de sel pour obtenir une pâte lisse. Laisser reposer 10 min. // Faire fondre {beurre} de beurre dans une poêle. Cuire une galette 1 min 30 par face. // Garnir de {jambon} de jambon et {gruyere} de gruyère. // Replier les bords vers le centre et laisser fondre le fromage 2 min à feu doux. Servir chaud.',
'spagbolo|Hacher {oignon} d’oignon et ail ({ail}), râper {carotte} de carottes. // Chauffer un filet d’huile dans une sauteuse, faire revenir oignon, carotte et ail 5 min à feu moyen. // Ajouter {boeufmorc} de bœuf haché, l’émietter 5 min à feu vif jusqu’à coloration. Verser {tomconc} de tomates, saler, poivrer, une pincée de sucre. // Mijoter 25 min à feu doux, à moitié couvert. // Cuire {pates} de spaghetti selon le paquet, garder un peu d’eau de cuisson. // Mélanger spaghetti et sauce 1 min. Servir.',
'afcuisse|Préchauffer l’air fryer 3 min à 190 °C. Éplucher {pdt} de pommes de terre, les couper en quartiers de 2 cm, les rincer et bien les sécher. Laver la salade ({salade}). // Mélanger les cuisses de poulet ({cuisse}) avec la moitié de l’huile ({huile}), {epices} d’épices (paprika, ail en poudre, thym), sel et poivre. Les frotter pour bien enrober. // Poser les cuisses dans le panier, peau vers le haut, sans qu’elles se touchent. Cuire 15 min. // Retourner les cuisses, ajouter les pommes de terre mélangées au reste d’huile et salées. Cuire 20 min en secouant le panier à mi-cuisson. // Vérifier la cuisson : la peau doit être dorée et croustillante, le jus clair sans trace rose, ou 75 °C à cœur. Prolonger 3 à 5 min si besoin. // Laisser reposer 3 min, servir avec la salade assaisonnée.',
'affrites|Préchauffer l’air fryer 3 min à 200 °C. Éplucher {pdt} de pommes de terre, les couper en bâtonnets de 1 cm, les rincer et les sécher soigneusement : c’est ce qui les rend croustillantes. Laver la salade ({salade}). // Mélanger les bâtonnets avec {huile} d’huile et du sel. Les étaler dans le panier en couche fine (2 fournées si besoin). // Cuire 18 à 20 min en secouant le panier toutes les 6 min, jusqu’à ce qu’elles soient dorées. Les garder au chaud. // Saler et poivrer la viande ({boeufmorc}). La poser dans le panier (ou le plat) et cuire 6 à 8 min à 200 °C en la retournant à mi-cuisson, selon l’épaisseur et la cuisson voulue. // Laisser reposer le steak 2 min. // Servir avec les frites et la salade assaisonnée.',
'afnuggets|Préchauffer l’air fryer 3 min à 190 °C. Éplucher {pdt} de pommes de terre, les couper en quartiers, les rincer, les sécher. Couper {poulet} de poulet en morceaux de 3 cm. // Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s) avec une pincée de sel, chapelure ({chapelure}). // Passer chaque morceau dans la farine, l’œuf, puis la chapelure en appuyant. Vaporiser ou badigeonner légèrement d’huile. // Cuire les potatoes assaisonnées 10 min. Ajouter les nuggets en une couche, cuire encore 10 min en secouant à mi-cuisson. // Vérifier : panure dorée, poulet blanc à cœur. Prolonger 2 min si besoin. // Servir avec le ketchup ({ketchup}).',
'afsaumon|Préchauffer l’air fryer 3 min à 180 °C. Cuire {riz} de riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. Détailler {brocoli} de brocoli en bouquets. Presser le citron ({citron}). // Mélanger {soja} de sauce soja et {miel} de miel, en badigeonner les pavés de saumon ({saumon}). // Poser le saumon, côté peau en dessous, dans le panier. Cuire 8 à 10 min : il doit être laqué et nacré au centre. // Ajouter le brocoli avec un filet d’huile 5 min avant la fin. // Arroser de citron. Servir avec le riz.',
'afpoischiches|Préchauffer l’air fryer 3 min à 190 °C. Égoutter, rincer et sécher les pois chiches ({poischiches} boîte). Couper {courgette} de courgettes et {poivron} de poivron en dés. Hydrater {semoule} de semoule avec de l’eau bouillante salée. // Mélanger pois chiches, légumes, {huile} d’huile, {epices} d’épices (cumin, paprika), sel. // Cuire 15 à 18 min en secouant le panier toutes les 5 min : les pois chiches doivent être croustillants. // Sauce : {yaourt} yaourt(s), sel, un trait de citron. // Égrener la semoule. Servir légumes et pois chiches sur la semoule avec la sauce.',
'affalafel|Égoutter et rincer les pois chiches ({poischiches} boîte), les sécher. Hacher {oignon} d’oignon, ail ({ail}) et herbes ({herbes}). // Mixer pois chiches, oignon, ail, herbes, {epices} d’épices (cumin, coriandre), {farine} de farine, sel, poivre : la pâte doit rester grossière et se tenir. Former des boulettes aplaties de 4 cm. // Préchauffer l’air fryer 3 min à 190 °C. Badigeonner les falafels d’{huile} d’huile. // Cuire 12 à 14 min en les retournant à mi-cuisson, sans les serrer. Ils doivent être bien dorés. // Sauce : {yaourt} yaourt(s), sel, citron. Couper {tomate} de tomates, laver la salade ({salade}). // Chauffer les pitas ({pita}) 1 min. Garnir de falafels, salade, tomate, sauce.',
'afchouf|Préchauffer l’air fryer 3 min à 190 °C. Détailler le chou-fleur ({chouf}) en bouquets de même taille. Hydrater {semoule} de semoule avec de l’eau bouillante salée, couvrir 5 min. // Mélanger le chou-fleur avec {huile} d’huile, {epices} d’épices (cumin, paprika, curcuma), sel, poivre. // Cuire 15 à 18 min en secouant le panier à mi-cuisson : les bords doivent être grillés et la pointe d’un couteau doit entrer facilement. // Égrener la semoule à la fourchette. // Servir le chou-fleur sur la semoule avec une cuillerée de houmous ({houmous}).',
'afcroque|Préchauffer l’air fryer 3 min à 180 °C. Laver la salade ({salade}) et préparer une vinaigrette. // Beurrer légèrement l’extérieur de {painmie} tranche(s) de pain de mie avec {beurre} de beurre. Garnir de {jambon} de jambon et {gruyere} de gruyère, refermer. // Poser dans le panier. Cuire 6 à 8 min en retournant à mi-cuisson, jusqu’à ce que le pain soit doré et le fromage fondu. // Laisser reposer 1 min, couper en deux. Servir avec la salade.',
'afcolin|Préchauffer l’air fryer 3 min à 190 °C. Éplucher {pdt} de pommes de terre, les cuire 20 min à l’eau salée. Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s), chapelure ({chapelure}). // Saler le colin ({colin}). Le passer dans la farine, l’œuf, la chapelure en appuyant. Vaporiser d’huile. // Cuire 10 à 12 min dans le panier en retournant à mi-cuisson. Il doit être doré et s’effeuiller facilement. // Cuire {pois} de petits pois 5 min. Écraser les pommes de terre avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Servir.',
'afsaucisse|Préchauffer l’air fryer 3 min à 180 °C. Éplucher {pdt} de pommes de terre et {carotte} de carottes, les couper en bâtonnets de 1,5 cm. Couper {oignon} d’oignon en quartiers. // Mélanger les légumes avec {huile} d’huile, sel, poivre. Piquer {saucisse} de saucisses à la fourchette. // Cuire les légumes 10 min, puis ajouter les saucisses. Cuire encore 15 min en secouant le panier à mi-cuisson. // Vérifier : saucisses dorées partout et cuites à cœur (aucun jus rosé), légumes tendres. // Servir.',
'afpatedouce|Préchauffer l’air fryer 3 min à 190 °C. Éplucher {patatedouce} de patate douce, la couper en bâtonnets de 1 cm. Couper {poulet} de poulet en lanières. Presser le citron ({citron}). // Mélanger le poulet avec {epices} d’épices (paprika, cumin), sel, poivre et la moitié de l’huile ({huile}). Mélanger la patate douce avec le reste. // Cuire la patate douce 8 min, puis ajouter le poulet. Cuire 10 à 12 min en secouant le panier à mi-cuisson. // Sauce : {yaourt} yaourt(s), jus de citron, sel. // Vérifier : poulet blanc à cœur, frites dorées. Servir avec la sauce.',
'afmerguez|Préchauffer l’air fryer 3 min à 190 °C. Éplucher {pdt} de pommes de terre, couper en cubes de 2 cm. Couper {poivron} de poivron en gros morceaux. // Mélanger pommes de terre et poivron avec {huile} d’huile, sel. Cuire 10 min en secouant à mi-cuisson. // Ajouter les merguez ({merguez}), cuire 10 à 12 min en les retournant à mi-cuisson, jusqu’à ce qu’elles soient bien dorées et cuites à cœur. // Sauce : {yaourt} yaourt(s), sel, poivre. // Servir.',
'afchevre|Préchauffer l’air fryer 3 min à 190 °C. Trancher {baguette} de baguette en tranches de 1,5 cm. Laver la salade ({salade}). // Poser {chevre} de chèvre en rondelles sur chaque tranche. Les placer dans le panier. // Cuire 5 à 6 min, jusqu’à ce que le fromage soit doré et fondant. // Napper de {miel} de miel. // Assaisonner la salade avec {huile} d’huile, sel, poivre. Servir les tartines dessus.',
'afboulettes|Préchauffer l’air fryer 3 min à 190 °C. Hacher {oignon} d’oignon et ail ({ail}). Mélanger {boeufmorc} de bœuf, oignon, {chapelure} de chapelure, {oeufs} œuf(s), sel, poivre. Former des boulettes de 3 cm. // Cuire dans le panier 8 à 10 min en les retournant à mi-cuisson. // Pendant ce temps, chauffer {tomconc} de tomates avec l’ail, sel, poivre, 10 min dans une casserole. // Hydrater {semoule} de semoule avec de l’eau bouillante salée, couvrir 5 min, égrener. // Mettre les boulettes dans la sauce 2 min. Servir sur la semoule.',
'afcrevettes|Préchauffer l’air fryer 3 min à 190 °C. Cuire {riz} de riz. Décongeler les crevettes ({crevettes}), les éponger. Laver la salade ({salade}). // Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s), chapelure ({chapelure}). // Paner les crevettes (farine, œuf, chapelure), vaporiser d’huile. // Cuire 6 à 8 min en une seule couche, en les retournant à mi-cuisson : elles doivent être dorées. // Servir sur le riz avec la mayonnaise ({mayo}) et la salade.',
'micropdt|Laver et piquer plusieurs fois les pommes de terre ({pdt}) à la fourchette. Râper {gruyere} de gruyère, couper {jambon} de jambon en petits dés. Laver la salade ({salade}). // Les cuire au micro-ondes 8 à 10 min à pleine puissance dans un plat, en les retournant à mi-cuisson : elles sont prêtes quand un couteau entre sans résistance. // Les laisser tiédir 2 min, les ouvrir en deux et creuser un peu la chair. // Mélanger la chair avec jambon, {cremeliq} de crème, la moitié du gruyère, poivre. Remplir les pommes de terre, couvrir du reste de gruyère. // Remettre 2 min au micro-ondes (ou 5 min sous le gril) pour faire fondre. // Servir avec la salade.',

/* ---------- Réglages et état ---------- */
const DEF_S={stores:['lidl'],store:'lidl',budget:50,adults:2,kids:0,diet:'tout',allergens:[],dislikes:[],maxMin:45,four:true,airfryer:false,micro:true,mixeur:false,multi:false,days:[0,1,2,3,4],staples:true};
const clone=o=>JSON.parse(JSON.stringify(o));
function newState(){return {v:2,onboarded:false,updatedAt:0,s:clone(DEF_S),plan:{week:'',meals:[],checked:{},split:false,shopped:null},pantry:{},ov:{},hist:[],recent:[],fav:[],custom:{recipes:[],ings:{}}};}
let RP=null; // relevé quotidien {updated,count,source} (docs/prices.json)
const PRKEY='ticketmenu.prices';
function applyPrices(d){
  if(!d||!d.prices||!d.updated)return false;
  for(const s in d.prices)for(const id in d.prices[s]){const v=d.prices[s][id];if(v>0&&ING[id]){(COMM[s]=COMM[s]||{});if(!(COMM[s][id]>0))COMM[s][id]=v;}}
  RP={updated:d.updated,count:d.count||0,source:d.source||''};return true;
}
async function loadPrices(){
  try{const c=JSON.parse(localStorage.getItem(PRKEY)||'null');if(c)applyPrices(c);}catch(e){}
  try{
    if(typeof fetch!=='function'||!/^https?:/.test(location.protocol)||/jsdom/i.test(navigator.userAgent))return;
    const r=await fetch('prices.json',{cache:'no-cache'});if(!r.ok)return;
    const d=await r.json();
    if(applyPrices(d)){try{localStorage.setItem(PRKEY,JSON.stringify(d));}catch(e){}render();}
  }catch(e){}
}
let COMM={}; // prix communautaires {enseigne:{ingrédient: prix du paquet}} (fournis par le serveur si présent)
const portions=s=>Math.max(0.6,s.adults+0.6*s.kids);
const storeOf=id=>STORES.find(x=>x.id===id)||STORES[1];
function allowed(s){
  return R.filter(x=>{
    if(s.diet==='nopork'&&x.pork)return false;
    if(s.diet==='veg'&&!x.veg)return false;
    if(x.al.some(a=>s.allergens.includes(a)))return false;
    if(Object.keys(x.ing).some(k=>s.dislikes.includes(k)))return false;
    if(x.min>s.maxMin)return false;
    if(x.four&&!(s.four||(s.airfryer&&x.af)))return false;
    if(x.air&&!s.airfryer)return false;
    if(x.micro&&!s.micro)return false;
    if(x.multi&&!s.multi)return false;
    if(x.mixeur&&!s.mixeur)return false;
    return true;
  });
}
/* ---------- Prix ---------- */
function estPrice(id,store){const g=ING[id],st=storeOf(store);return Math.round(g.price*st.i*st.a[g.a]*100)/100;}
function priceAt(st,id,store,useOv){
  const o=useOv!==false&&st.ov[store]&&st.ov[store][id];
  if(o>0)return o;
  const c=COMM[store]&&COMM[store][id];
  if(c>0)return c;
  return estPrice(id,store);
}
function bestPrice(st,id,split){
  const list=split&&st.s.stores.length>1?st.s.stores:[st.s.store];
  let best=null;
  for(const sid of list){const p=priceAt(st,id,sid);if(!best||p<best.price)best={price:p,store:sid};}
  return best;
}
// Besoins agrégés, moins le placard, puis paquets entiers à acheter.
function buildLines(rids,st,opt){
  opt=opt||{};
  const split=opt.split!==undefined?opt.split:st.plan.split, port=portions(st.s), need={};
  for(const rid of rids){
    const rec=R.find(x=>x.id===rid);if(!rec)continue;
    for(const k in rec.ing){
      if(st.s.staples&&ING[k].s)continue;
      need[k]=(need[k]||0)+rec.ing[k]*port;
    }
  }
  return Object.keys(need).map(id=>{
    const g=ING[id],stock=(st.pantry[id]&&st.pantry[id].qty)||0,net=Math.max(0,need[id]-stock);
    const packs=net>1e-9?Math.ceil(net/g.p-1e-9):0;
    let price,store;
    if(opt.store){price=priceAt(st,id,opt.store,opt.useOv);store=opt.store;}
    else{const b=bestPrice(st,id,split);price=b.price;store=b.store;}
    return {id,need:need[id],stock,net,packs,price,store,cost:Math.round(packs*price*100)/100,left:packs>0?packs*g.p-net:0};
  }).sort((a,b)=>ING[a.id].a-ING[b.id].a||ING[a.id].n.localeCompare(ING[b.id].n,'fr'));
}
const sum=L=>Math.round(L.reduce((a,l)=>a+l.cost,0)*100)/100;
const planIds=st=>st.plan.meals.map(m=>m.rid);
const curLines=st=>buildLines(planIds(st),st);
const totalAt=(st,store,useOv)=>sum(buildLines(planIds(st),st,{store,useOv}));
const priciest=st=>Math.max(...STORES.map(x=>totalAt(st,x.id,false)));

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickMenu(st){
  const S=st.s,P=allowed(S),n=S.days.length;
  const fixed=[];for(let i=0;i<n;i++){const m=st.plan.meals[i];fixed.push(m&&m.locked?m.rid:null);}

  let best=null,bestScore=-Infinity;
  for(let t=0;t<600;t++){
    const sh=shuffle(cand),cnt={},pick=[];
    fixedIds.forEach(id=>{const g=R.find(x=>x.id===id).g;cnt[g]=(cnt[g]||0)+1;});
    for(const x of sh){if(pick.length>=k)break;if((cnt[x.g]||0)<cap){pick.push(x);cnt[x.g]=(cnt[x.g]||0)+1;}}
    for(const x of sh){if(pick.length>=k)break;if(!pick.includes(x))pick.push(x);}
    const ids=fixedIds.concat(pick.map(x=>x.id)),L=buildLines(ids,st),cost=sum(L);
    const waste=L.reduce((a,l)=>a+(l.packs>0?l.left/ING[l.id].p*l.price:0),0);
    const groups=new Set(ids.map(id=>R.find(x=>x.id===id).g)).size;
    const rep=pick.filter(x=>recent.includes(x.id)).length,fv=pick.filter(x=>(st.fav||[]).includes(x.id)).length;
    const score=groups*6-waste*0.4-rep*2.5+fv*3+(cost<=S.budget?0:-500-(cost-S.budget)*10);
    if(score>bestScore){bestScore=score;best=pick.map(x=>x.id);}
  }

  for(let i=0;i<n;i++){if(fixed[i])out.push(fixed[i]);else if(j<best.length)out.push(best[j++]);}
  return out;
}

// Brouillon -> {rec, ings} prêt à être rangé dans state.custom
function draftToRecipe(d,st){
  const ings={},ing={};
  const taken=i=>!!ING[i]||!!ings[i];
  for(const row of d.rows){
    if(!row.id||row.amt==null||!(row.amt>0))continue;
    let id=row.id;
    if(id==='__new'){
      const o=newIngFor(row,taken);ings[o.id]=o;id=o.id;
    }
    if(!ING[id]&&!ings[id])continue;
    ing[id]=(ing[id]||0)+row.amt/Math.max(1,d.serves);
  }
  Object.keys(ing).forEach(k=>{ing[k]=Math.round(ing[k]*1000)/1000;});
  const prev=d.rid&&((st.custom&&st.custom.recipes)||[]).find(x=>x.id===d.rid);
  const rec={id:d.rid||newId('u_',i=>R.some(x=>x.id===i)),n:(d.name||'Recette importée').trim().slice(0,90),g:d.g||groupOf(ing),min:Math.max(5,Math.round(d.min)||30),lvl:d.lvl||'facile',mat:d.mat||'',ing,
    steps:d.steps.map(s=>String(s).trim()).filter(Boolean).slice(0,40),img:d.img||'',src:d.src||''};
  if(prev&&!d.g)rec.g=groupOf(ing);
  return {rec,ings};
}
function saveCustom(st,d){
  const {rec,ings}=draftToRecipe(d,st);
  if(!Object.keys(rec.ing).length)return null;
  st.custom=st.custom||{recipes:[],ings:{}};
  // Les ingrédients créés restent disponibles pour les prochaines recettes
  for(const k in ings){
    const o=ings[k];
    // plusieurs recettes d'un même lot peuvent créer le même ingrédient : on réutilise le premier
    const dup=Object.keys(st.custom.ings).find(x=>norm(st.custom.ings[x].n)===norm(o.n)&&st.custom.ings[x].u===o.u);
    if(dup){const v=rec.ing[k];delete rec.ing[k];rec.ing[dup]=(rec.ing[dup]||0)+v;}
    else st.custom.ings[k]=o;
  }
  const i=st.custom.recipes.findIndex(x=>x.id===rec.id);
  if(i>=0)st.custom.recipes[i]=rec;else st.custom.recipes.push(rec);
  applyCustom(st);
  return rec;
}
function deleteCustom(st,id){

  st.fav=(st.fav||[]).filter(x=>x!==id);

  const used=new Set();st.custom.recipes.forEach(x=>Object.keys(x.ing).forEach(k=>used.add(k)));
  for(const k of Object.keys(st.custom.ings))if(!used.has(k)&&!st.pantry[k])delete st.custom.ings[k];

}

      '<text x="'+cx+'" y="'+(y-4)+'" text-anchor="middle">'+Math.round(x.total)+'</text><text x="'+cx+'" y="'+(Hh-6)+'" text-anchor="middle">'+dd+'</text>';

}

function compressImage(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const mw=560,sc=Math.min(1,mw/im.width),c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    im.onerror=()=>toast('Photo illisible.');
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function saveDraft(toWeek){
  const d=ui.draft;
  d.name=($('#d-name')?$('#d-name').value:d.name).trim()||'Recette importée';
  let rec=null;
  const photo=d.img&&d.img.slice(0,5)==='data:'?d.img:'';
  if(photo)d.img='';
  commit(s=>{rec=saveCustom(s,d);});
  if(!rec){toast('Ajoute au moins un ingrédient avec une quantité.');if(photo)d.img=photo;return;}
  if(photo){PH[rec.id]=photo;savePhotos();}
  closeSheet();ui.draft=null;ui.tab='recipes';ui.rf='mine';ui.rq='';render();window.scrollTo(0,0);
  if(toWeek){if(!state.plan.meals.length)commit(s=>regen(s));addWeekSheet(rec.id);}
  else toast('Recette ajoutée à tes recettes.');
}
function importBatch(raws){
  let n=0;
  commit(s=>{raws.forEach(raw=>{const d=buildDraft(raw);if(saveCustom(s,d))n++;});});
  closeSheet();ui.tab='recipes';ui.rf='mine';ui.rq='';render();window.scrollTo(0,0);
  toast(n+' recette'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+'. Les prix des produits inconnus sont à vérifier dans la liste.');
}
function runImport(text){
  ui.imp=text;
  const raws=parseRecipeInput(text);
  if(!raws.length){toast('Aucune recette reconnue. Il faut au moins une liste d’ingrédients, une ligne par produit.');return;}
  if(raws.length>1){importBatch(raws);return;}
  ui.draft=buildDraft(raws[0]);draftSheet();
}
/* ---------- Rendu ---------- */
function render(){
  const onb=!state.onboarded;
  $('#onb').hidden=!onb;$('#shell').hidden=onb;
  if(onb){$('#onb').innerHTML=viewOnb();return;}
  renderChrome();
  const v=ui.tab==='week'?viewWeek():ui.tab==='recipes'?viewRecipes():ui.tab==='list'?viewList():ui.tab==='pantry'?viewPantry():ui.tab==='stats'?viewStats():viewSettings();
  const vw=$('#view');vw.innerHTML=v;
  if(ui.enter){const d=ui.enter;ui.enter=null;if(fx()){vw.className='';void vw.offsetWidth;vw.className='enter-'+d;clearTimeout(ui.enterT);ui.enterT=setTimeout(()=>{vw.className='';},650);}}
  if(ui.editing){const el=$('#pe-'+ui.editing);if(el){el.focus();el.select();}}
}
function commitPrice(id,val){
  const idv=ui.editing;ui.editing=null;if(idv!==id)return;
  const v=parseFloat(String(val).replace(',','.'));
  if(v>0){
    const store=bestPrice(state,id,state.plan.split).store;
    commit(s=>{(s.ov[store]=s.ov[store]||{})[id]=Math.round(v*100)/100;});
    if(Sync.api&&Sync.kind==='server'&&!ING[id].c)api('/api/prices/report',{method:'POST',body:JSON.stringify({store,ingredient:id,price:Math.round(v*100)/100})}).catch(()=>{});
  }else render();
}
const MENU_KEYS=['diet','allergens','dislikes','maxMin','four','airfryer','micro','mixeur','multi','budget'];
function setS(k,v){
  commit(s=>{s.s[k]=v;});
  if(MENU_KEYS.includes(k)&&state.onboarded)ui.dirty=true;
  render();
}
function toggleIn(arr,v){return arr.includes(v)?arr.filter(x=>x!==v):arr.concat(v);}
function afterDays(){commit(s=>{fitMeals(s);});}
function reopenSheet(){if(ui.rs&&$('#sheet').open)recipeSheet(ui.rs.rid,ui.rs.i);}

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  hap(6);
  const a=b.dataset.act,i=b.dataset.i===''||b.dataset.i===undefined?null:+b.dataset.i,id=b.dataset.id,k=b.dataset.k,v=b.dataset.v;
  switch(a){
    case 'tab':{if(v!==ui.tab){const o=TABS.indexOf(ui.tab==='stats'?'settings':ui.tab),n=TABS.indexOf(v);ui.enter=n>o?'r':n<o?'l':'u';ui.pop=v;}ui.tab=v;ui.editing=null;ui.confirm=null;render();window.scrollTo(0,0);break;}
    case 'regen':ui.dirty=false;commit(s=>{if(s.plan.shopped)startNewWeek(s);else regen(s);},{undo:true});toast('Semaine recomposée.',true);break;
    case 'newweek':ui.dirty=false;commit(s=>startNewWeek(s));toast('Nouvelle semaine composée. Les restes sont au placard.');break;
    case 'open':recipeSheet(state.plan.meals[i].rid,i);break;
    case 'ropen':recipeSheet(id,null);break;
    case 'close':closeSheet();break;
    case 'swap':{const rid=swapOne(state,i);if(!rid){toast('Aucune autre recette pour tes réglages.');break;}commit(s=>{s.plan.meals[i]={rid,locked:false,done:false};s.plan.checked={};},{undo:true});toast('Dîner remplacé.',true);break;}
    case 'pick':pickSheet(i);break;
    case 'choose':closeSheet();commit(s=>{s.plan.meals[i]={rid:id,locked:false,done:false};s.plan.checked={};},{undo:true});toast('Dîner remplacé.',true);break;
    case 'lock':commit(s=>{s.plan.meals[i].locked=!s.plan.meals[i].locked;});break;
    case 'cook':cookSheet(id||state.plan.meals[i].rid,0,i);break;
    case 'cprev':ui.cookDir='l';cookSheet(ui.cook.rid,Math.max(0,ui.cook.step-1),ui.cook.i);break;
    case 'timer':startTimer(+b.dataset.m||1);break;
    case 'cnext':ui.cookDir='r';cookSheet(ui.cook.rid,ui.cook.step+1,ui.cook.i);break;
    case 'cfin':{const c=ui.cook;closeSheet();if(c.i!==null&&state.plan.meals[c.i]&&state.plan.meals[c.i].rid===c.rid)commit(s=>{s.plan.meals[c.i].done=true;});toast('Bon appétit.');break;}
    case 'undo':if(ui.undo){state=ui.undo;applyCustom(state);ui.undo=null;state.updatedAt=Date.now();saveLocal();schedulePush();$('#toast').hidden=true;render();}break;
    case 'fav':commit(s=>{s.fav=toggleIn(s.fav||[],id);});reopenSheet();break;
    case 'rfilter':if(v==='surprise'){const pool=allowed(state.s).filter(x=>!state.plan.meals.some(m=>m.rid===x.id));if(pool.length){recipeSheet(pool[Math.floor(Math.random()*pool.length)].id,null);}else toast('Aucune recette ne correspond à tes réglages.');break;}
      ui.rf=v;render();break;
    case 'rall':ui.rall=!ui.rall;render();break;
    case 'addweek':if(!state.plan.meals.length)commit(s=>regen(s));addWeekSheet(id);break;
    case 'setday':closeSheet();commit(s=>{s.plan.meals[i]={rid:id,locked:true,done:false};s.plan.checked={};},{undo:true});toast('Ajoutée pour '+DAYS[state.s.days[i]]+'.',true);break;
    case 'addr':ui.imp='';importSheet();break;
    case 'impgo':runImport($('#imp').value);break;
    case 'impclip':{const fb=()=>toast('Presse-papiers inaccessible : colle le texte dans la zone avec un appui long.');try{navigator.clipboard.readText().then(t=>{if(!t||!t.trim()){toast('Le presse-papiers est vide.');return;}$('#imp').value=t;runImport(t);},fb);}catch(err){fb();}break;}
    case 'impblank':ui.draft={rid:null,name:'',serves:4,min:30,lvl:'facile',mat:'',img:'',src:'',g:'',rows:[],steps:[]};draftSheet();break;
    case 'bmcopy':{const t=BOOKMARKLET,ta=$('#bm');ta.focus();ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('Code copié.'),()=>toast('Code sélectionné : copie-le à la main.'));}catch(err){toast('Code sélectionné : copie-le à la main.');}break;}
    case 'drm':ui.draft.rows.splice(+k,1);refreshRows();break;
    case 'dserves':{const d=ui.draft;d.serves=Math.min(24,Math.max(1,d.serves+ +b.dataset.d));$('#d-serves').textContent=d.serves;break;}
    case 'dadd':{const inp=$('#d-add'),p=parseIngLine(inp.value);if(!p||p.id==='ign'){toast('Rien à ajouter : écris par exemple « 200 g de farine ».');break;}if(!p.id){if(!p.name){toast('Ingrédient non reconnu.');break;}p.id='__new';p.amt=newAmt(p);}ui.draft.rows.push(p);inp.value='';refreshRows();break;}
    case 'dsave':saveDraft(false);break;
    case 'dsaveweek':saveDraft(true);break;
    case 'redit':{const rec=recOf(id);if(rec){ui.draft=draftFromRecipe(rec);draftSheet();}break;}
    case 'rdel':ui.confirm='rdel:'+id;reopenSheet();break;
    case 'rdel-no':ui.confirm=null;reopenSheet();break;
    case 'rdel-yes':closeSheet();commit(s=>deleteCustom(s,id));toast('Recette supprimée.');break;
    case 'split':commit(s=>{s.plan.split=!s.plan.split;});break;
    case 'hide':ui.hideChecked=!ui.hideChecked;render();break;
    case 'edit':ui.editing=id;render();break;
    case 'have':commit(s=>{const l=buildLines(planIds(s),s).find(x=>x.id===id);if(l)haveIt(s,id,l.need);},{undo:true});toast('Ajouté au placard.',true);break;
    case 'buyback':commit(s=>{const l=buildLines(planIds(s),s).find(x=>x.id===id);if(l){s.pantry[id].qty=Math.max(0,s.pantry[id].qty-l.need);if(s.pantry[id].qty<=0)delete s.pantry[id];}});break;
    case 'uncheck':commit(s=>{s.plan.checked={};});break;
    case 'resetp':commit(s=>{s.ov={};});toast('Prix estimés rétablis.');break;
    case 'share':{try{navigator.share({title:'Liste de courses',text:listText(state)}).catch(()=>{});}catch(x){}break;}
    case 'copy':{const t=listText(state),ta=$('#fallback');const fb=()=>{ta.hidden=false;ta.value=t;ta.focus();ta.select();toast('Copie automatique impossible : texte sélectionné.');};try{navigator.clipboard.writeText(t).then(()=>toast('Liste copiée.'),fb);}catch(err){fb();}break;}
    case 'done':ui.confirm='done';render();break;
    case 'done-no':ui.confirm=null;render();break;
    case 'done-yes':ui.confirm=null;commit(s=>{validateWeek(s);});toast('Courses enregistrées dans ton bilan.');break;
    case 'padd':{const g=ING[id];commit(s=>{s.pantry[id]={qty:g.p,at:Date.now()};});ui.pq='';render();const q=$('#pq');if(q)q.focus();break;}
    case 'pinc':commit(s=>{s.pantry[id].qty+=Math.max(1,Math.round(ING[id].p/5));});break;
    case 'pdec':commit(s=>{s.pantry[id].qty-=Math.max(1,Math.round(ING[id].p/5));if(s.pantry[id].qty<=0)delete s.pantry[id];});break;
    case 'prm':commit(s=>{delete s.pantry[id];},{undo:true});toast('Retiré du placard.',true);break;
    case 'mainstore':commit(s=>{s.s.store=id;if(!s.s.stores.includes(id))s.s.stores.push(id);});break;
    case 'pickstore':commit(s=>{s.s.store=id;s.s.stores=[id];});break;
    case 'chip':{const cur=k==='days'?state.s.days.map(String):state.s[k];let nxt=toggleIn(cur,v);
      if(k==='days'){nxt=nxt.map(Number).sort((x,y)=>x-y);if(!nxt.length)break;setS('days',nxt);if(state.onboarded)afterDays();else render();}
      else setS(k,nxt);break;}
    case 'seg':setS(k,k==='maxMin'?+v:v);break;
    case 'step':{const lim=k==='adults'?[1,8]:[0,8];commit(s=>{s.s[k]=Math.min(lim[1],Math.max(lim[0],s.s[k]+ +b.dataset.d));});break;}
    case 'budgetq':setS('budget',+v);break;
    case 'onb-next':ui.onb=Math.min(4,ui.onb+1);render();break;
    case 'onb-back':ui.onb=Math.max(0,ui.onb-1);render();break;
    case 'onb-skip':ui.onb=1;render();break;
    case 'onb-finish':commit(s=>{s.onboarded=true;regen(s);});ui.tab='week';ui.onb=0;render();break;
    case 'onb':commit(s=>{s.onboarded=false;});ui.onb=0;render();break;
    case 'export':{const t=JSON.stringify(state),ta=$('#io');ta.hidden=false;ta.value=t;ta.focus();ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('Données copiées.'),()=>toast('Texte sélectionné, copie-le à la main.'));}catch(err){toast('Texte sélectionné, copie-le à la main.');}break;}
    case 'import':{const ta=$('#io');if(ta.hidden||!ta.value.trim()){ta.hidden=false;ta.value='';ta.placeholder='Colle ici tes données puis touche Importer de nouveau.';ta.focus();break;}
      try{const d=JSON.parse(ta.value);if(d.v!==2||!d.s)throw 0;adopt(d);state.updatedAt=Date.now();saveLocal();schedulePush();toast('Données importées.');}catch(err){toast('Données invalides.');}break;}
    case 'reset':ui.confirm='reset';render();break;
    case 'reset-no':ui.confirm=null;render();break;
    case 'reset-yes':ui.confirm=null;state=newState();applyCustom(state);state.updatedAt=Date.now();saveLocal();schedulePush();ui.onb=0;render();break;
    case 'login':case 'register':case 'forgot':(Sync.fb?fbAccount:accountAction)(a);break;
    case 'logout':if(Sync.fb){FB.m.signOut(FB.auth).catch(()=>{});break;}api('/api/auth/logout',{method:'POST'}).catch(()=>{}).then(()=>{ui.account=null;Sync.kind='local';ui.sync='Local (non connecté)';render();});break;
  }
});
async function accountAction(a){
  const email=$('#acc-email').value.trim(),password=$('#acc-pass').value;
  try{
    const r=await api(a==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});
    ui.account=r.user;Sync.kind='server';ui.msg='';
    const s=await api('/api/state');
    // Les données du compte font foi : on les retrouve en se connectant. Sans données, on envoie celles de cet appareil.
    if(s.state&&s.state.v===2)adopt(s.state);else schedulePush();
    ui.sync='Synchronisé avec ton compte';render();
  }catch(e){ui.msg=e.message||'Erreur';const m=$('#accmsg');if(m)m.textContent=ui.msg;}
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ck||t.dataset.done!==undefined)hap(10);
  if(t.dataset.ck){commit(s=>{s.plan.checked[t.dataset.ck]=t.checked;});}
  else if(t.dataset.done!==undefined){commit(s=>{s.plan.meals[+t.dataset.done].done=t.checked;});}
  else if(t.dataset.store){
    const id=t.dataset.store;
    if(!t.checked&&state.s.stores.length===1){t.checked=true;toast('Garde au moins une enseigne.');return;}
    commit(s=>{s.s.stores=t.checked?s.s.stores.concat(id):s.s.stores.filter(x=>x!==id);if(!s.s.stores.includes(s.s.store))s.s.store=s.s.stores[0];if(s.s.stores.length<2)s.plan.split=false;});
  }
  else if(t.dataset.set){setS(t.dataset.set,t.checked);}
  else if(t.dataset.dsel!==undefined){
    const r=ui.draft.rows[+t.dataset.dsel],val=t.value;
    if(val===''){r.id='';}
    else if(val==='__new'){r.id='__new';r.amt=newAmt(r);}
    else recompute(r,val);
    refreshRows();
  }
  else if(t.id==='photo-in'&&t.files&&t.files[0]){const rid=t.dataset.rid;compressImage(t.files[0],url=>{PH[rid]=url;savePhotos();render();reopenSheet();toast('Photo enregistrée sur cet appareil.');});}
  else if(t.id==='d-photo'&&t.files&&t.files[0]){compressImage(t.files[0],url=>{ui.draft.img=url;const lb=document.querySelector('label[for="d-photo"]');if(lb)lb.textContent='Photo ajoutée ✓';});}
  else if(t.id==='set-budget'||t.id==='ob-budget'){setS('budget',+t.value);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='set-budget'||t.id==='ob-budget'){const bv=$('#budgetVal')||$('#ob-bval');if(bv)bv.textContent=fe(+t.value);const hint=$('#ob-hint');if(hint)hint.textContent='≈ '+fe(+t.value/(state.s.days.length*portions(state.s)))+' par portion et par dîner';}
  else if(t.id==='pq'){ui.pq=t.value;$('#pres').innerHTML=pantryResults();}
  else if(t.id==='rq'){ui.rq=t.value;$('#rgrid').innerHTML=recipeGrid();}
  else if(t.dataset.dq!==undefined){const v=parseFloat(String(t.value).replace(',','.'));ui.draft.rows[+t.dataset.dq].amt=isNaN(v)?null:v;}
  else if(t.id==='d-name'){ui.draft.name=t.value;}
  else if(t.id==='d-min'){ui.draft.min=+t.value||30;}
  else if(t.id==='d-img'){const u=t.value.trim();if(!ui.draft.img||ui.draft.img.slice(0,5)!=='data:')ui.draft.img=/^https?:\/\//.test(u)?u:'';}
  else if(t.id==='d-steps'){ui.draft.steps=t.value.split('\n').map(x=>x.trim()).filter(Boolean);}
});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('pin')&&ui.editing)commitPrice(ui.editing,e.target.value);});
let SW=null;
document.addEventListener('touchstart',e=>{if(ui.cook&&e.target.closest('#sheet')&&e.touches.length===1)SW={x:e.touches[0].clientX,y:e.touches[0].clientY};else SW=null;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!SW||!ui.cook)return;const t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;SW=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;
  const b=$(dx<0?'#cnext':'#cprev');if(b&&!b.disabled)b.click();
},{passive:true});
document.addEventListener('keydown',e=>{
  if(ui.cook&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const b=$(e.key==='ArrowRight'?'#cnext':'#cprev');if(b&&!b.disabled){e.preventDefault();b.click();}return;}
  if(e.target.id==='d-add'&&e.key==='Enter'){e.preventDefault();$('#dadd').click();return;}
  if(!(e.target.classList&&e.target.classList.contains('pin')))return;
  if(e.key==='Enter'){e.preventDefault();e.target.blur();}
  else if(e.key==='Escape'){ui.editing=null;render();}
});

if(!loadLocal()){state=newState();applyCustom(state);}
render();
initBackend();
if((document.querySelector('meta[name="tm-server"]')||document.querySelector('meta[name="tm-firebase"]'))&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
</script>
</body></html>
