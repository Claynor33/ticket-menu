'nouilleschick|Cuire {nouilles} de nouilles selon le paquet, égoutter, passer sous l’eau froide. Hacher {ail} gousse(s) d’ail, râper {gingembre} de gingembre. Couper {poulet} de poulet en lamelles. // Chauffer {huile} d’huile dans un wok à feu vif. Saisir le poulet 5 min en remuant. // Ajouter ail et gingembre 30 s, puis {poelee} de poêlée de légumes. Sauter 5 min. // Ajouter les nouilles et {soja} de sauce soja, sauter 3 min pour bien enrober. // Goûter, ajuster. Servir tout de suite.',
'nouillesveg|Mettre une casserole d’eau à bouillir. Râper {carotte} de carottes. Sortir la poêlée de légumes ({poelee}) et les œufs ({oeufs}). // Plonger {nouilles} de nouilles dans l’eau bouillante, cuire selon le paquet (3 à 4 min), égoutter et rincer à l’eau froide pour stopper la cuisson. // Chauffer {huile} d’huile dans un wok ou une grande poêle à feu vif. Sauter la carotte et la poêlée de légumes 5 à 6 min, en remuant, jusqu’à ce qu’ils soient tendres mais encore croquants. // Pousser les légumes sur le côté, casser {oeufs} œuf(s) dans le vide et les brouiller 1 min. // Ajouter les nouilles et {soja} de sauce soja, mélanger et sauter 3 min pour tout enrober. Goûter avant de resaler : la sauce soja est déjà salée.',
'poulcitron|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, couper en quartiers. Presser le citron ({citron} pièce). Écraser {ail} gousse(s) d’ail. // Mettre pommes de terre et cuisses de poulet ({cuisse}) dans un plat. Ajouter l’ail, {huile} d’huile, le jus de citron, sel, poivre, thym. Bien mélanger. // Enfourner 45 min. Retourner les pommes de terre et arroser le poulet à mi-cuisson. // Le poulet est cuit quand le jus qui s’écoule est clair. Sinon prolonger 5 à 10 min. // Servir avec le jus de cuisson.',
'dindecreme|Mesurer {riz} de riz et le cuire dans 2 fois son volume d’eau salée. Émincer {oignon} d’oignon et {champi} de champignons. // Saisir {dinde} d’escalopes de dinde dans un peu de matière grasse, 3 min par face, saler. Les retirer. // Dans la même poêle, faire revenir oignon et champignons 6 min. // Verser {creme} de crème, remettre la dinde, laisser mijoter 5 min à feu doux. La dinde doit être blanche, sans trace rosée. // Servir sur le riz avec la sauce.',
'bourguignon|Éplucher {oignon} d’oignon et {carotte} de carottes. Couper {boeufmorc} de bœuf en cubes de 3 cm. Éplucher {pdt} de pommes de terre. // Chauffer {huile} d’huile dans une cocotte, saisir le bœuf par petites quantités pour bien le colorer. Ajouter l’oignon, cuire 3 min. // Saupoudrer de {farine} de farine, mélanger 1 min. Ajouter {concentre} de concentré de tomate, le bouillon dilué et de l’eau à hauteur. // Ajouter les carottes en rondelles, saler, poivrer, laurier. Couvrir. // Mijoter 1 h à feu très doux, puis ajouter les pommes de terre en gros morceaux et cuire encore 30 min. // La viande doit se couper à la cuillère. Servir bien chaud.',
'tajine|Émincer {oignon} d’oignon, couper {carotte} de carottes et {courgette} de courgettes en gros morceaux. Égoutter les pois chiches. Mesurer {semoule} de semoule. // Dorer les cuisses ({cuisse}) dans {huile} d’huile 5 min par face dans une cocotte. Ajouter l’oignon et {epices} d’épices (cumin, paprika, cannelle). // Ajouter les carottes, un verre d’eau, saler, couvrir, mijoter 15 min. // Ajouter courgettes et pois chiches, cuire 20 min. // Hydrater la semoule dans de l’eau bouillante salée, 5 min, égrener. Servir le tajine sur la semoule.',
'merguezsem|Couper courgette ({courgette}) et poivron ({poivron}) en dés. Mesurer {semoule} de semoule. // Cuire les merguez ({merguez}) 10 à 12 min dans une poêle à feu moyen en les retournant, jusqu’à ce qu’elles soient bien colorées. // Retirer les merguez, faire sauter les légumes dans la graisse avec {huile} d’huile 8 min. Saler. // Verser la semoule dans un saladier, couvrir d’eau bouillante salée à hauteur, couvrir 5 min, égrener. // Servir merguez, légumes et semoule.',
'chorizopdt|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre et les couper en cubes de 2 cm (pour qu’ils cuisent tous en même temps). Couper {poivron} de poivron et {oignon} d’oignon en gros morceaux, {chorizo} de chorizo en rondelles de 5 mm. // Verser pommes de terre, poivron, oignon et {huile} d’huile dans un grand plat. Saler légèrement, poivrer, ajouter une cuillère de paprika si tu en as. Mélanger avec les mains. // Disposer en une seule couche, sinon les légumes vapeurent au lieu de rôtir. Enfourner 25 min. // Sortir le plat, ajouter le chorizo, mélanger et remettre 15 min. // Les pommes de terre sont prêtes quand elles sont dorées et fondantes à cœur. Servir directement dans le plat.',
'ricecanto|Cuire {riz} de riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. L’étaler dans une assiette pour qu’il refroidisse : un riz froid et sec saute mieux qu’un riz chaud. // Couper {carotte} de carottes et {jambon} de jambon en tout petits dés (environ 5 mm). // Chauffer {huile} d’huile dans un wok à feu vif. Faire sauter la carotte 3 min, ajouter {pois} de petits pois et cuire 3 min. // Ajouter le jambon 1 min. Pousser sur le côté, casser {oeufs} œuf(s) et les brouiller 1 min. // Ajouter le riz, verser {soja} de sauce soja et sauter 3 à 4 min à feu vif, en remuant sans arrêt. Les grains doivent se détacher. // Goûter, poivrer. Servir immédiatement.',
'chilisin|Émincer {oignon} d’oignon et couper {poivron} de poivron en petits dés. Égoutter et rincer les haricots rouges ({haricotsr} boîte) ainsi que le maïs ({mais}). Mesurer {riz} de riz. // Chauffer {huile} d’huile dans une sauteuse, cuire oignon et poivron 6 min à feu moyen. Ajouter {epices} d’épices (cumin, paprika, piment) et mélanger 1 min. // Verser {tomconc} de tomates concassées, ajouter haricots et maïs, saler, poivrer. // Laisser mijoter 20 min à feu doux, à moitié couvert, en remuant de temps en temps. La sauce doit être épaisse. // Cuire le riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. // Servir le chili sur le riz.',
'currypat|Éplucher {patatedouce} de patate douce et la couper en dés de 2 cm. Émincer {oignon} d’oignon. Rincer {lentcorail} de lentilles corail jusqu’à ce que l’eau soit claire. // Faire revenir l’oignon dans un filet d’huile 4 min. Ajouter {curry} de curry, mélanger 30 s. // Ajouter patate douce, lentilles, {laitcoco} de lait de coco et 30 cl d’eau. Saler. // Porter à frémissement et cuire 20 min en remuant de temps en temps : les lentilles s’écrasent et épaississent la sauce. // Ajouter {epinards} d’épinards, laisser tomber 2 min. Servir avec du riz ou du pain.',
'veloutepatate|Éplucher {patatedouce} de patate douce et {oignon} d’oignon, les couper en morceaux réguliers. // Les mettre dans une casserole avec le bouillon ({bouillon} cube) et de l’eau à hauteur. Porter à ébullition puis cuire 20 min à frémissement, jusqu’à ce que la patate douce s’écrase à la fourchette. // Ajouter {laitcoco} de lait de coco et {curry} de curry. // Mixer longuement pour une texture très lisse, en ajoutant de l’eau chaude si c’est trop épais. // Goûter, rectifier le sel, poivrer. Servir chaud avec un filet d’huile d’olive.',
'omeherbes|Laver et essorer la salade ({salade}), préparer la vinaigrette. Ciseler {herbes} botte(s) d’herbes fraîches (persil, ciboulette). // Casser {oeufs} œuf(s) dans un bol, ajouter les herbes, sel, poivre. Battre à la fourchette juste ce qu’il faut. // Faire fondre {beurre} de beurre dans une poêle antiadhésive à feu moyen, sans le laisser brunir. Verser les œufs. // Remuer 30 s avec une spatule en ramenant les bords vers le centre, puis laisser prendre 1 min. // Quand le dessous est doré et le dessus encore un peu baveux, plier l’omelette en deux. Servir tout de suite avec la salade et du pain ({baguette}).',
'oeufscocotte|Préchauffer le four à 180 °C. Beurrer des ramequins avec une partie du beurre ({beurre}). // Faire tomber {epinards} d’épinards dans le reste de beurre 3 min, saler. Répartir dans les ramequins. // Casser un œuf dans chaque ramequin ({oeufs} œufs en tout). Ajouter {creme} de crème, gruyère ({gruyere}), poivre. // Cuire 10 min au bain-marie ou au four : le blanc doit être pris, le jaune encore coulant. // Servir avec des mouillettes de pain.',
'quichelorr|Préchauffer le four à 180 °C. Dérouler la pâte brisée ({brisee} pâte) dans un moule en gardant le papier, piquer le fond à la fourchette. Râper {gruyere} de gruyère. // Faire dorer {lardons} de lardons dans une poêle sans matière grasse, 3 à 4 min. Les égoutter sur du papier absorbant, puis les répartir sur la pâte. // Dans un saladier, battre {oeufs} œuf(s) avec {creme} de crème et {lait} de lait. Ajouter poivre et muscade, très peu de sel (lardons et gruyère sont salés). // Verser l’appareil sur les lardons et parsemer de gruyère. // Cuire 35 min. La quiche est prête quand elle est dorée et ne tremble plus au centre. Laisser tiédir 5 min avant de découper.',
'tartetomate|Préchauffer le four à 200 °C. Laver et couper {tomate} de tomates en rondelles de 5 mm. Les poser sur du papier absorbant 10 min avec une pincée de sel pour qu’elles rendent leur eau. // Dérouler la pâte feuilletée ({feuillet} pâte) sur une plaque avec son papier cuisson. Piquer le centre à la fourchette en laissant 1 cm de bord. // Tartiner généreusement de {moutarde} de moutarde, puis couvrir de {gruyere} de gruyère râpé. // Disposer les tomates épongées en les chevauchant. Poivrer, ajouter un filet d’huile et des herbes de Provence. // Cuire 25 min : la pâte doit être gonflée et dorée. Parsemer d’herbes fraîches ({herbes}) et servir tiède.',
'flamm|Préchauffer le four à 220 °C. Peler et émincer {oignon} d’oignon en fines lamelles. // Étaler {pizzapate} pâte très finement sur du papier cuisson. // Napper de {creme} de crème épaisse en laissant 1 cm de bord. Saler très peu, poivrer, muscade. // Répartir oignons, {lardons} de lardons et {gruyere} de gruyère. // Cuire 12 à 15 min : les bords doivent être croustillants, les oignons dorés. Servir tout de suite, en parts.',
'margherita|Préchauffer le four à 220 °C avec la plaque dedans. Égoutter {mozza} de mozzarella et la couper en tranches, éponger avec du papier absorbant (sinon la pizza sera détrempée). // Dérouler {pizzapate} pâte à pizza. Étaler {tomconc} de tomates, saler, ajouter un filet d’huile ({huile}) et de l’origan. // Répartir la mozzarella. // Glisser sur la plaque chaude. Cuire 12 à 15 min jusqu’à ce que les bords soient dorés. // Parsemer de basilic frais ({herbes}) à la sortie du four.',
'pizzachor|Préchauffer le four à 220 °C avec la plaque dedans. Couper {chorizo} de chorizo en rondelles fines, {poivron} de poivron en lanières. Râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte à pizza sur du papier cuisson. Étaler {tomconc} de tomates, saler, poivrer. // Répartir poivron et chorizo, puis la mozzarella. // Cuire 12 à 15 min : la pâte est croustillante et le fromage doré. Laisser reposer 2 min.',
'pizzathon|Préchauffer le four à 220 °C avec la plaque dedans. Émincer {oignon} d’oignon en fines lamelles, égoutter {thon} de thon, couper {olives} d’olives en rondelles, râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte sur du papier cuisson. Étaler {tomconc} de tomates en laissant 1 cm de bord, saler, poivrer, ajouter de l’origan. // Répartir l’oignon, puis le thon émietté, les olives et la mozzarella. // Glisser la pizza (avec son papier) sur la plaque chaude. Cuire 12 à 15 min : le fromage doit être doré et les bords croustillants. Laisser reposer 2 min avant de couper.',
'burgerveg|Préchauffer le four à 220 °C. Étaler les frites ({frites}) sur une plaque. Laver la salade ({salade}), couper {tomate} de tomates en tranches. // Enfourner les frites 20 à 25 min en les retournant à mi-cuisson. // Chauffer une poêle huilée à feu moyen. Cuire {steakveg} steak(s) végétal(aux) 3 à 4 min par face selon l’emballage. // Couper les pains ({painburger}) et les passer 1 min à la poêle ou au grille-pain pour les dorer. // Monter : pain, ketchup ({ketchup}), salade, tomate, steak, pain. Servir avec les frites.',
'colinpane|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les cuire 20 min à l’eau salée. Équeuter les haricots verts ({hv}). // Préparer 3 assiettes : farine ({farine}), œuf battu ({oeufs} œuf(s)), chapelure ({chapelure}). Saler le colin ({colin}). Le passer dans la farine, l’œuf puis la chapelure. // Poser sur une plaque huilée, cuire 15 min en retournant à mi-cuisson. // Écraser les pommes de terre avec {beurre} de beurre et {lait} de lait chaud. Cuire les haricots verts 8 min. // Servir le poisson pané avec purée et haricots.',
'colincitron|Cuire {riz} de riz dans 2 fois son volume d’eau salée, 10 à 12 min. Plonger {pois} de petits pois 5 min dans l’eau bouillante, égoutter. Presser le citron ({citron}). // Saler et poivrer le colin ({colin}). Chauffer un filet d’huile dans une poêle antiadhésive à feu moyen-vif. // Cuire le poisson 3 min par face : il doit s’effeuiller facilement. Le retirer et le garder au chaud. // Verser le jus de citron dans la poêle, gratter les sucs, ajouter {creme} de crème. Chauffer 2 min à feu doux. // Napper le poisson de sauce. Servir avec le riz et les petits pois.',
'saladepatesthon|Faire bouillir de l’eau salée. Cuire {pates} de pâtes 1 min de plus que d’habitude pour qu’elles restent moelleuses une fois froides. Égoutter et rincer à l’eau froide. // Pendant ce temps, couper {tomate} de tomates et {concombre} de concombre en petits dés. Égoutter {thon} de thon et {mais} de maïs. // Dans un saladier, mélanger les pâtes refroidies avec tomate, concombre, thon émietté et maïs. // Ajouter {mayo} de mayonnaise, sel, poivre, et mélanger délicatement. // Laisser 15 min au frais avant de servir.',
'nicoise|Cuire {pdt} de pommes de terre 15 min dans l’eau salée avec un œuf ({oeufs}) pendant 10 min, ajouter les haricots verts ({hv}) 8 min. Refroidir à l’eau froide. // Couper pommes de terre et tomates ({tomate}) en morceaux, écaler l’œuf, le couper en quartiers. // Vinaigrette : mélanger {moutarde} de moutarde, {vinaigre} de vinaigre, {huile} d’huile, sel, poivre. // Disposer la salade ({salade} pièce), les légumes, le thon ({thon}), les olives ({olives}) et l’œuf. // Verser la vinaigrette au dernier moment.',
'cesar|Préchauffer une poêle à feu moyen. Couper {baguette} de pain en cubes, les faire dorer 3 à 4 min avec {huile} d’huile, jusqu’à ce qu’ils soient croustillants. // Émincer {poulet} de poulet, saler, poivrer. Le saisir dans la même poêle 6 min à feu vif, jusqu’à ce qu’il soit doré et blanc à cœur. // Préparer la sauce : mélanger {mayo} de mayonnaise avec le jus de citron ({citron}), poivre et un peu d’eau pour la détendre. // Laver et essorer la salade ({salade}), la déchirer dans un saladier. // Ajouter poulet, croûtons, sauce et copeaux de parmesan ({parmesan}). Mélanger au dernier moment.',
'taboule|Verser {boulgour} de boulgour dans un saladier, couvrir d’eau bouillante salée à hauteur, recouvrir d’une assiette et laisser gonfler 10 min. Égrener à la fourchette. // Couper {tomate} de tomates et {concombre} de concombre en petits dés. Ciseler les herbes ({herbes}). // Quand le boulgour est tiède, ajouter légumes, herbes, jus de citron ({citron}), {huile} d’huile, sel, poivre. // Émietter {feta} de feta par-dessus. // Servir frais, après 15 min au réfrigérateur.',
'quinoasalad|Rincer {quinoa} de quinoa à l’eau claire (pour enlever l’amertume). Cuire dans 2 fois son volume d’eau salée, couvert, 12 min, jusqu’à ce que les grains soient translucides. Étaler pour refroidir. // Couper {avocat} d’avocat et {tomate} de tomates en dés, égoutter {mais} de maïs, émietter {feta} de feta. // Mélanger le quinoa froid avec tous les ingrédients. // Assaisonner avec le jus de citron ({citron}), {huile} d’huile, sel, poivre. Servir frais, sans attendre pour l’avocat.',
'wrapthon|Dans un bol, écraser {avocat} d’avocat à la fourchette avec {ffrais} de fromage frais, sel, poivre et un filet de citron. // Égoutter {thon} de thon et l’émietter. Laver et essorer la salade ({salade}). // Réchauffer les {tortillas} tortillas 20 s par face dans une poêle sèche. // Tartiner chaque tortilla du mélange avocat, répartir thon et salade. // Rabattre les côtés et rouler serré. Couper en deux en biais.',
'kebab|Préchauffer le four à 220 °C pour les frites ({frites}), enfourner 20 à 25 min. // Couper {poulet} de poulet en lamelles et {oignon} d’oignon en rondelles. Râper {concombre} de concombre. // Sauce : mélanger {yaourt} yaourt(s) avec le concombre râpé, sel, ail. // Saisir le poulet dans un peu d’huile avec {epices} d’épices (paprika, cumin) 6 min. // Chauffer {pita} pain(s) pita 30 s. Garnir de poulet, salade ({salade}), tomate ({tomate}), oignon et sauce. // Servir avec les frites.',
'tartiflette|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les couper en rondelles, cuire 15 min à l’eau salée, égoutter. // Émincer {oignon} d’oignon, le faire revenir avec {lardons} de lardons 6 min. // Mélanger dans un plat avec pommes de terre et {creme} de crème. Poivrer. // Couper le reblochon ({reblochon}) en deux dans l’épaisseur, le poser croûte vers le haut. // Cuire 25 min jusqu’à ce que le fromage soit fondu et gratiné.',
'raclette|Brosser les pommes de terre ({pdt}) et les cuire 20 min dans l’eau bouillante salée, avec la peau : elles sont prêtes quand la pointe d’un couteau entre sans résistance. // Pendant ce temps, mettre la table : fromage à raclette ({raclette}) en tranches, jambon ({jambon}), salade ({salade}) assaisonnée, cornichons. // Allumer l’appareil à raclette 5 min avant de manger. // Chacun fait fondre une tranche de fromage dans son poêlon 2 à 3 min, jusqu’à ce qu’elle bulle. // Verser sur les pommes de terre pelées, servir avec jambon et salade.',
'gratinchouf|Préchauffer le four à 200 °C. Détailler le chou-fleur ({chouf}) en petits bouquets, cuire 10 min dans l’eau bouillante salée : ils doivent rester légèrement fermes. Bien égoutter. // Béchamel : fondre {beurre} de beurre à feu doux, ajouter {farine} de farine, remuer 1 min. Verser {lait} de lait froid en fouettant, cuire 5 min jusqu’à ce que la sauce nappe la cuillère. Saler, poivrer, muscade. // Mettre le chou-fleur dans un plat, napper de béchamel, parsemer de {gruyere} de gruyère. // Gratiner 25 min jusqu’à ce que le dessus soit bien doré. Laisser reposer 5 min.',
'ratatouille|Couper aubergine ({aubergine}), courgette ({courgette}), poivron ({poivron}), tomate ({tomate}) et oignon ({oignon}) en dés de 2 cm. // Chauffer {huile} d’huile dans une sauteuse, dorer l’aubergine 5 min (elle absorbe l’huile). Ajouter oignon et poivron 5 min. // Ajouter courgette et tomates, sel, poivre, thym. Couvrir. // Mijoter 30 min à feu doux en remuant de temps en temps. // Cuire {riz} de riz. Cuire {oeufs} œuf(s) au plat 3 min. // Servir la ratatouille sur le riz, avec l’œuf.',
'moussaka|Préchauffer le four à 180 °C. Couper {aubergine} d’aubergines en tranches, les huiler, les cuire 5 min par face à la poêle ou au four. // Faire revenir {oignon} d’oignon, ajouter {boeuf} de bœuf 5 min, {tomconc} de tomates, sel, poivre, cannelle, mijoter 15 min. // Béchamel : {beurre} de beurre, {farine} de farine, {lait} de lait, 5 min. // Dans un plat : aubergines, viande, aubergines, béchamel, {gruyere} de gruyère. // Cuire 30 min jusqu’à dorure. Laisser reposer 5 min.',
'patescreme|Mettre l’eau des pâtes à bouillir. Émincer {oignon} d’oignon et {champi} de champignons. // Cuire {pates} de pâtes selon le temps du paquet. Garder un peu d’eau de cuisson. // Faire revenir l’oignon 3 min dans un filet d’huile, ajouter les champignons et cuire 6 à 8 min à feu vif, jusqu’à ce que l’eau soit évaporée et qu’ils dorent. // Verser {creme} de crème, saler, poivrer, chauffer 3 min à feu doux. // Mélanger avec les pâtes et {parmesan} de parmesan, ajouter un peu d’eau de cuisson si la sauce est trop épaisse.',
'patescrev|Mettre l’eau des pâtes à bouillir. Hacher {ail} gousse(s) d’ail, presser le citron ({citron}). Si les crevettes sont surgelées, les décongeler et les éponger. // Cuire {pates} de pâtes selon le paquet. // Chauffer {huile} d’huile dans une poêle, faire revenir l’ail 1 min sans le brûler. Ajouter {crevettes} de crevettes, cuire 3 min jusqu’à ce qu’elles soient bien roses. // Ajouter {creme} de crème et le jus de citron, chauffer 2 min. Saler, poivrer. // Mélanger aux pâtes égouttées. Servir aussitôt.',
'patechorizo|Mettre l’eau des pâtes à bouillir. Émincer {oignon} d’oignon, couper {chorizo} de chorizo en rondelles. // Faire dorer chorizo et oignon 5 min dans une poêle à feu moyen, sans huile : le chorizo rend sa graisse. // Ajouter {tomconc} de tomates, poivrer, mijoter 10 min à feu doux. // Cuire {pates} de pâtes selon le paquet, garder un peu d’eau de cuisson. // Mélanger pâtes et sauce 1 min dans la poêle avec un peu d’eau de cuisson.',
'macheese|Cuire {pates} de macaronis dans l’eau bouillante salée, 1 min de moins que le paquet. Égoutter. // Béchamel : fondre {beurre} de beurre, ajouter {farine} de farine, remuer 1 min. Verser {lait} de lait froid en fouettant, cuire 5 min à feu doux jusqu’à épaississement. // Hors du feu, ajouter {gruyere} de gruyère râpé, sel, poivre, muscade. Mélanger jusqu’à fonte complète. // Incorporer les macaronis à la sauce. // Servir tel quel, ou gratiner 10 min à 200 °C pour une croûte dorée.',
'minestrone|Couper {carotte} de carottes, {courgette} de courgettes et {pdt} de pommes de terre en petits dés de 1 cm. Émincer {oignon} d’oignon. // Faire revenir l’oignon et les légumes dans {huile} d’huile 5 min. // Ajouter {tomconc} de tomates, le bouillon ({bouillon} cube) et 1 litre d’eau. Saler, poivrer. Cuire 20 min. // Ajouter les haricots blancs égouttés ({haricotsb} boîte) et {pates} de petites pâtes, cuire 10 min, jusqu’à ce que les pâtes soient tendres. // Servir avec {parmesan} de parmesan râpé et un filet d’huile.',
'veloutechampi|Émincer {oignon} d’oignon et {champi} de champignons. Éplucher {pdt} de pommes de terre, couper en dés. // Faire revenir oignon et champignons 6 min dans un filet d’huile, jusqu’à ce que l’eau des champignons s’évapore. // Ajouter pommes de terre, bouillon ({bouillon} cube) et eau à hauteur. Cuire 20 min. // Mixer avec {creme} de crème. Ajouter de l’eau si trop épais. Poivrer, rectifier le sel. // Servir très chaud.',
'veloutecarotte|Éplucher {carotte} de carottes, {oignon} d’oignon et {pdt} de pommes de terre, les couper en rondelles régulières pour qu’elles cuisent en même temps. Dissoudre le bouillon ({bouillon} cube) dans 75 cl d’eau chaude. // Mettre les légumes dans une casserole, verser le bouillon (il doit à peine les couvrir). Porter à ébullition, puis cuire 20 min à frémissement, jusqu’à ce que les carottes s’écrasent à la fourchette. // Ajouter {epices} d’épices (cumin, un peu de cannelle si tu aimes). // Mixer finement avec {creme} de crème, en ajoutant de l’eau chaude si la soupe est trop épaisse. // Goûter, saler, poivrer. Servir très chaud avec un filet de crème et du pain grillé.',
'pouletyaourt|Couper {poulet} de poulet en dés de 3 cm. Dans un saladier, mélanger {yaourt} yaourt(s), {epices} d’épices (paprika, cumin, curcuma), {ail} gousse(s) d’ail écrasée(s), jus de citron ({citron}), sel et poivre. Ajouter le poulet, mélanger. Laisser mariner 15 min (plus longtemps au frigo = plus tendre). // Préchauffer le four à 200 °C. Couper {oignon} d’oignon en quartiers. // Étaler poulet et oignon sur une plaque. Cuire 15 à 20 min, jusqu’à ce que les bords soient dorés. // Cuire {riz} de riz dans 2 fois son volume d’eau salée. // Servir le poulet sur le riz.',
'teriyaki|Cuire {riz} de riz. Détailler {brocoli} de brocoli en bouquets, cuire 6 à 7 min à la vapeur. Hacher {ail} gousse(s) d’ail, couper {poulet} de poulet en dés. // Chauffer {huile} d’huile dans une poêle à feu vif, dorer le poulet 6 min. // Ajouter l’ail 30 s, puis {soja} de sauce soja et {miel} de miel. Baisser à feu moyen. // Laisser caraméliser 3 min en remuant : la sauce doit devenir sirupeuse et enrober le poulet. // Servir sur le riz avec le brocoli.',
'chickfingers|Préchauffer le four à 200 °C. Couper {poulet} de poulet en lanières de 2 cm. Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s), chapelure ({chapelure}). // Saler et poivrer le poulet. Passer chaque lanière dans la farine (secouer), l’œuf, puis la chapelure en appuyant. // Étaler sur une plaque huilée avec les frites ({frites}). // Cuire 15 à 20 min en retournant à mi-cuisson : la panure doit être dorée. // Servir avec la salade ({salade}).',
'porcmoutarde|Cuire {pdt} de pommes de terre 20 min dans l’eau salée. Équeuter {hv} de haricots verts. // Cuire les haricots 8 min dans l’eau bouillante salée. // Saler les côtes de porc ({cotesporc}). Les cuire 5 min par face dans une poêle huilée à feu moyen-vif, jusqu’à ce qu’elles soient dorées. Les retirer. // Dans la poêle, mélanger {moutarde} de moutarde et {creme} de crème, chauffer 3 min. // Remettre les côtes dans la sauce 1 min. Servir avec pommes de terre et haricots.',
'frittata|Préchauffer le four à 200 °C. Couper {courgette} de courgettes, {poivron} de poivron et {oignon} d’oignon en petits dés. // Chauffer {huile} d’huile dans une poêle allant au four. Cuire les légumes 8 min, en remuant, jusqu’à ce qu’ils soient tendres. // Battre {oeufs} œuf(s) avec sel et poivre, ajouter {feta} de feta émiettée. // Verser sur les légumes, laisser prendre 3 min sur le feu, puis enfourner 5 à 7 min jusqu’à ce que le dessus soit doré. // Servir en parts avec la salade ({salade}).',
'gnocchichor|Couper {chorizo} de chorizo en rondelles, {poivron} de poivron et {oignon} d’oignon en lanières. // Chauffer un filet d’huile dans une grande poêle. Faire dorer les gnocchis ({gnocchi}) 5 à 6 min : ils doivent être croustillants. Les retirer. // Cuire chorizo, poivron et oignon 6 min. // Remettre les gnocchis, ajouter {tomconc} de tomates, poivrer. // Mijoter 5 min à feu moyen. Servir dans la poêle.',
'falafel|Égoutter et rincer les pois chiches ({poischiches} boîte). Hacher grossièrement {oignon} d’oignon, ail ({ail}) et herbes ({herbes}). // Mixer pois chiches, oignon, ail, herbes, {epices} d’épices (cumin, coriandre) et {farine} de farine, par à-coups : la pâte doit rester grossière. Saler. // Former des boulettes aplaties de 4 cm. // Chauffer {huile} d’huile, dorer les falafels 4 min par face. // Mélanger {yaourt} yaourt(s) avec sel et citron pour la sauce. Garnir les pitas ({pita}) de falafels, salade ({salade}), tomate ({tomate}) et sauce.',
'tofusaute|Cuire {riz} de riz. Éponger {tofu} de tofu avec du papier absorbant et le couper en cubes de 2 cm. Hacher ail ({ail}) et râper {gingembre} de gingembre. // Chauffer {huile} d’huile dans une poêle à feu vif. Dorer le tofu 8 min en le retournant, jusqu’à ce qu’il soit doré et croustillant. // Ajouter ail et gingembre 30 s. // Ajouter {poelee} de légumes, sauter 5 min. // Verser {soja} de sauce soja, mélanger 1 min. Servir sur le riz.',
'bololentilles|Rincer {lentilles} de lentilles et les cuire 20 min dans l’eau non salée. Égoutter. Hacher {oignon} d’oignon, ail ({ail}), râper {carotte} de carottes. // Faire revenir oignon, carotte et ail dans {huile} d’huile 5 min. // Ajouter {tomconc} de tomates et lentilles, saler, poivrer, mijoter 10 min : la sauce doit être épaisse. // Cuire {pates} de pâtes selon le paquet. // Servir la sauce sur les pâtes.',
'poivronsfarcis|Préchauffer le four à 190 °C. Cuire {riz} de riz 8 min à l’eau bouillante, égoutter. Couper les chapeaux des poivrons ({poivron}) et les évider. // Faire revenir {oignon} d’oignon haché, ajouter {boeuf} de bœuf haché, cuire 5 min en l’émiettant. Ajouter {tomconc} de tomates, sel, poivre, 5 min. // Mélanger la viande avec le riz. // Farcir les poivrons, parsemer de {gruyere} de gruyère, remettre les chapeaux. Les caler dans un plat avec un peu d’eau au fond. // Cuire 35 min jusqu’à ce que les poivrons soient tendres.',
'courgfarcies|Préchauffer le four à 190 °C. Couper les courgettes ({courgette}) en deux dans la longueur, creuser la chair avec une cuillère en laissant 1 cm de bord. Hacher la chair. // Faire revenir {oignon} d’oignon haché, ajouter {boeuf} de bœuf et la chair de courgette, cuire 8 min. Ajouter {tomconc} de tomates, sel, poivre. // Farcir les demi-courgettes, saupoudrer de {chapelure} de chapelure et {gruyere} de gruyère. // Cuire 30 min dans un plat huilé jusqu’à ce que le dessus soit doré.',
'tomfarcies|Préchauffer le four à 180 °C. Couper les chapeaux des tomates ({tomate}), évider la chair avec une cuillère. Saler l’intérieur. // Mélanger la chair hachée avec {boeuf} de bœuf, {oignon} d’oignon haché, ail ({ail}) écrasé, {chapelure} de chapelure, sel, poivre. // Farcir les tomates, remettre les chapeaux, les caler dans un plat huilé. // Cuire 40 min. // Cuire {riz} de riz à part dans 2 fois son volume d’eau salée. Servir avec le jus des tomates.',
'chouflepices|Préchauffer le four à 210 °C. Détailler le chou-fleur ({chouf}) en bouquets de taille égale. // Mélanger avec {huile} d’huile, {epices} d’épices (cumin, paprika, curcuma), sel, poivre. // Étaler sur une plaque, rôtir 30 min en remuant à mi-cuisson : les bords doivent être grillés. // Verser {semoule} de semoule dans un saladier, couvrir d’eau bouillante salée, couvrir 5 min, égrener. // Sauce : {yaourt} yaourt(s), jus de citron ({citron}), sel. Servir le chou-fleur sur la semoule.',
'currycrev|Cuire {riz} de riz. Émincer {oignon} d’oignon, couper {poivron} de poivron en lanières. Décongeler et éponger {crevettes} de crevettes. // Faire revenir oignon et poivron 5 min dans un filet d’huile. Ajouter {curry} de curry, mélanger 30 s. // Verser {laitcoco} de lait de coco, saler, mijoter 8 min. // Ajouter les crevettes, cuire 3 à 4 min jusqu’à ce qu’elles soient roses : pas plus, elles deviendraient caoutchouteuses. // Servir sur le riz.',
'saumonmout|Éplucher {pdt} de pommes de terre, les cuire 20 min dans l’eau salée. Cuire {pois} de petits pois 5 min. // Saler et poivrer le saumon ({saumon}). Cuire dans une poêle antiadhésive, 4 min côté peau, 3 min de l’autre. Le retirer. // Dans la même poêle à feu doux, mélanger {creme} de crème et {moutarde} de moutarde, chauffer 2 min sans bouillir. // Napper le saumon de sauce. Servir avec les pommes de terre et les petits pois.',
'parmentierpoisson|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, cuire 20 min dans l’eau salée. Pocher le colin ({colin}) 8 min dans de l’eau frémissante. // Écraser les pommes de terre avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Faire tomber {epinards} d’épinards 3 min dans une poêle, bien les égoutter. // Dans un plat, mélanger poisson émietté et épinards. Recouvrir de purée, parsemer de {gruyere} de gruyère. // Gratiner 20 min.',
'tartinechevre|Préchauffer le four à 200 °C. Laver la salade ({salade}). Trancher {baguette} de baguette en tranches épaisses. // Poser {chevre} de chèvre en rondelles sur chaque tranche. // Cuire 8 min jusqu’à ce que le fromage soit tendre et doré sur les bords. // Napper de {miel} de miel à la sortie du four. // Assaisonner la salade avec {huile} d’huile, sel, poivre. Servir les tartines sur la salade.',
'gratinendives|Préchauffer le four à 200 °C. Cuire les endives ({endive}) entières 15 min dans l’eau bouillante salée, puis les égoutter et les presser pour retirer l’eau (sinon elles amèrent la sauce). // Enrouler chaque endive dans du jambon ({jambon}), les placer côte à côte dans un plat. // Béchamel : fondre {beurre} de beurre, ajouter {farine} de farine, verser {lait} de lait en fouettant, cuire 5 min. Sel, poivre, muscade. // Napper les endives, parsemer de {gruyere} de gruyère. // Gratiner 20 min jusqu’à belle coloration.',
'burgerpoulet|Préchauffer le four à 200 °C. Laver la salade ({salade}), trancher {tomate} de tomates. Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s), chapelure ({chapelure}). // Aplatir le poulet ({poulet}) à 1,5 cm, saler, poivrer. Le passer dans la farine, l’œuf, la chapelure. // Étaler sur une plaque avec les frites ({frites}). Cuire 15 à 20 min en retournant à mi-cuisson. // Toaster les pains ({painburger}). // Monter : pain, mayonnaise ({mayo}), salade, tomate, poulet, pain. Servir avec les frites.',
'cassoulet|Couper {oignon} d’oignon en dés. Piquer {saucisse} de saucisses. Égoutter et rincer les haricots blancs ({haricotsb} boîte). // Dorer saucisses et lardons ({lardons}) dans une cocotte à feu moyen-vif, 8 min. Les retirer. // Dans la graisse, faire revenir l’oignon 4 min, puis ail ({ail}) 1 min. // Ajouter {tomconc} de tomates, haricots, sel, poivre, thym, remettre saucisses et lardons. Ajouter un demi-verre d’eau. // Couvrir, mijoter 30 min à feu doux en remuant. La sauce doit être épaisse. Servir bien chaud.',
'soupepois|Hacher {oignon} d’oignon. Éplucher {pdt} de pommes de terre, couper en dés. // Faire revenir l’oignon 3 min dans un filet d’huile. Ajouter les pommes de terre 2 min. // Ajouter {pois} de petits pois, le bouillon ({bouillon} cube) et de l’eau à hauteur. Cuire 15 min. // Mixer avec {ffrais} de fromage frais, jusqu’à obtenir une texture lisse. Saler, poivrer. // Servir chaud, avec du pain grillé.',
'veloutebutter|Éplucher {oignon} d’oignon et l’émincer. Couper le butternut ({butternut}) en deux, retirer les graines, l’éplucher et le couper en cubes de 2 cm. // Chauffer un filet d’huile dans une casserole à feu moyen. Faire revenir l’oignon 4 min jusqu’à ce qu’il soit translucide, ajouter {curry} de curry et mélanger 30 s. // Ajouter le butternut, le bouillon ({bouillon} cube) et de l’eau juste à hauteur des légumes. Saler légèrement. // Porter à frémissement, couvrir et cuire 20 min, jusqu’à ce que la lame d’un couteau traverse les cubes sans effort. // Mixer finement avec {cremeliq} de crème. Si la soupe est trop épaisse, ajouter un peu d’eau chaude. Goûter, poivrer, rectifier le sel. // Servir très chaud, avec une cuillerée de crème et du pain grillé.',
'gratinpoireaux|Préchauffer le four à 190 °C. Laver soigneusement les poireaux ({poireau}) en les fendant en deux sur la longueur, puis les couper en tronçons de 3 cm. // Les cuire 10 min à la vapeur ou à l’eau bouillante salée, puis les égoutter très bien en les pressant dans un torchon : sinon le gratin sera aqueux. // Faire dorer {lardons} de lardons à sec dans une poêle 4 min. // Battre {oeufs} œuf(s) avec {cremeliq} de crème, poivre, muscade. Ajouter les lardons. // Disposer les poireaux dans un plat, verser la préparation, parsemer de {gruyere} de gruyère. // Cuire 25 min jusqu’à ce que le dessus soit doré et que le centre soit pris. Laisser reposer 5 min.',
'currylentpdt|Éplucher et émincer {oignon} d’oignon. Éplucher la patate douce ({patatedouce}) et la couper en dés de 2 cm. Rincer {lentcorail} de lentilles corail à l’eau claire. // Faire revenir l’oignon dans un filet d’huile 4 min, ajouter {curry} de curry et cuire 30 s. // Ajouter patate douce, lentilles, {laitcoco} de lait de coco, le bouillon ({bouillon} cube) et 30 cl d’eau. // Cuire 25 min à frémissement, en remuant de temps en temps : les lentilles se défont et épaississent la sauce. // Servir avec du riz ou du pain, avec un filet de citron.',
'quichechampi|Préchauffer le four à 180 °C. Émincer {champi} de champignons et laver {epinards} d’épinards. // Poêler les champignons avec un filet d’huile 6 min jusqu’à évaporation de l’eau, ajouter les épinards et laisser tomber 2 min. Saler, poivrer. // Battre {oeufs} œuf(s) avec {cremeliq} de crème, sel, poivre, muscade. // Dérouler la pâte brisée ({brisee} pâte) dans un moule, piquer le fond, répartir les légumes, verser l’appareil, ajouter {gruyere} de gruyère. // Cuire 35 min : dorée, sans trembler au centre. Laisser tiédir 5 min avant de découper.',
'broccoliparm|Préchauffer le four à 200 °C. Détailler le brocoli ({brocoli}) en bouquets. Éplucher {pdt} de pommes de terre, les couper en cubes de 2 cm. // Mélanger le tout avec {huile} d’huile, sel, poivre sur une plaque. // Enfourner 25 min en remuant à mi-cuisson : les bords du brocoli doivent être grillés et les pommes de terre dorées. // Parsemer de {parmesan} de parmesan pour les 3 dernières minutes. // Cuire {oeufs} œuf(s) au plat dans une poêle huilée 3 min, saler. // Servir les légumes avec les œufs.',
'soupecarotgin|Éplucher {carotte} de carottes, {oignon} d’oignon, {pdt} de pommes de terre. Couper en rondelles. Éplucher et râper {gingembre} de gingembre. // Mettre dans une casserole avec le bouillon ({bouillon} cube) et de l’eau à hauteur. // Cuire 20 min jusqu’à ce que les carottes soient très tendres. // Mixer finement, ajouter le jus de citron ({citron}), saler, poivrer. // Servir chaud, avec un trait de crème ou d’huile d’olive.',
'gratinchoufbech|Préchauffer le four à 200 °C. Détailler le chou-fleur ({chouf}) en petits bouquets, les cuire 10 min à l’eau bouillante salée, puis les égoutter. // Béchamel : fondre {beurre} de beurre à feu doux, ajouter {farine} de farine, remuer 1 min, verser {lait} de lait froid peu à peu en fouettant. Cuire 5 min jusqu’à ce que ça nappe. Saler, poivrer, muscade. // Disposer le chou-fleur dans un plat, napper de béchamel, couvrir de {gruyere} de gruyère. // Gratiner 25 min jusqu’à belle coloration. Laisser reposer 5 min.',
'rizlegumes|Cuire {riz} de riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. L’étaler dans une assiette pour qu’il sèche et refroidisse un peu. // Décongeler légèrement {poelee} de poêlée de légumes si elle est congelée. // Chauffer {huile} d’huile dans un wok ou une grande poêle à feu vif. Sauter les légumes 6 min en remuant, jusqu’à ce qu’ils soient tendres. // Pousser sur le côté, casser {oeufs} œuf(s) dans le vide et les brouiller 1 min. // Ajouter le riz et {soja} de sauce soja, sauter 3 min. Goûter avant de resaler. Servir brûlant.',
'pouletcreme|Cuire {riz} de riz dans 2 fois son volume d’eau salée. Émincer {oignon} d’oignon et {champi} de champignons. Couper {poulet} de poulet en dés. // Dorer le poulet 5 min dans une poêle huilée à feu vif, saler, poivrer. Le retirer. // Faire revenir l’oignon 3 min, puis les champignons 6 min, jusqu’à ce que l’eau s’évapore. // Remettre le poulet, verser {cremeliq} de crème, mijoter 10 min à feu doux. Le poulet doit être blanc à cœur. // Servir sur le riz.',
'pouletmoutarde|Éplucher {pdt} de pommes de terre, couper en gros morceaux et cuire 20 min dans l’eau salée. Couper {poulet} de poulet en dés. // Dorer le poulet 6 min dans une poêle huilée, saler, poivrer. // Ajouter {moutarde} de moutarde et {cremeliq} de crème, mélanger, laisser réduire 5 min à feu doux. // Égoutter les pommes de terre, les écraser avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Servir le poulet nappé de sauce, avec la purée.',
'pouletrizcoco|Cuire d’abord le riz : rincer {riz} de riz, le verser dans 2 fois son volume d’eau salée, couvrir et cuire 10 à 12 min à feu doux, jusqu’à absorption. Couper {poulet} de poulet en dés de 2 cm, {poivron} de poivron et {oignon} d’oignon en lanières. // Chauffer un filet d’huile dans une sauteuse à feu vif. Dorer le poulet 5 min en remuant, jusqu’à ce que les morceaux soient colorés. Les retirer. // Baisser à feu moyen, faire revenir oignon et poivron 5 min avec {curry} de curry, jusqu’à ce que l’oignon soit translucide et que l’odeur monte. // Remettre le poulet, verser {laitcoco} de lait de coco, saler, poivrer. // Laisser mijoter 15 min à feu doux, sans couvercle : la sauce doit épaissir et napper le poulet, qui doit être blanc à cœur. // Servir sur le riz égrené à la fourchette.',
'pouletpaprika|Mettre une grande casserole d’eau salée à bouillir. Émincer {oignon} d’oignon, couper {poivron} de poivron en lanières fines et {poulet} de poulet en dés de 2 cm. // Chauffer un filet d’huile dans une sauteuse. Dorer le poulet 5 min à feu vif, saler. Ajouter oignon et poivron, baisser à feu moyen, cuire 5 min en remuant. // Saupoudrer de {epices} de paprika (doux ou fumé), mélanger 30 s pour réveiller l’arôme. // Verser {tomconc} de tomates concassées, poivrer. Mijoter 15 min à feu doux : la sauce doit épaissir et le poulet être cuit à cœur. // Cuire {pates} de pâtes selon le paquet, égoutter. // Servir la sauce sur les pâtes.',
'poulettomate|Préchauffer le four à 200 °C. Couper {tomate} de tomates, {courgette} de courgettes et {oignon} d’oignon en gros morceaux de 3 cm. // Verser les légumes dans un plat, ajouter {huile} d’huile, sel, poivre et des herbes de Provence. Mélanger avec les mains. // Poser les cuisses de poulet ({cuisse}) par-dessus, peau vers le haut, saler, poivrer. // Enfourner 40 à 45 min. À mi-cuisson, arroser les cuisses avec le jus qui se forme au fond. // Vérifier la cuisson : en piquant la cuisse, le jus doit être clair, sans trace rose. Sinon prolonger 5 à 10 min. // Parsemer d’herbes fraîches ({herbes}) et servir dans le plat.',
'pouletsoja|Cuire {riz} de riz (10 à 12 min dans 2 fois son volume d’eau salée) et {hv} de haricots verts équeutés (8 min à l’eau bouillante salée, ils doivent rester légèrement croquants). Hacher {ail} gousse(s) d’ail, couper {poulet} de poulet en dés de 2 cm. // Chauffer un filet d’huile dans une poêle à feu vif. Dorer le poulet 6 min en remuant, jusqu’à ce que tous les côtés soient colorés. // Baisser à feu moyen, ajouter l’ail 30 s, puis {soja} de sauce soja et {miel} de miel. // Laisser caraméliser 3 min en remuant : la sauce doit devenir sirupeuse et enrober chaque morceau. Si ça brûle, ajouter une cuillère d’eau. // Servir sur le riz avec les haricots verts.',
'pouletfarine|Cuire {riz} de riz (2 fois son volume d’eau salée, couvert, 10 à 12 min). Émincer {oignon} d’oignon, couper {poivron} de poivron en lanières. Couper {poulet} de poulet en lamelles. // Saisir le poulet 5 min dans {huile} d’huile à feu vif, saler, poivrer. Le retirer dans une assiette. // Dans la même poêle, cuire oignon et poivron 6 min à feu moyen, jusqu’à ce qu’ils soient fondants. // Verser {tomconc} de tomates, remettre le poulet, ajouter une pincée de paprika. // Mijoter 10 min à feu doux. Le poulet doit être cuit à cœur et la sauce légèrement épaisse. // Servir sur le riz.',
'pouletpesto|Mettre une grande casserole d’eau salée à bouillir. Couper {poulet} de poulet et {tomate} de tomates en dés de 1,5 cm. // Dorer le poulet 6 min à feu vif dans une poêle huilée, saler, poivrer, jusqu’à ce qu’il soit doré et blanc à cœur. Ajouter les tomates 2 min. // Cuire {pates} de pâtes selon le paquet. Garder un demi-verre d’eau de cuisson avant d’égoutter. // Hors du feu, mélanger dans la poêle pâtes, {pesto} de pesto et 2 cuillères d’eau de cuisson : le pesto devient crémeux et enrobe bien. // Parsemer de {parmesan} de parmesan et servir tout de suite.',
'pouletwrap|Laver et essorer la salade ({salade}), trancher les tomates ({tomate}). Dans un bol, mélanger {yaourt} yaourt(s) nature et {moutarde} de moutarde, saler, poivrer : c’est la sauce. // Couper {poulet} de poulet en lamelles de 1 cm. Chauffer une poêle à feu vif avec un filet d’huile, saisir le poulet 6 min en remuant, saler, poivrer, jusqu’à ce qu’il soit doré et blanc à cœur. // Réchauffer les {tortillas} tortillas 20 s par face dans une poêle sèche pour qu’elles soient souples. // Tartiner chaque tortilla de sauce, garnir de poulet, salade et tomate. // Rabattre les côtés et rouler serré. Couper en deux en biais.',
'pouletbrocoli|Cuire {riz} de riz. Détailler le brocoli ({brocoli}) en petits bouquets. Hacher {ail} gousse(s) d’ail et râper {gingembre} de gingembre. Couper {poulet} de poulet en lamelles. // Chauffer un filet d’huile dans un wok à feu vif. Saisir le poulet 5 min en remuant, jusqu’à ce qu’il soit doré. // Ajouter ail et gingembre 30 s, puis le brocoli et 3 cuillères d’eau. Couvrir et cuire 4 min : le brocoli doit être vert vif et croquant. // Verser {soja} de sauce soja, mélanger 1 min à feu vif. // Servir sur le riz.',
'pouletcurrypdt|Éplucher {pdt} de pommes de terre et les couper en cubes de 3 cm. Émincer {oignon} d’oignon. // Chauffer un filet d’huile dans une cocotte. Dorer les cuisses ({cuisse}) 4 min par face, saler, poivrer. Les retirer. // Dans la même cocotte, faire revenir l’oignon 3 min avec {curry} de curry. // Remettre le poulet, ajouter pommes de terre, {laitcoco} de lait de coco et de l’eau à mi-hauteur. Saler. // Couvrir et mijoter 30 min à feu doux. Le plat est prêt quand la chair du poulet se détache de l’os et que les pommes de terre sont fondantes. // Servir dans des assiettes creuses.',
'poulethachis|Éplucher {carotte} de carottes, {pdt} de pommes de terre et {oignon} d’oignon, les couper en gros morceaux. Dissoudre le bouillon ({bouillon} cube) dans 40 cl d’eau chaude. // Chauffer un filet d’huile dans une cocotte, dorer les cuisses ({cuisse}) 5 min par face, saler, poivrer. Ajouter l’oignon 3 min. // Ajouter carottes, pommes de terre, herbes ({herbes}) et le bouillon. // Couvrir, mijoter 40 min à feu doux. // Vérifier que le poulet est cuit (chair qui se détache) et goûter le jus. Servir dans la cocotte.',
'dindechampi|Hydrater {semoule} de semoule : la verser dans un saladier, couvrir d’eau bouillante salée à hauteur, couvrir 5 min. Émincer {echalote} d’échalote et {champi} de champignons. Couper {dinde} de dinde en lanières. // Chauffer un filet d’huile dans une poêle à feu vif. Saisir la dinde 4 min, saler, poivrer. La retirer. // Cuire l’échalote 2 min, puis les champignons 6 min jusqu’à ce que l’eau soit évaporée. // Remettre la dinde, verser {cremeliq} de crème et mijoter 5 min à feu doux. // Égrener la semoule à la fourchette avec un filet d’huile. Servir.',
'dindelegumes|Préchauffer le four à 200 °C. Mettre des piques en bois à tremper 10 min. Couper {dinde} de dinde, {poivron} de poivron, {courgette} de courgette et {oignon} d’oignon en cubes de 3 cm. // Enfiler en alternant viande et légumes. // Les poser sur une plaque, badigeonner d’{huile} d’huile, saler, poivrer, ajouter des herbes. // Enfourner 20 min en retournant à mi-cuisson, jusqu’à ce que la dinde soit dorée et blanche à cœur. // Cuire {riz} de riz dans 2 fois son volume d’eau salée pendant ce temps. Servir les brochettes sur le riz.',
'dindepates|Mettre une grande casserole d’eau salée à bouillir. Hacher {oignon} d’oignon, couper {dinde} de dinde en dés de 1,5 cm. // Dorer la dinde 5 min dans une poêle huilée à feu vif, saler, poivrer. Ajouter l’oignon, cuire 3 min jusqu’à ce qu’il soit translucide. // Verser {tomconc} de tomates, ajouter herbes ({herbes}). Mijoter 10 min : la sauce épaissit et la dinde est blanche à cœur. // Cuire {pates} de pâtes selon le paquet, égoutter en gardant un peu d’eau. // Mélanger pâtes et sauce 1 min. Servir.',
'hachispdtdouce|Préchauffer le four à 200 °C. Éplucher {patatedouce} de patate douce, la couper en cubes, la cuire 15 min dans l’eau salée jusqu’à ce qu’elle s’écrase. Émincer {oignon} d’oignon. // Dans une poêle, faire revenir l’oignon 3 min, ajouter {boeufmorc} de bœuf haché et l’émietter 5 min. Verser {tomconc} de tomates, saler, poivrer, mijoter 8 min. // Écraser la patate douce avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Verser la viande dans un plat, couvrir de purée, lisser et strier à la fourchette. // Gratiner 15 min jusqu’à ce que le dessus soit doré. Laisser reposer 5 min.',
'boeufcarotte|Éplucher {carotte} de carottes, {oignon} d’oignon, {pdt} de pommes de terre. Couper le bœuf ({boeufmorc}) en cubes de 3 cm. Dissoudre le bouillon ({bouillon} cube) dans 40 cl d’eau chaude. // Chauffer un filet d’huile dans une cocotte. Saisir le bœuf par petites quantités pour bien le colorer, saler, poivrer. Ajouter l’oignon 3 min. // Ajouter {concentre} de concentré de tomate, carottes en rondelles et bouillon. // Mijoter 1 h à feu doux à couvert. Ajouter les pommes de terre, cuire 30 min. // La viande doit se couper à la cuillère. Servir bien chaud.',
'steakfrites|Préchauffer le four à 220 °C. Étaler les frites ({frites}) sur une plaque, cuire 20 à 25 min en remuant à mi-cuisson. // Vinaigrette : mélanger {moutarde} de moutarde, {vinaigre} de vinaigre, {huile} d’huile, sel, poivre. Laver et essorer la salade ({salade}). // Sortir la viande ({boeufmorc}) du frigo 10 min avant. Chauffer une poêle à feu vif. // Cuire les steaks 2 à 3 min par face (entre saignant et à point), 4 min pour bien cuit. Saler après cuisson. // Laisser reposer 2 min. Servir avec les frites et la salade assaisonnée.',
'boeuftomate|Cuire {riz} de riz (2 fois son volume d’eau salée, couvert, 10 à 12 min). Hacher {oignon} d’oignon. // Dans un bol, mélanger {boeufmorc} de bœuf, l’oignon, {chapelure} de chapelure, {oeufs} œuf(s), sel, poivre. Former des boulettes de 3 cm. // Dorer les boulettes 6 min dans une poêle huilée en les retournant, jusqu’à ce qu’elles soient colorées. Les retirer. // Verser {tomconc} de tomates dans la poêle, saler. Remettre les boulettes. // Mijoter 15 min à couvert, à feu doux. Servir sur le riz.',
'boeufpoivron|Cuire {nouilles} de nouilles selon le paquet, égoutter. Couper {poivron} de poivron et {boeufmorc} de bœuf en lanières fines. Hacher {ail} gousse(s) d’ail et râper {gingembre} de gingembre. // Chauffer un filet d’huile dans un wok à feu très vif. Saisir le bœuf 2 à 3 min, le retirer. // Sauter poivron, ail, gingembre 4 min : le poivron doit rester croquant. // Remettre le bœuf, ajouter nouilles et {soja} de sauce soja. Sauter 2 min. Servir.',
'chilicarne|Émincer {oignon} d’oignon. Égoutter et rincer les haricots rouges ({haricotsr} boîte). Cuire {riz} de riz. // Chauffer un filet d’huile dans une sauteuse. Faire revenir l’oignon 3 min, ajouter {boeufmorc} de bœuf haché et l’émietter 5 min à feu vif. // Ajouter {epices} d’épices (cumin, paprika, piment), mélanger 30 s. Verser {tomconc} de tomates, ajouter les haricots, saler. // Mijoter 25 min à feu doux en remuant de temps en temps. La sauce doit être épaisse. // Servir sur le riz.',
'tacosboeuf|Râper {gruyere} de gruyère, trancher {tomate} de tomates, laver la salade ({salade}). // Chauffer un filet d’huile dans une poêle à feu vif. Cuire {boeufmorc} de bœuf haché 6 min en l’émiettant, avec {epices} d’épices (cumin, paprika), sel, poivre. // Ajouter les haricots rouges ({haricotsr} boîte, rincés) 3 min. // Réchauffer les tortillas ({tortillas}) 20 s par face dans une poêle sèche. // Garnir de viande, tomate, salade et fromage. Rouler ou plier en deux.',
'enchiladas|Préchauffer le four à 200 °C. Couper {poivron} de poivron en petits dés. Rincer {mais} de maïs. // Faire dorer {boeufmorc} de bœuf haché 6 min dans une poêle huilée. Ajouter poivron, maïs, {epices} d’épices, sel et cuire 5 min. // Poser la farce sur les {tortillas} tortillas, rouler et placer côte à côte dans un plat, la couture dessous. // Napper de {tomconc} de tomates, parsemer de {mozza} de mozzarella. // Gratiner 15 min : le fromage doit être doré et bouillonnant.',
'nouillesboeuf|Cuire {riz} de riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. Émincer {oignon} d’oignon. Couper {boeufmorc} de bœuf en fines lanières. // Chauffer un filet d’huile dans une poêle à feu très vif. Saisir le bœuf 2 à 3 min en remuant, jusqu’à ce qu’il soit coloré. Le retirer. // Baisser à feu moyen, cuire les oignons 8 min en remuant : ils doivent être fondants et dorés. // Remettre le bœuf, ajouter {soja} de sauce soja et {miel} de miel. Laisser napper 2 min : la sauce épaissit. // Servir sur le riz.',
'porcpdt|Préchauffer le four à 190 °C. Éplucher {pdt} de pommes de terre, couper en quartiers. Couper {oignon} d’oignon en quartiers. // Badigeonner le porc ({cotesporc}) de {moutarde} de moutarde, saler, poivrer. // Disposer porc, pommes de terre et oignon dans un plat, arroser d’{huile} d’huile. // Cuire 50 min en retournant les pommes de terre à mi-cuisson. // Le porc doit être cuit à cœur : pas de trace rosée, jus clair. Laisser reposer 5 min.',
'cotesporc|Cuire {pdt} de pommes de terre 20 min et {hv} de haricots verts 8 min, séparément, dans l’eau bouillante salée. // Chauffer un filet d’huile dans une poêle. Dorer les côtes de porc ({cotesporc}) 5 min par face, saler, poivrer. Les retirer. // Verser {moutarde} de moutarde et {cremeliq} de crème dans la poêle, mélanger 3 min à feu doux. // Remettre les côtes 1 min dans la sauce. // Servir avec pommes de terre et haricots verts.',
'porcsucre|Cuire {riz} de riz dans 2 fois son volume d’eau salée. Couper {cotesporc} de porc en fines lanières. // Chauffer un filet d’huile dans un wok à feu vif. Saisir le porc 5 min en remuant, jusqu’à ce qu’il soit bien coloré et cuit à cœur. // Ajouter {poelee} de poêlée de légumes, sauter 5 min. // Verser {soja} de sauce soja et {miel} de miel. Laisser caraméliser 2 min en remuant : la sauce doit enrober la viande. // Servir sur le riz.',
'saucisselent|Rincer {lentilles} de lentilles. Éplucher {carotte} de carottes et {oignon} d’oignon, les couper en dés. // Mettre dans une casserole avec le bouillon ({bouillon} cube) et couvrir d’eau froide. Porter à ébullition puis cuire 25 min à frémissement, jusqu’à ce que les lentilles soient tendres. // Piquer {saucisse} de saucisses, les dorer 12 à 15 min dans une poêle à feu moyen en les retournant. // Égoutter les lentilles en gardant un peu de jus. Servir les saucisses sur les lentilles.',
'jambonpurees|Éplucher {pdt} de pommes de terre, les couper en morceaux, les plonger dans l’eau froide salée. Porter à ébullition et cuire 20 min, jusqu’à ce qu’un couteau s’enfonce sans résistance. // Pendant ce temps, chauffer {pois} de petits pois 5 min dans l’eau bouillante salée. Égoutter. // Égoutter les pommes de terre, les remettre dans la casserole. Écraser avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. Garder au chaud. // Réchauffer le jambon ({jambon}) 1 min à la poêle si tu le souhaites. // Dresser la purée, les petits pois et le jambon.',
'tartiflexp|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, couper en rondelles, cuire 12 min à l’eau salée, égoutter. // Émincer {oignon} d’oignon, faire revenir avec {lardons} de lardons 6 min. // Mélanger avec les pommes de terre et {cremeliq} de crème, poivrer. Verser dans un plat. // Couvrir de reblochon ({reblochon}) coupé en deux. // Gratiner 20 min jusqu’à ce que le fromage soit fondu et doré.',
'pizzajambon|Préchauffer le four à 220 °C avec la plaque dedans. Émincer {champi} de champignons, couper {jambon} de jambon en lanières, râper {mozza} de mozzarella. // Étaler {pizzapate} pâte sur du papier cuisson. Napper de {tomconc} de tomates, saler, poivrer. // Répartir champignons, jambon et mozzarella. // Glisser sur la plaque chaude. Cuire 12 à 15 min jusqu’à ce que les bords soient dorés. Laisser reposer 2 min.',
'tarteflam|Préchauffer le four à 190 °C. Émincer {oignon} d’oignon, les faire fondre 12 min dans un filet d’huile à feu doux jusqu’à ce qu’ils soient translucides. // Ajouter {lardons} de lardons 3 min. // Mélanger avec {cremeliq} de crème, {oeufs} œuf(s), poivre, muscade. // Dérouler la pâte ({brisee} pâte) dans un moule, piquer le fond, garnir. // Cuire 30 min jusqu’à ce que le dessus soit doré et pris.',
'saucissepuree|Éplucher {pdt} de pommes de terre, les couper en gros morceaux, les cuire 20 min dans l’eau bouillante salée. Équeuter {hv} de haricots verts. // Piquer {saucisse} de saucisses à la fourchette. Les cuire 15 min dans une poêle à feu moyen en les retournant, jusqu’à ce qu’elles soient dorées partout et cuites à cœur. // Cuire les haricots 8 min dans l’eau bouillante salée, ils doivent rester légèrement croquants. // Égoutter les pommes de terre, les écraser avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Servir saucisses, purée et haricots.',
'cabillaud|Cuire {riz} de riz. Cuire {brocoli} de brocoli à la vapeur 7 min. Presser le citron ({citron}). // Saler et poivrer le colin ({colin}). Le cuire 3 à 4 min par face dans une poêle huilée à feu moyen-vif : il doit s’effeuiller. Le retirer. // Verser le jus de citron dans la poêle, gratter les sucs, ajouter {cremeliq} de crème, chauffer 2 min. // Napper le poisson. Servir avec riz et brocoli.',
'saumonepinards|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les cuire 20 min dans l’eau salée. // Faire tomber {epinards} d’épinards dans une poêle avec {cremeliq} de crème, 3 min, sel, poivre, muscade. // Poser le saumon ({saumon}) dans un plat avec le jus de citron ({citron}), sel, poivre. Cuire 12 min. Il doit être nacré au centre. // Servir saumon sur épinards, avec les pommes de terre.',
'saumonsoja|Préchauffer le four à 200 °C. Dans un bol, mélanger {soja} de sauce soja et {miel} de miel. Poser le saumon ({saumon}) sur du papier cuisson et le badigeonner généreusement de sauce. // Enfourner 12 min : le saumon doit être laqué et se défaire en gros copeaux nacrés. // Pendant ce temps, cuire {nouilles} de nouilles selon le paquet et égoutter. Cuire {brocoli} de brocoli en bouquets 6 à 7 min à la vapeur (vert vif, légèrement croquant). // Mélanger les nouilles avec un peu du jus de cuisson. // Servir le saumon sur les nouilles avec le brocoli.',
'saumonpates|Mettre une grande casserole d’eau salée à bouillir. Couper {saumon} de saumon en dés de 2 cm. Presser le citron ({citron}). // Cuire {pates} de pâtes selon le paquet, garder un peu d’eau de cuisson, égoutter. // Chauffer un filet d’huile dans une poêle, poêler le saumon 3 min à feu moyen-vif, saler, poivrer. Il doit rester un peu rose au centre. // Ajouter {cremeliq} de crème et le jus de citron, chauffer 2 min à feu doux. Ajouter herbes ciselées ({herbes}). // Mélanger délicatement aux pâtes avec un peu d’eau de cuisson pour ne pas émietter le saumon.',
'thonpoivron|Cuire {riz} de riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. Le rincer à l’eau froide et bien l’égoutter. // Couper {tomate} de tomates et {concombre} de concombre en petits dés. Égoutter {thon} de thon et {mais} de maïs. // Dans un saladier, mélanger riz froid, tomate, concombre, thon émietté et maïs. // Préparer l’assaisonnement : {huile} d’huile, {vinaigre} de vinaigre, sel, poivre. Verser et mélanger. // Laisser reposer 10 min au frais pour que les saveurs se mélangent. Servir froid.',
'sardinesoupe|Trancher {baguette} de baguette en tranches épaisses, les faire griller 2 min par face au grille-pain ou au four. Laver et essorer la salade ({salade}). Trancher {tomate} de tomates. // Frotter les tartines chaudes avec une gousse d’ail, si tu en as. // Disposer les tomates en rondelles, saler légèrement, puis poser les sardines ({sardines}) égouttées. // Arroser d’un filet d’huile d’olive, poivrer, ajouter du citron. // Servir avec la salade assaisonnée.',
'colinpomme|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, cuire 20 min dans l’eau salée. Équeuter {hv} de haricots verts, cuire 8 min. // Poser le colin ({colin}) dans un plat. Ajouter {cremeliq} de crème, le jus de citron ({citron}), sel, poivre, aneth ou herbes. // Cuire 12 min au four : le poisson doit s’effeuiller facilement à la fourchette. // Servir poisson, pommes de terre et haricots verts, en nappant de sauce.',
'crevettespates|Mettre l’eau des pâtes à bouillir. Hacher {ail} gousse(s) d’ail. Décongeler les crevettes ({crevettes}) et les éponger. // Cuire {pates} de pâtes selon le paquet. // Faire revenir l’ail dans {huile} d’huile 1 min à feu moyen sans le brûler. Ajouter {tomconc} de tomates, mijoter 5 min. // Ajouter les crevettes, cuire 3 min jusqu’à ce qu’elles soient roses. // Mélanger aux pâtes avec un peu d’eau de cuisson.',
'crevettescoco|Cuire {riz} de riz dans 2 fois son volume d’eau salée. Couper {poivron} de poivron en lanières fines. Décongeler les crevettes ({crevettes}) et les éponger. // Faire revenir le poivron 4 min dans un filet d’huile à feu moyen avec {curry} de curry. // Verser {laitcoco} de lait de coco, saler, mijoter 8 min à feu doux. // Ajouter les crevettes, cuire 3 min : elles doivent être roses (plus, elles deviennent caoutchouteuses). // Servir sur le riz.',
'crevettesnouilles|Cuire {nouilles} de nouilles selon le paquet, égoutter. Hacher {ail} gousse(s) d’ail. Décongeler les crevettes ({crevettes}) et les éponger. // Chauffer un filet d’huile dans un wok à feu vif. Sauter {poelee} de légumes 5 min. // Ajouter l’ail et les crevettes, sauter 3 min jusqu’à ce que les crevettes soient roses. // Ajouter nouilles et {soja} de sauce soja, sauter 2 min pour tout enrober. // Servir tout de suite.',
'brandade|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, cuire 20 min dans l’eau salée. Laver {poireau} de poireaux, les couper en rondelles. // Faire revenir les poireaux 8 min dans un filet d’huile. Ajouter {saumon} de saumon en dés et {cremeliq} de crème, cuire 3 min, saler, poivrer. // Écraser les pommes de terre avec {beurre} de beurre et {lait} de lait chaud. // Verser saumon et poireaux dans un plat, recouvrir de purée. // Gratiner 20 min jusqu’à belle coloration.',
'thonpates2|Préchauffer le four à 200 °C. Cuire {pates} de pâtes dans l’eau bouillante salée, 2 min de moins que le paquet (elles finiront au four). Râper {mozza} de mozzarella. // Égoutter le thon ({thon}) et l’émietter. Mélanger pâtes, thon, {tomconc} de tomates, {cremeliq} de crème, sel, poivre. // Verser dans un plat à gratin, couvrir de mozzarella. // Gratiner 15 min jusqu’à ce que le dessus soit doré. Laisser reposer 3 min.',
'omelettechamp|Préchauffer le four à 220 °C. Étaler les frites ({frites}) sur une plaque, cuire 20 à 25 min. Émincer {champi} de champignons. Laver la salade ({salade}). // Poêler les champignons 6 min à feu vif jusqu’à évaporation de l’eau. Saler. // Battre {oeufs} œuf(s) avec sel et poivre. Faire fondre {beurre} de beurre dans une poêle, verser les œufs. // Quand le dessous est pris, garnir de champignons et plier. // Servir avec frites et salade.',
'oeufsplat|Éplucher {pdt} de pommes de terre, couper en rondelles de 3 mm. // Chauffer {huile} d’huile dans une grande poêle à feu moyen. Cuire les pommes de terre 15 min en remuant, jusqu’à ce qu’elles soient dorées et tendres. Saler. // Ajouter {epinards} d’épinards, laisser tomber 2 min en remuant. // Faire des creux, casser les œufs ({oeufs} œuf(s)) dedans, saler, poivrer. Couvrir et cuire 3 à 4 min à feu doux. // Servir quand les blancs sont pris et les jaunes encore coulants.',
'friteggs|Préchauffer le four à 200 °C. Couper {courgette} de courgettes, {poivron} de poivron et {oignon} d’oignon en petits dés. // Faire revenir les légumes 8 min dans {huile} d’huile, dans une poêle allant au four. // Battre {oeufs} œuf(s), sel, poivre, ajouter {feta} de feta émiettée. Verser sur les légumes. // Cuire 3 min sur le feu, puis 7 min au four jusqu’à ce que le dessus soit pris et doré.',
'quichechevre|Préchauffer le four à 190 °C. Laver {poireau} de poireaux, les couper en rondelles. Couper {chevre} de chèvre en dés. // Faire fondre les poireaux 10 min dans un filet d’huile. Saler, poivrer. // Battre {oeufs} œuf(s) et {cremeliq} de crème. // Dérouler la pâte ({brisee} pâte), piquer le fond, garnir de poireaux et chèvre. Verser l’appareil. // Cuire 30 min, jusqu’à ce que la quiche soit dorée et prise.',
'tartecourg|Préchauffer le four à 190 °C. Laver {courgette} de courgettes et les couper en rondelles fines de 3 mm. // Dérouler la pâte brisée ({brisee} pâte) dans un moule, piquer le fond à la fourchette. Disposer les courgettes en rosace. // Battre {oeufs} œuf(s) avec {cremeliq} de crème, sel, poivre. Ajouter {chevre} de chèvre émietté. Verser sur les courgettes. // Cuire 35 min, jusqu’à ce que le dessus soit doré et pris. Laisser tiédir 5 min.',
'tartepoivron|Préchauffer le four à 190 °C. Laver {poivron} de poivron, l’épépiner, le couper en lanières fines. Émietter {feta} de feta. // Dérouler la pâte brisée ({brisee} pâte) dans un moule, piquer le fond. Répartir les poivrons. // Battre {oeufs} œuf(s) avec {cremeliq} de crème, poivre (peu de sel : la feta est salée). Ajouter la feta. Verser sur les poivrons. // Cuire 35 min jusqu’à ce que la tarte soit dorée et ferme au centre. Servir tiède.',
'pizzaleg|Préchauffer le four à 220 °C avec la plaque dedans. Couper {courgette} de courgettes, {poivron} de poivron et {aubergine} d’aubergine en lamelles fines de 3 mm. Râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte sur du papier cuisson. Étaler {tomconc} de tomates, saler, poivrer. // Disposer les légumes, arroser d’un filet d’huile, couvrir de mozzarella. // Glisser sur la plaque chaude. Cuire 15 min : légumes tendres, fromage doré, bords croustillants.',
'pizzaepinards|Préchauffer le four à 220 °C avec la plaque dedans. Laver {epinards} d’épinards et bien les essorer. Émietter {chevre} de chèvre, râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte sur du papier cuisson. Étaler {tomconc} de tomates, saler, poivrer. // Répartir les épinards crus (ils fondent à la cuisson), le chèvre, la mozzarella. // Cuire 12 à 15 min jusqu’à ce que le dessus soit doré. Laisser reposer 2 min avant de couper.',
'pizzasaumon|Préchauffer le four à 220 °C avec la plaque dedans. Râper {mozza} de mozzarella, presser le citron ({citron}). Couper {saumon} de saumon en fines lamelles. // Dérouler {pizzapate} pâte sur du papier cuisson. Étaler {cremeliq} de crème en laissant 1 cm de bord, poivrer. Parsemer de mozzarella. // Cuire 12 min jusqu’à ce que le fromage soit doré. // Poser le saumon sur la pizza, arroser de citron, remettre 3 min : le saumon cuit vite et doit rester tendre.',
'pizzamerguez|Préchauffer le four à 220 °C avec la plaque dedans. Couper {merguez} de merguez en rondelles, {poivron} de poivron en lanières. Râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte sur du papier cuisson. Étaler {tomconc} de tomates, saler, poivrer. // Répartir merguez, poivron, mozzarella. // Cuire 15 min : les merguez doivent être dorées et cuites à cœur, le fromage fondu.',
'pastapesto|Mettre une grande casserole d’eau salée à bouillir. Couper {tomate} de tomates en dés de 1 cm. // Cuire {pates} de pâtes selon le temps du paquet, en gardant un demi-verre d’eau de cuisson avant d’égoutter. // Remettre les pâtes dans la casserole hors du feu. Ajouter {pesto} de pesto et 2 cuillères d’eau de cuisson, mélanger : la sauce devient crémeuse. // Incorporer les tomates et {parmesan} de parmesan, poivrer. Servir tout de suite.',
'pastaepinard|Mettre l’eau des pâtes à bouillir. Hacher {ail} gousse(s) d’ail, émietter {chevre} de chèvre. Laver {epinards} d’épinards. // Cuire {pates} de pâtes selon le paquet, garder un peu d’eau de cuisson. // Faire revenir l’ail 1 min dans un filet d’huile, ajouter les épinards et laisser tomber 3 min. // Ajouter {cremeliq} de crème et le chèvre, mélanger à feu doux jusqu’à ce qu’il fonde. Poivrer. // Mélanger aux pâtes avec un peu d’eau de cuisson.',
'pastachampi|Mettre une grande casserole d’eau salée à bouillir. Émincer {echalote} d’échalote et {champi} de champignons en lamelles. // Cuire {pates} de pâtes selon le paquet, garder un peu d’eau de cuisson. // Faire revenir l’échalote 2 min dans un filet d’huile, ajouter les champignons et cuire 6 à 8 min à feu vif, jusqu’à ce qu’ils soient dorés et que l’eau soit évaporée. // Verser {cremeliq} de crème, saler, poivrer, chauffer 3 min à feu doux. // Mélanger aux pâtes avec {parmesan} de parmesan et un peu d’eau de cuisson.',
'macaroniham|Mettre une casserole d’eau salée à bouillir. Couper {jambon} de jambon en lanières, râper {gruyere} de gruyère. // Cuire les macaronis ({pates}) selon le paquet, égoutter. // Dans la casserole vide, chauffer {cremeliq} de crème avec le jambon 2 min à feu doux. // Remettre les pâtes, ajouter le gruyère, remuer jusqu’à ce qu’il fonde et nappe les pâtes. Poivrer. Servir tout de suite.',
'pastabrocoli|Mettre une grande casserole d’eau salée à bouillir. Détailler le brocoli ({brocoli}) en petits bouquets. Hacher {ail} gousse(s) d’ail. // Cuire {pates} de pâtes ; ajouter le brocoli pour les 5 dernières minutes. Garder un peu d’eau de cuisson, égoutter. // Faire revenir l’ail 1 min dans {huile} d’huile sans le brûler. // Ajouter pâtes et brocoli, écraser un peu le brocoli à la fourchette, mélanger avec un peu d’eau de cuisson. // Servir avec {parmesan} de parmesan et du poivre.',
'pastapoivron|Mettre l’eau des pâtes à bouillir. Couper {poivron} de poivron en lanières, hacher {ail} gousse(s) d’ail. // Cuire le poivron 15 min dans une poêle huilée à feu moyen, en remuant, jusqu’à ce qu’il soit très tendre et légèrement coloré. // Mixer poivron, ail, {tomconc} de tomates, {huile} d’huile, sel, poivre, jusqu’à obtenir une sauce lisse. // Cuire {pates} de pâtes selon le paquet. // Enrober les pâtes de sauce, chauffer 1 min à feu doux. Parsemer de {parmesan} de parmesan.',
'pastaratatouille|Mettre l’eau des pâtes à bouillir. Couper {aubergine} d’aubergine, {courgette} de courgette, {poivron} de poivron et {oignon} d’oignon en dés de 1,5 cm. // Faire revenir aubergine et oignon 6 min dans un filet d’huile, ajouter courgette et poivron, cuire 5 min. // Verser {tomconc} de tomates, saler, poivrer, mijoter 15 min. // Cuire {pates} de pâtes selon le paquet. Mélanger aux légumes.',
'risottochamp|Dissoudre le bouillon ({bouillon} cube) dans 1 litre d’eau chaude, garder sur feu doux. Émincer {oignon} d’oignon et {champi} de champignons. // Faire fondre une partie du beurre ({beurre}), cuire les champignons 6 min à feu vif, les retirer. // Dans la même casserole, faire revenir l’oignon 3 min, ajouter {riz} de riz rond, remuer 1 min jusqu’à ce que les grains soient translucides. // Ajouter une louche de bouillon, remuer jusqu’à absorption, recommencer pendant 18 min. Le riz doit être crémeux et encore ferme au centre. // Hors du feu, ajouter champignons, le reste du beurre et {parmesan} de parmesan. Couvrir 2 min, servir.',
'risottopot|Dissoudre le bouillon ({bouillon} cube) dans 1 litre d’eau chaude, garder sur feu doux. Couper {butternut} de butternut en petits dés, hacher {oignon} d’oignon. // Faire revenir l’oignon 3 min dans un filet d’huile, ajouter le butternut et cuire 5 min. // Ajouter {riz} de riz rond, remuer 1 min. // Ajouter le bouillon louche par louche en remuant, pendant 18 min. // Hors du feu, ajouter {parmesan} de parmesan, poivre, un peu de beurre. Servir crémeux.',
'risotocourg|Dissoudre le bouillon ({bouillon} cube) dans 1 litre d’eau chaude, garder sur feu doux. Couper {courgette} de courgettes en petits dés, hacher {oignon} d’oignon. // Cuire oignon et courgettes 6 min dans un filet d’huile. // Ajouter {riz} de riz rond, remuer 1 min. // Ajouter le bouillon louche par louche pendant 18 min en remuant. // Hors du feu, incorporer {chevre} de chèvre en morceaux, poivrer, servir.',
'dalpois|Émincer {oignon} d’oignon. Rincer {lentcorail} de lentilles corail et égoutter les pois chiches ({poischiches} boîte). // Faire revenir l’oignon 4 min dans un filet d’huile avec {curry} de curry. // Ajouter lentilles, pois chiches, {laitcoco} de lait de coco, 30 cl d’eau, sel. Cuire 20 min à frémissement. // Ajouter {epinards} d’épinards, laisser tomber 2 min. La texture doit être épaisse et crémeuse.',
'curryaubergine|Couper {aubergine} d’aubergine en cubes de 2 cm. Cuire {riz} de riz. Égoutter les pois chiches ({poischiches} boîte). // Cuire l’aubergine 8 min dans une poêle huilée à feu moyen-vif, jusqu’à ce qu’elle soit dorée, avec {curry} de curry. // Ajouter {tomconc} de tomates, pois chiches, {laitcoco} de lait de coco, sel. // Mijoter 20 min à feu doux jusqu’à ce que l’aubergine soit fondante. Servir sur le riz.',
'chilisinquinoa|Émincer {poivron} de poivron. Rincer les haricots rouges ({haricotsr} boîte) et le maïs ({mais}). Rincer {quinoa} de quinoa à l’eau claire. // Cuire le quinoa dans 2 fois son volume d’eau salée, couvert, 12 min, jusqu’à ce que l’eau soit absorbée. // Faire revenir le poivron 5 min dans un filet d’huile avec {epices} d’épices (cumin, paprika, piment). // Ajouter {tomconc} de tomates, haricots, maïs, sel. Mijoter 20 min en remuant : le chili doit être épais. // Servir sur le quinoa.',
'quinoalegumes|Préchauffer le four à 200 °C. Couper {courgette} de courgettes, {poivron} de poivron et {carotte} de carottes en dés de 1,5 cm. // Mélanger avec {huile} d’huile, sel, poivre. Étaler sur une plaque. Rôtir 25 min en remuant à mi-cuisson. // Rincer {quinoa} de quinoa et le cuire 12 min dans 2 fois son volume d’eau salée. // Mélanger quinoa et légumes rôtis, émietter {feta} de feta par-dessus.',
'boulgourlegumes|Couper {courgette} de courgettes et {tomate} de tomates en dés de 1 cm. // Verser {boulgour} de boulgour dans un saladier, le couvrir d’eau bouillante salée à hauteur, couvrir et laisser gonfler 10 min. Égrener à la fourchette. // Faire sauter les courgettes 6 min dans {huile} d’huile jusqu’à légère coloration. Ajouter les tomates 2 min. // Mélanger avec le boulgour, émietter {feta} de feta par-dessus, poivrer. Servir tiède ou froid.',
'semouleoeuf|Éplucher {carotte} de carottes, les couper en bâtonnets, couper {courgette} de courgettes en rondelles. // Cuire à la vapeur 12 min. // Hydrater {semoule} de semoule avec de l’eau bouillante salée, couvrir 5 min, égrener. // Plonger {oeufs} œuf(s) 6 min dans l’eau bouillante pour un jaune coulant, les écaler. // Assaisonner les légumes avec {epices} d’épices. Servir sur la semoule avec l’œuf.',
'falafelpita|Égoutter et rincer les pois chiches ({poischiches} boîte). Hacher {oignon} d’oignon et ail ({ail}). // Mixer pois chiches, oignon, ail, sel, cumin : la pâte doit rester grossière. Former des boulettes aplaties. // Dorer à la poêle 4 min par face. // Sauce : {yaourt} yaourt(s), sel, citron. Couper concombre ({concombre}) et tomates ({tomate}). // Garnir les pitas ({pita}) de falafels, légumes, sauce.',
'wrapavocat|Plonger {oeufs} œuf(s) 10 min dans l’eau bouillante, refroidir sous l’eau froide, écaler, écraser à la fourchette. // Écraser {avocat} d’avocat avec un filet de citron, sel, poivre. Trancher {tomate} de tomates, laver la salade ({salade}). // Réchauffer les {tortillas} tortillas 20 s par face dans une poêle sèche. // Tartiner d’avocat, répartir œuf, tomate, salade. Rouler serré en repliant les côtés, couper en deux.',
'wrapthoncru|Égoutter {thon} de thon et {mais} de maïs. Mélanger avec {yaourt} yaourt(s) nature, sel et poivre. // Laver et essorer la salade ({salade}), trancher les tomates ({tomate}). // Réchauffer les {tortillas} tortillas 20 s par face dans une poêle sèche, pour qu’elles soient souples. // Garnir de thon, salade et tomate. Rabattre les côtés, rouler serré, couper en deux.',
'saladechevre|Préchauffer le four à 200 °C. Trancher {baguette} de baguette en tranches épaisses, poser dessus {chevre} de chèvre en rondelles. Cuire 8 min jusqu’à ce que le fromage soit tendre et doré. // Laver et essorer {salade} de salade, couper {tomate} de tomates en quartiers. // Vinaigrette : {huile} d’huile, un trait de vinaigre, sel, poivre. // Dresser la salade assaisonnée, poser les tartines chaudes dessus, napper de {miel} de miel.',
'saladerizol|Cuire {riz} de riz dans 2 fois son volume d’eau salée, 10 à 12 min. Rincer à l’eau froide, bien égoutter. // Couper {tomate} de tomates en dés. Égoutter {thon} de thon, {mais} de maïs et {olives} d’olives. // Mélanger riz froid, tomates, thon, maïs, olives. // Assaisonner avec {huile} d’huile, sel, poivre, un trait de citron. Laisser 10 min au frais, servir.',
'saladepdt|Cuire {pdt} de pommes de terre 20 min dans l’eau salée avec la peau. Cuire {oeufs} œuf(s) 10 min. Hacher {echalote} d’échalote. // Peler les pommes de terre encore tièdes, couper en rondelles. // Vinaigrette : mélanger {moutarde} de moutarde, {vinaigre} de vinaigre, {huile} d’huile, sel, poivre. // Mélanger pommes de terre tièdes, échalote, vinaigrette, ajouter l’œuf écalé coupé en quartiers.',
'saladelentilles|Rincer {lentilles} de lentilles et les cuire 25 min dans l’eau non salée, jusqu’à ce qu’elles soient tendres mais fermes. Égoutter. // Râper {carotte} de carottes, hacher {oignon} d’oignon. // Mélanger lentilles tièdes, carottes, oignon. Assaisonner avec {huile} d’huile, {vinaigre} de vinaigre, sel, poivre. // Émietter {feta} de feta par-dessus. Servir tiède ou froid.',
'saladequinoa|Rincer {quinoa} de quinoa, cuire 12 min dans 2 fois son volume d’eau salée, laisser tiédir. // Couper {poulet} de poulet en dés. Le cuire 6 min dans une poêle huilée, saler, poivrer, jusqu’à ce qu’il soit doré et blanc à cœur. // Couper {avocat} d’avocat et {tomate} de tomates en dés. Égoutter {mais} de maïs. // Dresser dans un bol quinoa, poulet, avocat, tomate, maïs. // Presser le citron ({citron}) dessus, saler, poivrer.',
'buddhabowl|Préchauffer le four à 200 °C. Éplucher {patatedouce} de patate douce, couper en dés de 2 cm. Détailler {brocoli} de brocoli en bouquets. // Mélanger avec {huile} d’huile, sel, poivre, étaler sur une plaque. Rôtir 25 min en remuant à mi-cuisson. // Cuire {riz} de riz. Plonger {oeufs} œuf(s) 7 min dans l’eau bouillante, écaler. // Dresser dans un bol riz, légumes rôtis, œuf coupé en deux. Arroser de {soja} de sauce soja.',
'soupelegumes|Éplucher {carotte} de carottes, {pdt} de pommes de terre, {oignon} d’oignon et laver {poireau} de poireaux. Couper tous les légumes en morceaux de taille similaire. // Les mettre dans une casserole avec le bouillon ({bouillon} cube) et couvrir d’eau. Porter à ébullition, puis cuire 25 min à frémissement. // Mixer avec {cremeliq} de crème, en ajoutant de l’eau si c’est trop épais. // Saler, poivrer, servir avec du pain grillé.',
'soupetomate|Hacher {oignon} d’oignon. Griller {painmie} tranche(s) de pain de mie, couper en cubes pour les croûtons. // Faire revenir l’oignon 3 min dans un filet d’huile. Ajouter {tomconc} de tomates, le bouillon ({bouillon} cube) et 25 cl d’eau. // Cuire 15 min à frémissement. // Mixer avec {cremeliq} de crème, saler, poivrer, ajouter une pincée de sucre si trop acide. // Servir avec les croûtons.',
'soupechampi|Émincer {oignon} d’oignon et {champi} de champignons. Éplucher {pdt} de pommes de terre, couper en dés. // Faire revenir oignon et champignons 6 min dans un filet d’huile, jusqu’à évaporation de l’eau. // Ajouter pommes de terre, bouillon ({bouillon} cube) et eau à hauteur. Cuire 20 min. // Mixer avec {cremeliq} de crème, poivrer, rectifier le sel. Servir chaud.',
'soupelenti|Éplucher {carotte} de carottes et {oignon} d’oignon, couper en morceaux. Rincer {lentcorail} de lentilles corail. // Faire revenir oignon et carottes 4 min dans un filet d’huile avec {curry} de curry. // Ajouter les lentilles et couvrir d’eau, saler. Cuire 20 min à frémissement. // Mixer avec {laitcoco} de lait de coco, jusqu’à une texture lisse. Rectifier l’assaisonnement.',
'soupepoireau|Laver soigneusement {poireau} de poireaux, les fendre en deux et les couper en rondelles. Éplucher {pdt} de pommes de terre, couper en dés. // Mettre dans une casserole avec le bouillon ({bouillon} cube) et couvrir d’eau. Porter à ébullition, puis cuire 20 min à frémissement. // Mixer avec {cremeliq} de crème, en ajoutant de l’eau si besoin. // Saler, poivrer. Servir très chaud.',
'croquemadame|Beurrer {painmie} tranche(s) de pain de mie avec {beurre} de beurre. Garnir de {jambon} de jambon et {gruyere} de gruyère, fermer. // Dorer le croque 3 min par face dans une poêle à feu moyen, jusqu’à ce que le pain soit doré et le fromage fondu. // Dans une autre poêle, cuire {oeufs} œuf(s) au plat 3 min, saler. // Poser l’œuf sur le croque. Servir avec la salade ({salade}) assaisonnée.',
'croquechevre|Préchauffer le four à 200 °C. Garnir {painmie} tranche(s) de pain de mie de {chevre} de chèvre en rondelles et de {gruyere} de gruyère. Fermer. // Poser sur une plaque, cuire 10 min jusqu’à ce que le pain soit doré et le fromage fondu. // Napper de {miel} de miel à la sortie du four. // Servir avec la salade ({salade}) assaisonnée.',
