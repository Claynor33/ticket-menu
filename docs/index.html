<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="tm-firebase" content='{"apiKey":"AIzaSyCpSPC5k1hYSF5bLWolTRkjZT9XjnBajZc","authDomain":"ticket-menu.firebaseapp.com","projectId":"ticket-menu","storageBucket":"ticket-menu.firebasestorage.app","messagingSenderId":"137672936166","appId":"1:137672936166:web:e6c8b306a6b9ab30354927"}'><meta name="theme-color" content="#C93D26"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ticket Menu"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style><title>Ticket Menu</title>

<style>
/* Identité : cuisine chaleureuse (crème, tomate, basilic). Barre d'onglets en bas sur téléphone, rail latéral dès 900 px. Le ticket de caisse reste réservé à la liste de courses. */
:root{
  --paper:#FBF3E6; --card:#FFFDF8; --ink:#2E1F17; --ink2:#7B6659; --line:#EBDDC8; --soft:#F5E8D3;
  --tag:#C93D26; --tagink:#FFFFFF; --sun:#F4B942; --ok:#4E7F3A; --okink:#FFFFFF; --bad:#B3261E; --badink:#FFFFFF;
  --shadow:0 1px 2px rgba(80,40,10,.06),0 10px 28px rgba(80,40,10,.09);
  --f-display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1411; --card:#271C17; --ink:#F7EBDD; --ink2:#C2AB9A; --line:#43332A; --soft:#33261F;
    --tag:#EF6B52; --tagink:#1C1411; --ok:#9BCB7A; --okink:#14200D; --bad:#FF8A7A; --badink:#3A0A05;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1411; --card:#271C17; --ink:#F7EBDD; --ink2:#C2AB9A; --line:#43332A; --soft:#33261F;
  --tag:#EF6B52; --tagink:#1C1411; --ok:#9BCB7A; --okink:#14200D; --bad:#FF8A7A; --badink:#3A0A05;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
output{font-variant-numeric:tabular-nums}

/* Coque de l'appli */
.shell{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.badge{display:inline-flex;align-items:baseline;gap:6px;border:0;border-radius:999px;background:var(--ok);color:var(--okink);padding:8px 14px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad);color:var(--badink)}
.badge small{font-weight:500;opacity:.85}
main{padding-block:8px 120px;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -8px 24px rgba(80,40,10,.07);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{background:transparent;border:0;border-radius:14px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink2);position:relative}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--tag);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:1px;width:22px;height:4px;border-radius:2px;background:var(--tag)}
.nav .cnt{position:absolute;top:4px;margin-left:26px;background:var(--tag);color:var(--tagink);border-radius:9px;font-size:10.5px;font-weight:700;padding:0 5px;line-height:16px}
@media (min-width:900px){
  .shell{grid-template-columns:200px minmax(0,1fr);column-gap:32px;grid-template-areas:"bar bar" "nav main"}
  .bar{grid-area:bar}
  .nav{grid-area:nav;position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px;border:0;background:transparent;box-shadow:none;padding:16px 0}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;font-size:15px;min-height:46px}
  .nav button[aria-current="page"]{background:var(--soft)}
  .nav button[aria-current="page"]::before{display:none}
  .nav .cnt{position:static;margin:0 0 0 auto}
  main{grid-area:main;padding-bottom:40px;max-width:820px}
}

/* Éléments communs */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec{margin:26px 0 10px;font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--ink)}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--tag);color:var(--tagink);border-color:transparent;font-weight:700;font-size:16px}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--ink2);margin:6px 0 0}
.empty{padding:32px 18px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:21px}
.empty .big-e{font-size:46px;line-height:1;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;font-size:14px;font-weight:500;padding:0 6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:20px;border-radius:999px}
.stepper button:hover{background:var(--soft)}
.stepper output{min-width:34px;text-align:center;font-size:17px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--tag);height:32px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=url],input[type=number],select,textarea{width:100%;min-height:46px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
textarea{min-height:110px;font-size:14px;line-height:1.4}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;min-height:36px}
.check input{margin-top:3px;width:19px;height:19px;accent-color:var(--tag)}
.field{display:flex;flex-direction:column;gap:8px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#FFF1D6;color:#3b2a10;border:1px solid #F1D9A8;border-radius:16px;padding:12px 14px;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{background:#3A2C18;color:#F7EBDD;border-color:#5A4423}}
:root[data-theme="dark"] .banner{background:#3A2C18;color:#F7EBDD;border-color:#5A4423}
.sub{font-size:12.5px;color:var(--ink2)}

/* Images de recettes : photo si on en a une, sinon une assiette illustrée aux couleurs du plat */
.cover{position:relative;overflow:hidden;aspect-ratio:4/3;container-type:inline-size;background:linear-gradient(150deg,var(--g1,#F7DFA8),var(--g2,#EBB05A));border-radius:inherit}
.cover::before{content:"";position:absolute;left:50%;top:50%;width:64cqw;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#FFF4E4 72%);box-shadow:0 3cqw 7cqw rgba(70,30,5,.28),inset 0 0 0 2.4cqw rgba(255,255,255,.7)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.6px) 0 0/16px 16px;pointer-events:none}
.cover span{position:absolute;line-height:1;filter:drop-shadow(0 1.2cqw 1.6cqw rgba(60,25,5,.25));z-index:1}
.cover .e1{left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-size:30cqw}
.cover .e2{left:63%;top:60%;font-size:20px;font-size:17cqw}
.cover .e3{left:20%;top:58%;font-size:18px;font-size:15cqw}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.g-poulet{--g1:#F7DFA8;--g2:#EBB05A}.g-boeuf{--g1:#F1C3AD;--g2:#CF6A4C}.g-porc{--g1:#F7D2CB;--g2:#E09A94}.g-poisson{--g1:#CDE6EA;--g2:#76AFBD}.g-veg{--g1:#DCEBC0;--g2:#8DBB63}

/* Semaine */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#C93D26,#E2693A);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero::after{content:"🍅";position:absolute;right:-8px;bottom:-30px;font-size:96px;opacity:.15;transform:rotate(14deg);pointer-events:none}
.hero .lbl{color:rgba(255,255,255,.85)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.hero-top>div{display:flex;flex-direction:column;gap:2px}
.big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gauge{height:10px;background:rgba(255,255,255,.28);border-radius:6px;overflow:hidden}
.gauge i{display:block;height:100%;background:#fff;border-radius:6px}
.gauge i.bad{background:#FFD9A0}
.hero p{margin:0;font-size:13.5px;color:rgba(255,255,255,.92)}
.hero b{color:#fff}
.okt{color:var(--ok)} .badt{color:var(--bad)}
.meals{display:flex;flex-direction:column;gap:12px}
.meal{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-columns:104px minmax(0,1fr);align-items:stretch}
.meal.done{opacity:.6}
.meal.done h3{text-decoration:line-through}
.mthumb{position:relative;border-radius:0}
.mthumb .cover{aspect-ratio:auto;height:100%;min-height:104px}
.day{position:absolute;left:8px;top:8px;z-index:3;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--card);color:var(--ink);border-radius:999px;padding:3px 9px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mbody{padding:12px 14px 10px;min-width:0;display:flex;flex-direction:column;gap:4px}
.meal h3{font-size:18px;line-height:1.2}
.meta{margin:0;font-size:13px;color:var(--ink2)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink2);background:var(--paper)}
.macts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 12px}
.macts .check{margin-left:auto;min-height:36px;align-items:center}
.macts .check input{margin-top:0}

/* Recettes */
.rhead{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.rhead input{flex:1}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (min-width:640px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ropen{display:flex;flex-direction:column;width:100%;text-align:left;background:transparent;border:0;padding:0}
.ropen .cover{border-radius:0}
.rt{display:block;padding:10px 12px 0;font-family:var(--f-display);font-weight:800;font-size:15.5px;line-height:1.2;text-wrap:balance}
.rm{display:block;padding:3px 12px 12px;font-size:12px;color:var(--ink2)}
.heart{position:absolute;right:8px;top:8px;z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,253,248,.92);color:var(--ink2);font-size:20px;line-height:1;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.heart[aria-pressed="true"]{color:var(--tag)}
.ownb{position:absolute;left:8px;top:8px;z-index:4;background:var(--card);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* Courses : ticket */
.receipt{position:relative;background:#FFFEFB;color:#2E1F17;border:1px solid var(--line);border-radius:6px 6px 0 0;padding:18px 14px 26px;font-family:var(--f-mono);box-shadow:var(--shadow)}
.receipt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,#FFFEFB 0) 0 0/14px 10px,linear-gradient(45deg,transparent 7px,#FFFEFB 0) 0 0/14px 10px;filter:drop-shadow(0 2px 1px rgba(80,40,10,.15))}
.receipt .lbl,.receipt .sub,.receipt .lsub,.receipt .pcell small,.receipt .rc-head span{color:#7B6659}
.rc-head{text-align:center;border-bottom:2px dashed #D9C9AE;padding-bottom:12px;margin-bottom:6px}
.rc-head b{display:block;font-size:15px;letter-spacing:.14em}
.rc-head span{font-size:12px}
.aisle{margin:16px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7B6659;border-bottom:1px solid #E6D8C2;padding-bottom:3px;display:flex;justify-content:space-between}
.lines{list-style:none;margin:0;padding:0}
.ln{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:0 10px;align-items:start;padding:9px 0;border-bottom:1px dotted #D9C9AE}
.ln input[type=checkbox]{margin:2px 0 0;width:20px;height:20px;accent-color:#C93D26}
.ln label{cursor:pointer;min-width:0}
.nm{display:block;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.nm em{font-style:normal;color:#7B6659;font-weight:400}
.lsub{display:block;font-size:11.5px;margin-top:1px}
.ln.done .nm{text-decoration:line-through;color:#7B6659}
.pcell{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pr{background:transparent;border:0;border-bottom:1px dashed #7B6659;border-radius:3px;padding:2px 4px;min-height:28px;font-family:var(--f-mono);font-size:13.5px;font-weight:600;color:#2E1F17;font-variant-numeric:tabular-nums}
.pr:hover{background:#F4B942}
.pcell small{font-size:11px}
.pin{width:92px;text-align:right;background:#fff;color:#2E1F17;border:2px solid #C93D26;border-radius:8px;padding:3px 6px;font-family:var(--f-mono);font-size:14px;min-height:36px}
.lact{grid-column:2/-1;margin-top:4px;display:flex;gap:6px;font-family:var(--f-body)}
.lk{background:transparent;border:0;padding:4px 0;font-size:12px;color:#7B6659;text-decoration:underline;min-height:28px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #D9C9AE;margin-top:14px;padding-top:12px;font-size:18px;font-weight:600}
.shopped{background:#F5E8D3;color:#2E1F17;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;font-family:var(--f-body)}
.receipt .btn{background:#fff;color:#2E1F17;border-color:#E6D8C2}
.receipt .btn.pri{background:#C93D26;color:#fff}
.receipt .btn[aria-pressed="true"]{background:#2E1F17;color:#fff}
.receipt .shopped .btn.pri{background:#C93D26;color:#fff}

/* Placard */
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem b{font-weight:600}
.pitem .stepper button{width:38px;height:38px}
.res{display:flex;flex-direction:column;margin-top:8px}
.res button{text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--line);min-height:46px;padding:0 4px}
.res button:hover{background:var(--soft)}

/* Bilan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;margin-top:4px}
svg.chart{width:100%;height:auto;display:block}
.chart text{font-size:9px;fill:var(--ink2)}
.b-ok{fill:var(--ok)} .b-bad{fill:var(--bad)}
.b-line{stroke:var(--ink);stroke-width:2}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}

/* Réglages */
.storerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
.storerow .check{min-height:44px;align-items:center}
.storerow .check input{margin-top:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sbtn{min-height:60px;border:1px solid var(--line);background:var(--card);border-radius:18px;font-family:var(--f-display);font-weight:800;font-size:16px}
.sbtn[aria-pressed="true"]{background:var(--tag);color:var(--tagink);border-color:transparent}

/* Onboarding */
.onb{max-width:520px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.onb .logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px}
.onb .logo svg{width:34px;height:34px}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--tag)}
.onb h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
.onb p{margin:0;color:var(--ink2)}
.bigval{font-family:var(--f-display);font-size:50px;font-weight:800;line-height:1}
.onb-nav{display:flex;gap:10px;margin-top:auto;padding-top:8px}
.onb-nav .pri{flex:1}

/* Fenêtres (recette, import, remplacement, mode cuisine) */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:600px;max-height:92vh;margin:auto auto 0;border-radius:24px 24px 0 0;overflow:hidden}
dialog::backdrop{background:rgba(30,15,5,.55)}
@media (min-width:700px){dialog{margin:auto;border-radius:24px}}
.sh{padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:92vh;display:flex;flex-direction:column;gap:14px}
.sh>*{flex-shrink:0}
.sh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh h2{font-size:24px;line-height:1.12}
.sh .cover{border-radius:18px;aspect-ratio:16/9}
.sh .cover::before{width:50cqw}
.sh .cover .e1{font-size:40px;font-size:19cqw}
.sh .cover .e2{left:62%;top:60%;font-size:14px;font-size:11cqw}
.sh .cover .e3{left:31%;top:58%;font-size:12px;font-size:10cqw}
.ing{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:2px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14.5px}
.ing li.have{color:var(--ink2)}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;background:var(--tag);color:var(--tagink);font-weight:800;font-size:13px;display:grid;place-items:center}
.cookstep{font-family:var(--f-display);font-size:27px;line-height:1.25;font-weight:600;padding:12px 0;min-height:160px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;min-height:54px}
.opt:hover{background:var(--soft)}
.drow{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.drow input[type=number]{padding:6px 8px;min-height:42px;text-align:right}
.drow select{min-height:42px;padding:4px 8px;font-size:14px}
.drow .rm-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px}
.drow .why{grid-column:1/-1;font-size:12px;color:var(--ink2);margin-top:-2px}
.drow .why.warn{color:var(--bad)}
.code{font-family:var(--f-mono);font-size:11.5px;min-height:70px}

/* Notifications */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:999px;padding:11px 18px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.3)}
.toast button{background:transparent;border:0;color:var(--sun);font-weight:700;text-decoration:underline;min-height:32px}
:root[data-theme="dark"] .toast button{color:#B3571B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast button{color:#B3571B}}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.gauge i{transition:width .3s ease}}
.equip{display:flex;flex-wrap:wrap;gap:8px}
.eq{position:relative;cursor:pointer}
.eq input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.eq span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:background .18s,border-color .18s,transform .12s,color .18s}
.eq span i{font-style:normal}
.eq input:checked+span{background:var(--tag);border-color:var(--tag);color:var(--tagink)}
.eq input:focus-visible+span{outline:2px solid var(--tag);outline-offset:2px}
.eq:active span{transform:scale(.96)}
.tip{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tip p{margin:4px 0 0;font-size:14px}

/* Mouvement et confort */
.badge.bump{animation:bump .45s ease}
.lprog{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;color:var(--ink2);font-weight:600}
.lprog div{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.lprog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s ease}
.cprog{display:flex;gap:5px;margin:2px 0 4px}
.cprog i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .25s}
.cprog i.on{background:var(--tag)}
.tonight{display:inline-block;margin-right:8px;padding:2px 9px;border-radius:99px;background:var(--sun);color:#2E1F17;font:700 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.sw-hint{font-size:12px;color:var(--ink2);text-align:center;margin:2px 0 0}

  dialog.closing{animation:sheetDown .2s ease-in forwards}
  dialog.closing::backdrop{animation:fadeOut .2s ease forwards}

  .ln.done{transition:opacity .3s}
}

// r(id, nom, famille, minutes, niveau, matériel, {ingrédient: quantité par portion}, étapes)
function mkRec(id,n,g,min,lvl,mat,ing,steps,extra){
  const k=Object.keys(ing),al=[];
  k.forEach(x=>ING[x].al.forEach(a=>{if(!al.includes(a))al.push(a);}));
  return Object.assign({id,n,g,min,lvl,mat,ing,steps,al,
    pork:k.some(x=>ING[x].t==='porc'),veg:!k.some(x=>ING[x].t),
    four:/\bfour\b/.test(mat),mixeur:/mixeur/.test(mat),air:/air fryer/.test(mat),micro:/micro-ondes/.test(mat),multi:/multicuiseur/.test(mat)},extra||{});
}
function r(id,n,g,min,lvl,mat,ing,steps){R.push(mkRec(id,n,g,min,lvl,mat,ing,steps));}

// Recettes ajoutées : id | nom | famille | minutes | niveau | matériel | ingrédient:quantité par portion … | étapes séparées par //
function rt(s){
  const f=s.split('|'),ing={};
  f[6].trim().split(/\s+/).forEach(p=>{const q=p.split(':');ing[q[0]]=+q[1];});
  r(f[0].trim(),f[1].trim(),f[2].trim(),+f[3],f[4].trim(),f[5].trim(),ing,f[7].split(' // ').map(x=>x.trim()));
}

// Étapes détaillées : « id|étape // étape » ; {ingrédient} = quantité pour le foyer
function st(s){const i=s.indexOf('|'),rec=R.find(x=>x.id===s.slice(0,i));if(rec)rec.steps=s.slice(i+1).split(' // ').map(x=>x.trim());}
/*STEPS_START*/
['curry|Éplucher et émincer finement {oignon} d’oignon. Couper {poulet} de poulet en dés d’environ 2 cm. Mesurer {riz} de riz. // Chauffer {huile} d’huile dans une grande poêle à feu moyen-vif. Faire dorer le poulet 5 min en remuant, jusqu’à ce que tous les côtés soient colorés, puis le retirer de la poêle. // Baisser à feu moyen. Faire revenir l’oignon 4 min dans la même poêle, jusqu’à ce qu’il soit translucide. Ajouter {curry} de curry et mélanger 30 s : l’odeur doit monter. // Remettre le poulet, verser {laitcoco} de lait de coco, saler, poivrer. Laisser mijoter à feu doux 12 min, sans couvercle, jusqu’à ce que la sauce nappe la cuillère. // Pendant ce temps, rincer le riz puis le cuire dans 2 fois son volume d’eau salée, couvert, 10 à 12 min à feu doux. Égrener à la fourchette. // Vérifier que le poulet est cuit à cœur (aucune trace rosée). Servir le poulet et sa sauce sur le riz.',
'carbo|Mettre une grande casserole d’eau salée à bouillir. Dans un bol, battre {oeufs} œuf(s) avec {creme} de crème, {gruyere} de gruyère râpé et beaucoup de poivre. // Cuire {pates} de pâtes selon le temps du paquet, moins 1 min. Garder un demi-verre d’eau de cuisson avant d’égoutter. // Pendant la cuisson des pâtes, faire dorer {lardons} de lardons dans une poêle sans matière grasse, 5 min à feu moyen, jusqu’à ce qu’ils soient bien croustillants. // Égoutter les pâtes et les verser dans la poêle avec les lardons, feu éteint. // Verser la sauce œuf-crème sur les pâtes chaudes et remuer vivement 1 min. Si c’est trop épais, ajouter une cuillère d’eau de cuisson. Ne remets pas sur le feu : l’œuf cuirait en omelette. // Servir aussitôt avec un tour de moulin à poivre.',
'chili|Émincer {oignon} d’oignon et tailler {poivron} de poivron en petits dés. Égoutter et rincer les haricots rouges ({haricotsr} boîte). Mesurer {riz} de riz. // Chauffer {huile} d’huile dans une sauteuse à feu vif. Saisir {boeuf} de bœuf haché 4 min en l’émiettant, jusqu’à ce qu’il n’y ait plus de rose. // Ajouter l’oignon et le poivron, baisser à feu moyen et cuire 5 min en remuant. // Verser {tomconc} de tomates concassées, ajouter les haricots rouges, saler, poivrer, une pincée de piment si tu aimes. Couvrir à moitié. // Laisser mijoter 20 min à feu doux en remuant de temps en temps. La sauce doit être épaisse : si elle accroche, ajouter un peu d’eau. // En parallèle, cuire le riz dans 2 fois son volume d’eau salée, 10 à 12 min. // Goûter, rectifier l’assaisonnement et servir le chili sur le riz.',
'gratin|Préchauffer le four à 180 °C. Éplucher {pdt} de pommes de terre et les couper en rondelles fines d’environ 3 mm. Éplucher et écraser {ail} gousse(s) d’ail. Couper {jambon} de jambon en dés. // Frotter un plat à gratin avec l’ail. Y répartir une couche de pommes de terre, parsemer de jambon, puis recommencer jusqu’à épuisement. // Verser {creme} de crème mélangée à un peu d’eau, saler légèrement (le jambon est déjà salé), poivrer. // Couvrir de {gruyere} de gruyère râpé. // Enfourner 40 min. Le gratin est prêt quand la surface est dorée et que la pointe d’un couteau traverse les pommes de terre sans résistance. // Laisser reposer 5 min avant de servir.',
'saumonriz|Mesurer {riz} de riz. Détailler {brocoli} de brocoli en petits bouquets. Presser le citron. Sortir le saumon ({saumon}) du frigo 10 min avant. // Cuire le riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min à feu doux. // Faire cuire le brocoli 6 à 8 min à la vapeur ou dans un peu d’eau bouillante : il doit rester vert vif et se piquer facilement. // Saler et poivrer le saumon. Chauffer une poêle antiadhésive à feu moyen-vif avec un filet d’huile. Poser le saumon côté peau en premier : 4 min, puis le retourner et cuire 3 à 4 min. Il doit être juste nacré au centre. // Arroser le poisson d’un filet de citron. Servir avec le riz et le brocoli.',
'bolo|Éplucher et hacher {oignon} d’oignon et {ail} gousse(s) d’ail. Éplucher et râper finement {carotte} de carottes. // Chauffer {huile} d’huile dans une sauteuse. Faire revenir oignon, carotte et ail 5 min à feu moyen, jusqu’à ce qu’ils soient tendres. // Monter à feu vif, ajouter {boeuf} de bœuf haché et l’émietter à la spatule 4 min, jusqu’à ce qu’il soit bien coloré. // Verser {tomconc} de tomates concassées, saler, poivrer, ajouter une pincée de sucre pour casser l’acidité. Mijoter 20 min à feu doux, à moitié couvert. // Dans une grande casserole d’eau bouillante salée, cuire {pates} de spaghetti selon le temps du paquet. Égoutter en gardant un peu d’eau de cuisson. // Mélanger les pâtes avec la sauce 1 min dans la sauteuse : elles absorbent le goût. Servir.',
'tarte|Préchauffer le four à 190 °C. Laver les poireaux ({poireau}) et les couper en rondelles de 1 cm. // Dans une poêle, faire revenir {lardons} de lardons 3 min, ajouter les poireaux et cuire 10 min à feu moyen en remuant : ils doivent être fondants. Saler peu. // Dans un bol, battre {oeufs} œuf(s) avec {creme} de crème, du poivre et un peu de muscade. // Dérouler la pâte feuilletée dans un moule en gardant le papier cuisson, piquer le fond à la fourchette. // Étaler les poireaux sur la pâte, verser la crème aux œufs, parsemer de {gruyere} de gruyère. // Cuire 30 min : les bords doivent être gonflés et dorés. Servir tiède.',
'omelette|Éplucher {pdt} de pommes de terre et les couper en rondelles de 3 mm. Émincer {champi} de champignons. Râper {gruyere} de gruyère. // Chauffer {huile} d’huile dans une grande poêle à feu moyen. Cuire les pommes de terre 15 min en remuant souvent, jusqu’à ce qu’elles soient dorées et tendres. Saler. // Ajouter les champignons et cuire 5 min : l’eau qu’ils rendent doit s’évaporer. // Battre {oeufs} œuf(s) avec une pincée de sel et du poivre. // Baisser le feu, verser les œufs sur les légumes. Laisser prendre 3 à 4 min sans remuer. // Parsemer de gruyère, plier l’omelette en deux et laisser fondre 1 min. Servir tout de suite.',
'wraps|Laver et essorer la salade ({salade} pièce). Couper {tomate} de tomates en fines tranches. Couper {poulet} de poulet en lamelles. // Chauffer une poêle à feu moyen-vif avec un filet d’huile. Cuire le poulet 6 à 7 min en remuant, sel, poivre, jusqu’à ce qu’il soit doré et blanc à cœur. // Réchauffer les {tortillas} tortillas 20 s par face dans une poêle sèche, pour qu’elles soient souples et ne cassent pas. // Tartiner chaque tortilla de {creme} de crème en laissant 2 cm sur le bord. // Garnir de salade, tomate et poulet. Rabattre les côtés puis rouler serré. // Couper en deux en diagonale et servir tout de suite.',
'lentilles|Éplucher et couper {carotte} de carottes en petits dés. Éplucher {oignon} d’oignon et le piquer ou le couper en quatre. Rincer {lentilles} de lentilles. // Mettre lentilles, carottes et oignon dans une casserole, couvrir de 3 fois leur volume d’eau froide. Porter à ébullition puis baisser le feu. // Cuire 25 min à frémissement sans saler, jusqu’à ce que les lentilles soient tendres mais pas en purée. Saler en fin de cuisson. // Pendant ce temps, piquer {saucisse} de saucisses à la fourchette. Les cuire 12 à 15 min dans une poêle à feu moyen en les retournant, jusqu’à ce qu’elles soient bien dorées partout. // Égoutter les lentilles en gardant un peu de jus. Servir les saucisses sur les lentilles.',
'dahl|Éplucher et émincer {oignon} d’oignon. Rincer {lentilles} de lentilles. Mesurer {riz} de riz. // Dans une casserole, chauffer un filet d’huile et faire revenir l’oignon 4 min. Ajouter {curry} de curry, mélanger 30 s. // Ajouter les lentilles, {tomconc} de tomates concassées, {laitcoco} de lait de coco et 25 cl d’eau. Saler. // Porter à frémissement, couvrir et cuire 20 à 25 min en remuant de temps en temps. Ajouter un peu d’eau si ça accroche. Le dahl doit être épais et crémeux. // Cuire le riz dans 2 fois son volume d’eau salée, 10 à 12 min. // Servir le dahl sur le riz, avec un filet de citron et de la coriandre si tu en as.',
'colin|Éplucher {pdt} de pommes de terre et les couper en gros morceaux. Les plonger dans l’eau froide salée. Équeuter les haricots verts ({hv}). // Porter à ébullition et cuire les pommes de terre 15 à 20 min, jusqu’à ce qu’un couteau s’enfonce sans résistance. // Égoutter, remettre dans la casserole. Écraser avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. Garder au chaud. // Cuire les haricots verts 8 à 10 min dans l’eau bouillante salée, ils doivent rester légèrement croquants. // Cuire le colin ({colin}) à la poêle avec un peu de beurre, 3 à 4 min par face, ou à la vapeur 8 min. Le poisson doit s’effeuiller facilement. // Dresser le poisson sur la purée avec les haricots verts.',
'pizza|Préchauffer le four à 220 °C avec la plaque dedans. Émincer {champi} de champignons. Couper {jambon} de jambon en lanières. Râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte à pizza sur du papier cuisson. // Étaler {tomconc} de tomates concassées en laissant 1 cm de bord. Saler, poivrer, ajouter une pincée d’origan. // Répartir champignons, jambon, puis mozzarella. // Glisser la pizza sur la plaque chaude. Cuire 12 à 15 min : les bords sont dorés et le fromage bouillonne. // Laisser reposer 2 min avant de couper.',
'hachis|Éplucher {pdt} de pommes de terre, les couper en morceaux, les cuire 20 min dans l’eau bouillante salée. Préchauffer le four à 200 °C. // Pendant la cuisson, émincer {oignon} d’oignon. Dans une poêle, le faire revenir 4 min avec un filet d’huile. // Ajouter {boeuf} de bœuf haché, l’émietter, cuire 5 min. Ajouter {tomconc} de tomates, saler, poivrer, laisser réduire 8 min. // Égoutter les pommes de terre et les écraser avec {beurre} de beurre et {lait} de lait chaud. // Mettre la viande dans un plat, couvrir de purée, lisser à la fourchette, parsemer de {gruyere} de gruyère. // Gratiner 15 min : le dessus doit être doré et croustillant.',
'cuisses|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre et {carotte} de carottes, les couper en gros morceaux. Couper {oignon} d’oignon en quartiers. // Mettre les légumes dans un plat, les arroser de {huile} d’huile, saler, poivrer, mélanger avec les mains. // Poser les cuisses de poulet ({cuisse}) par-dessus, peau vers le haut, saler, poivrer, ajouter du thym si tu en as. // Enfourner 45 min. Retourner les légumes à mi-cuisson et arroser les cuisses avec le jus. // Contrôler la cuisson : le jus qui s’écoule doit être clair, sans trace rose. Si la peau n’est pas assez dorée, passer 5 min sous le gril. // Laisser reposer 5 min avant de servir.',
'courgettes|Préchauffer le four à 190 °C. Laver et couper {courgette} de courgettes en rondelles. Couper {chevre} de chèvre en morceaux. Mesurer {riz} de riz. // Chauffer un filet d’huile dans une poêle et faire revenir les courgettes 8 min à feu moyen-vif, jusqu’à ce qu’elles soient légèrement dorées. Saler. // Dans un bol, mélanger {creme} de crème, {oeufs} œuf(s), poivre et le chèvre. // Mettre les courgettes dans un plat, verser la préparation. // Gratiner 20 min jusqu’à ce que le dessus soit pris et doré. // Cuire le riz dans 2 fois son volume d’eau salée pendant ce temps (10 à 12 min). Servir ensemble.',
'pesto|Faire bouillir une grande casserole d’eau salée. Couper {tomate} de tomates en dés. Couper {mozza} de mozzarella en petits morceaux. // Cuire {pates} de pâtes selon le temps du paquet. Garder un peu d’eau de cuisson. // Égoutter les pâtes et les remettre dans la casserole hors du feu. // Ajouter {pesto} de pesto et 2 cuillères d’eau de cuisson, mélanger pour que la sauce enrobe bien. // Incorporer les tomates et la mozzarella à la dernière minute pour qu’elle reste fraîche. Servir.',
'butter|Éplucher {oignon} d’oignon, couper {butternut} de butternut en cubes (retirer les graines). // Mettre dans une casserole avec de l’eau à hauteur, saler. Cuire 20 min à frémissement, jusqu’à ce que le butternut s’écrase facilement. // Mixer avec {creme} de crème, en ajoutant un peu d’eau de cuisson pour la texture voulue. Poivrer, rectifier le sel. // Préchauffer le gril du four. Garnir {painmie} tranche(s) de pain de mie de {gruyere} de gruyère râpé. // Faire griller 3 à 4 min jusqu’à ce que le fromage soit doré et bouillonne. // Servir la soupe très chaude avec les croûtons au fromage.',
'thonriz|Mesurer {riz} de riz. Couper {poivron} de poivron et {tomate} de tomates en petits dés. Égoutter le thon ({thon}). // Cuire le riz dans 2 fois son volume d’eau salée, couvert, 10 à 12 min. // Chauffer {huile} d’huile dans une poêle, faire revenir les poivrons 5 min, ajouter les tomates et cuire 4 min. Saler, poivrer. // Ajouter le riz égrené et le thon émietté, mélanger 2 min pour réchauffer. // Goûter et assaisonner (citron, herbes, piment). Servir chaud.',
'croque|Préchauffer le gril du four ou le four à 200 °C. Laver la salade ({salade} pièce) et préparer une vinaigrette. // Beurrer légèrement {painmie} tranche(s) de pain de mie avec {beurre} de beurre. Poser {jambon} de jambon sur la moitié des tranches, ajouter la moitié du gruyère ({gruyere}). // Refermer avec les tranches restantes, dessus beurré vers l’extérieur. Parsemer du reste de gruyère. // Cuire 10 min : le pain doit être doré et le fromage bien fondu. // Servir avec la salade assaisonnée.',
'steak|Préchauffer le four à 220 °C. Étaler {frites} de frites surgelées sur une plaque. Laver la salade ({salade} pièce). Sortir les steaks du frigo 10 min avant. // Enfourner les frites 20 à 25 min en les remuant à mi-cuisson, jusqu’à ce qu’elles soient dorées. // Chauffer une poêle à feu vif avec un filet d’huile. Saler les steaks ({boeuf}) au dernier moment. // Cuire 2 à 3 min par face pour un steak à point (3 à 4 min pour bien cuit), sans les écraser. // Laisser reposer 2 min, puis servir avec les frites et la salade assaisonnée.',
'shak|Émincer {oignon} d’oignon et couper {poivron} de poivron en lanières. Mesurer {semoule} de semoule. // Chauffer {huile} d’huile dans une sauteuse. Cuire oignon et poivron 8 min à feu moyen. // Ajouter {tomconc} de tomates concassées, du cumin ou paprika, sel, poivre. Mijoter 10 min : la sauce doit épaissir. // Faire des creux avec le dos d’une cuillère, casser un œuf dans chacun ({oeufs} œufs en tout). Couvrir et cuire 6 à 8 min à feu doux, jusqu’à ce que les blancs soient pris. // Pendant ce temps, verser la semoule dans un saladier, la recouvrir d’eau bouillante salée à hauteur, couvrir 5 min puis égrener. // Servir directement dans la sauteuse avec la semoule.',
'crempoulet|Émincer {oignon} d’oignon. Couper {poulet} de poulet en dés. Émincer {champi} de champignons. Mesurer {riz} de riz. // Cuire le riz dans 2 fois son volume d’eau salée, 10 à 12 min. // Chauffer un filet d’huile dans une poêle. Dorer le poulet 5 min, puis ajouter l’oignon 3 min. // Ajouter les champignons et cuire 5 min, jusqu’à évaporation de l’eau. // Verser {creme} de crème, saler, poivrer, laisser mijoter 8 min à feu doux. Le poulet doit être blanc à cœur. // Servir sur le riz.',
'pastasaumon|Faire bouillir de l’eau salée. Couper {saumon} de saumon en dés d’environ 2 cm. Laver {epinards} d’épinards. // Cuire {pates} de pâtes selon le temps du paquet. // Dans une poêle, chauffer un filet d’huile, saisir le saumon 2 min. Ajouter les épinards et laisser tomber 2 min. // Verser {creme} de crème, saler, poivrer, chauffer 2 min sans faire bouillir. // Égoutter les pâtes, les mélanger délicatement à la sauce pour ne pas écraser le saumon. Servir avec un peu de citron.',
'burger|Préchauffer le four à 220 °C. Étaler {frites} de frites sur une plaque. Laver la salade ({salade} pièce), trancher {tomate} de tomates. // Enfourner les frites 20 à 25 min en les retournant à mi-cuisson. // Façonner les steaks avec {boeuf} de bœuf haché, saler, poivrer. Ils doivent faire environ 2 cm d’épaisseur. // Cuire à la poêle chaude 3 min par face. Poser {gruyere} de gruyère sur chaque steak pour la dernière minute, couvrir pour le faire fondre. // Toaster {painburger} pain(s) à burger à la poêle sèche 1 min. // Monter : pain, salade, tomate, steak fondant, pain. Servir avec les frites.',
'rizsaute|Cuire {riz} de riz dans 2 fois son volume d’eau salée, 10 à 12 min, puis l’étaler dans une assiette pour qu’il refroidisse (un riz froid ou tiède saute mieux). Râper {carotte} de carottes. // Chauffer {huile} d’huile dans un wok ou une grande poêle à feu vif. Faire sauter la carotte et {poelee} de poêlée de légumes 5 min. // Pousser les légumes sur le côté, casser {oeufs} œuf(s) dans le vide et brouiller 1 min. // Ajouter le riz, mélanger et faire sauter 3 min. // Verser {soja} de sauce soja, mélanger, goûter avant de resaler. Servir brûlant.',
'poischiches|Émincer {oignon} d’oignon. Égoutter et rincer les pois chiches ({poischiches} boîte). Mesurer {riz} de riz. // Faire revenir l’oignon avec un filet d’huile 4 min. Ajouter {curry} de curry, mélanger 30 s. // Ajouter {tomconc} de tomates, {laitcoco} de lait de coco et les pois chiches. Saler. // Laisser mijoter 15 min à feu doux, à moitié couvert, jusqu’à ce que la sauce épaississe. // Cuire le riz dans 2 fois son volume d’eau salée. Servir le curry sur le riz.',
'quiche|Préchauffer le four à 190 °C. Laver les poireaux ({poireau}), les fendre et les couper en rondelles. Couper {chevre} de chèvre en dés. // Faire fondre les poireaux dans une poêle avec un filet d’huile, 10 min à feu moyen, jusqu’à ce qu’ils soient tendres. Saler, poivrer. // Battre {oeufs} œuf(s) avec {creme} de crème, sel et poivre. // Dérouler la pâte feuilletée dans un moule, piquer le fond à la fourchette. // Répartir poireaux et chèvre, verser l’appareil. // Cuire 30 min : la quiche doit être dorée et ne plus trembler au centre. Servir tiède.',
'gratinpates|Préchauffer le four à 200 °C. Émincer {champi} de champignons, couper {jambon} de jambon en dés. Râper {gruyere} de gruyère. // Cuire {pates} de pâtes dans l’eau bouillante salée en retirant 2 min du temps indiqué : elles finiront de cuire au four. // Poêler les champignons avec un filet d’huile 6 min jusqu’à évaporation de l’eau. // Mélanger pâtes égouttées, champignons, jambon et {creme} de crème. Poivrer. // Verser dans un plat, couvrir de gruyère. Gratiner 15 min jusqu’à belle coloration.',
'risotto|Émincer {oignon} d’oignon et {champi} de champignons. Faire chauffer 1 litre d’eau avec un peu de sel dans une casserole, garder au chaud. // Faire fondre la moitié du beurre ({beurre}) dans une sauteuse, cuire les champignons 6 min à feu vif, les retirer. // Dans la même sauteuse, faire revenir l’oignon 3 min, ajouter {riz} de riz rond, remuer 1 min jusqu’à ce que les grains soient translucides. // Ajouter une louche d’eau chaude, remuer jusqu’à absorption, puis recommencer. Compter 18 min. Le riz doit être crémeux mais encore ferme au centre. // Hors du feu, ajouter les champignons, {creme} de crème, {gruyere} de gruyère et le reste du beurre. Mélanger énergiquement, couvrir 2 min, servir.',
'boulettes|Hacher {oignon} d’oignon et {ail} gousse(s) d’ail. Dans un bol, mélanger {boeuf} de bœuf haché, la moitié de l’oignon, {oeufs} œuf(s), sel, poivre. Former des boulettes de la taille d’une noix. // Chauffer {huile} d’huile dans une poêle, dorer les boulettes 6 à 8 min en les tournant. Les retirer. // Dans la même poêle, cuire le reste d’oignon et l’ail 3 min, ajouter {tomconc} de tomates, saler. Remettre les boulettes. // Laisser mijoter 15 min à feu doux, à couvert. // Verser {semoule} de semoule dans un saladier, couvrir d’eau bouillante salée à hauteur, couvrir 5 min, égrener à la fourchette avec un filet d’huile. Servir.',
'papillote|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les couper en cubes de 2 cm, les mélanger avec un filet d’huile et du sel. Couper {courgette} de courgettes en rondelles. // Mettre les pommes de terre sur une plaque et enfourner 10 min. // Pendant ce temps, préparer des carrés de papier cuisson. Poser courgettes et {saumon} de saumon au centre, saler, poivrer, ajouter {huile} d’huile et des rondelles de citron. // Fermer hermétiquement les papillotes en pliant les bords. // Les ajouter au four pour 20 min, les pommes de terre continuent de cuire. // Ouvrir une papillote avec précaution (vapeur brûlante). Le saumon doit être rose clair et se défaire à la fourchette.',
'fajitas|Couper {poulet} de poulet, {poivron} de poivron et {oignon} d’oignon en fines lanières. // Chauffer un filet d’huile dans une grande poêle à feu vif. Saisir le poulet 5 min, assaisonner de paprika, cumin, sel, poivre. // Ajouter poivron et oignon et cuire 6 à 8 min en remuant, jusqu’à ce qu’ils soient tendres mais encore un peu croquants. // Réchauffer les {tortillas} tortillas dans une poêle sèche, 20 s par face. // Garnir chaque tortilla de poulet, légumes et {creme} de crème. Rouler et manger tout de suite.',
'tortilla|Éplucher {pdt} de pommes de terre et {oignon} d’oignon, les couper en lamelles fines. Laver la salade ({salade} pièce). // Chauffer {huile} d’huile dans une poêle antiadhésive à feu moyen. Cuire pommes de terre et oignon 15 min en remuant, couvert, jusqu’à ce qu’ils soient très tendres sans colorer. Saler. // Battre {oeufs} œuf(s) dans un saladier, ajouter les pommes de terre égouttées, mélanger. // Reverser dans la poêle, cuire 6 min à feu doux jusqu’à ce que le dessous soit doré. // Retourner la tortilla avec une assiette et cuire 5 min l’autre face. Le centre peut rester légèrement baveux. // Servir tiède avec la salade.',
'basquaise|Émincer {oignon} d’oignon, couper {poivron} de poivron en lanières. Mesurer {riz} de riz. // Chauffer un filet d’huile dans une cocotte, dorer les cuisses de poulet ({cuisse}) 4 min par face, salées. Les retirer. // Faire revenir l’oignon et le poivron 6 min dans la graisse. // Ajouter {tomconc} de tomates, du paprika, sel, poivre, remettre le poulet. Couvrir. // Mijoter 30 min à feu doux, en retournant les cuisses à mi-cuisson. Le poulet doit se détacher facilement. // Cuire le riz dans 2 fois son volume d’eau salée, 10 à 12 min. Servir le poulet et sa sauce sur le riz.',
'saucissepur|Éplucher {pdt} de pommes de terre, les couper en morceaux, les cuire 20 min dans l’eau bouillante salée. Équeuter les haricots verts ({hv}). // Piquer {saucisse} de saucisses. Les cuire 15 min dans une poêle à feu moyen en les retournant, jusqu’à ce qu’elles soient dorées partout et cuites à cœur. // Cuire les haricots verts 8 à 10 min dans l’eau bouillante salée. // Égoutter les pommes de terre, les écraser avec {beurre} de beurre et {lait} de lait chaud, saler, muscade. // Servir saucisses, purée et haricots.',
'pastathon|Hacher {oignon} d’oignon et {ail} gousse(s) d’ail. Égoutter le thon ({thon}). Mettre l’eau des pâtes à bouillir. // Faire revenir oignon et ail dans {huile} d’huile 3 min. // Ajouter {tomconc} de tomates, saler, poivrer, cuire 8 min. Ajouter le thon émietté en fin de cuisson. // Cuire {pates} de pâtes selon le temps du paquet, égoutter en gardant un peu d’eau. // Mélanger pâtes et sauce 1 min dans la poêle avec un peu d’eau de cuisson. Servir.',
'pizzachevre|Préchauffer le four à 220 °C. Laver {courgette} de courgettes et les couper en fines rondelles. Couper {chevre} de chèvre en rondelles. Râper {mozza} de mozzarella. // Dérouler {pizzapate} pâte à pizza sur du papier cuisson et étaler {tomconc} de tomates en laissant 1 cm de bord. // Répartir les courgettes, le chèvre, puis la mozzarella. Poivrer, ajouter un filet d’huile. // Cuire 12 à 15 min : les bords sont dorés et le fromage fondu.',
'soupe|Laver soigneusement les poireaux ({poireau}), les couper en rondelles. Éplucher {pdt} de pommes de terre et les couper en dés. // Mettre dans une casserole, couvrir d’eau à hauteur, saler. Cuire 20 min à frémissement. // Mixer avec {creme} de crème en ajoutant de l’eau de cuisson si trop épais. Poivrer. // Faire griller {painmie} tranche(s) de pain de mie, les couper en cubes. // Servir la soupe avec les croûtons et {gruyere} de gruyère râpé.',
'yassa|Émincer {oignon} d’oignon en fines demi-lunes et hacher {ail} gousse(s) d’ail. Presser le citron ({citron} pièce) dans un bol, ajouter {moutarde} de moutarde, la moitié de l’huile ({huile}), l’ail, du sel et du poivre. Couper le poulet ({poulet}) en lanières de 2 cm et le laisser mariner dans ce mélange 10 min pendant que tu prépares le reste. // Rincer {basmati} de riz basmati sous l’eau froide jusqu’à ce qu’elle soit presque claire. Le verser dans une fois et demie son volume d’eau salée, couvrir et cuire 10 min à feu très doux, puis laisser gonfler 5 min hors du feu sans soulever le couvercle. // Chauffer le reste d’huile dans une grande poêle à feu moyen-vif. Égoutter le poulet (garder la marinade) et le saisir 4 min en remuant, jusqu’à ce qu’il soit bien doré. Le réserver dans une assiette. // Dans la même poêle, mettre les oignons avec une pincée de sel. Cuire 12 à 15 min à feu moyen en remuant souvent : ils doivent devenir tendres, translucides et légèrement dorés. Si ça accroche, ajouter une cuillère à soupe d’eau. // Remettre le poulet avec sa marinade et {olives} d’olives. Couvrir et mijoter 8 min à feu doux : le poulet doit être cuit à cœur (aucune trace rose) et la sauce courte et onctueuse. // Égrener le riz à la fourchette et servir le poulet et ses oignons par-dessus.',
'tikka|Éplucher {oignon} d’oignon et le hacher finement. Hacher {ail} gousse(s) d’ail et râper {gingembre} de gingembre. Couper le poulet ({poulet}) en cubes de 3 cm. Les mélanger dans un bol avec la moitié de la pâte de curry ({patecurry}), {yaourt} yaourt(s), sel et poivre, et laisser mariner 10 min. // Rincer {basmati} de riz basmati, le verser dans une fois et demie son volume d’eau salée, couvrir et cuire 10 min à feu très doux, puis laisser gonfler 5 min hors du feu. // Dans une sauteuse, faire revenir l’oignon 5 min à feu moyen jusqu’à ce qu’il soit translucide. Ajouter l’ail, le gingembre et le reste de pâte de curry, remuer 1 min : ça doit sentir fort et épicé. // Verser les tomates concassées ({tomconc}) et laisser mijoter 8 min à feu moyen, en remuant de temps en temps, jusqu’à ce que la sauce épaississe. // Ajouter le poulet mariné. Cuire 10 min à feu doux en remuant : les morceaux doivent être cuits à cœur (aucune trace rose). Incorporer la crème ({creme}), chauffer 2 min sans faire bouillir. Goûter et ajuster le sel. // Égrener le riz à la fourchette et servir avec le poulet et sa sauce.',
'mafe|Éplucher {patatedouce} de patate douce et {carotte} de carottes, les couper en cubes de 2 cm. Hacher {oignon} d’oignon. Diluer le bouillon cube ({bouillon}) dans 250 ml d’eau chaude. // Chauffer un filet d’huile dans une cocotte à feu moyen-vif. Dorer les cuisses de poulet ({cuisse}) 4 min de chaque côté, jusqu’à ce que la peau soit bien colorée. Les réserver. // Dans la même cocotte, faire revenir l’oignon 4 min. Ajouter le concentré de tomate ({concentre}) et remuer 1 min pour le faire caraméliser légèrement. // Délayer le beurre de cacahuète ({cacahuete}) avec un peu de bouillon chaud dans un bol pour éviter les grumeaux, puis le verser dans la cocotte avec le reste de bouillon. Remettre le poulet, ajouter la patate douce et les carottes. // Couvrir et mijoter 35 à 40 min à feu doux, en remuant de temps en temps. Le poulet doit se détacher facilement de l’os et la sauce doit être épaisse et nappante ; si elle est trop liquide, finir 5 min sans couvercle. // Pendant ce temps, cuire {riz} de riz 12 min dans une casserole d’eau salée. Servir le mafé sur le riz.',
'pouletabricots|Hacher {oignon} d’oignon. Couper {abricots} d’abricots secs en deux. Égoutter et rincer les pois chiches ({poischiches} boîte). Diluer le bouillon cube ({bouillon}) dans 200 ml d’eau chaude. // Chauffer un filet d’huile dans une cocotte à feu moyen-vif. Dorer les cuisses de poulet ({cuisse}) 4 min de chaque côté, saler, poivrer, puis les réserver. // Dans la même cocotte, faire revenir l’oignon 4 min. Ajouter {epices} d’épices (cumin, cannelle, paprika) et remuer 30 s jusqu’à ce qu’elles embaument. // Remettre le poulet, ajouter les abricots, les pois chiches et le bouillon. Couvrir et mijoter 35 min à feu doux, jusqu’à ce que le poulet soit tendre et que la sauce soit sirupeuse. // Pendant ce temps, verser {semoule} de semoule dans un saladier, la couvrir d’une même hauteur d’eau bouillante salée, filmer et laisser gonfler 5 min. Égrener à la fourchette avec un filet d’huile. // Faire dorer les amandes ({amandes}) 2 min dans une poêle sèche, en surveillant. Servir le poulet sur la semoule, parsemé d’amandes.',
'poulettexmex|Couper le poulet ({poulet}) en lanières. Les mélanger avec {epices} d’épices (paprika, cumin, ail en poudre), sel et poivre. Couper {poivron} de poivron en dés. Égoutter et rincer les haricots noirs ({haricotsn} boîte) et le maïs ({mais}). // Cuire {riz} de riz 12 min dans une casserole d’eau salée, égoutter. // Chauffer un filet d’huile dans une grande poêle à feu vif. Saisir le poulet 5 min en remuant, jusqu’à ce qu’il soit doré et cuit à cœur. Le réserver. // Dans la même poêle, faire sauter le poivron 3 min. Ajouter les tomates concassées ({tomconc}), les haricots noirs et le maïs. Mijoter 8 min à feu moyen jusqu’à ce que la sauce épaississe. // Remettre le poulet, mélanger 1 min. Couper l’avocat ({avocat}) en tranches et l’arroser du jus du citron ({citron}) pour qu’il ne noircisse pas. // Servir le riz, le poulet aux haricots noirs et l’avocat par-dessus.',
'poulesatay|Mélanger dans un bol le beurre de cacahuète ({cacahuete}), la sauce soja ({soja}), le miel ({miel}), le jus du citron ({citron} pièce), {ail} gousse(s) d’ail écrasée(s) et 2 cuillères à soupe d’eau chaude jusqu’à obtenir une sauce lisse. Couper le poulet ({poulet}) en lanières et le mélanger avec la moitié de la sauce. // Râper {carotte} de carottes et couper {concombre} de concombre en bâtonnets. // Cuire {nouilles} de nouilles selon le paquet (en général 4 min), les égoutter et les rincer. // Chauffer un filet d’huile dans une poêle à feu vif. Saisir le poulet 5 à 6 min en remuant, jusqu’à ce qu’il soit doré et cuit à cœur (aucune trace rose). // Ajouter les nouilles et le reste de sauce dans la poêle, mélanger 1 min pour bien enrober : ajouter un peu d’eau si la sauce est trop épaisse. // Servir avec les carottes et le concombre crus par-dessus, pour le croquant.',
'pouletvert|Couper {courgette} de courgettes en demi-rondelles et {poivron} de poivron en lanières. Râper {gingembre} de gingembre. Couper le poulet ({poulet}) en lanières. // Rincer {basmati} de riz basmati, le verser dans une fois et demie son volume d’eau salée, couvrir et cuire 10 min à feu très doux, puis laisser gonfler 5 min hors du feu. // Chauffer un filet d’huile dans un wok ou une sauteuse à feu moyen-vif. Faire revenir la pâte de curry ({patecurry}) avec le gingembre 1 min en remuant : elle doit dégager ses arômes. // Ajouter le poulet et cuire 4 min en remuant pour bien l’enrober. Verser le lait de coco ({laitcoco}) et porter à frémissement. // Ajouter la courgette et le poivron. Mijoter 10 min à feu moyen-doux, jusqu’à ce que les légumes soient tendres mais gardent un peu de tenue et que le poulet soit cuit à cœur. Goûter et ajuster le sel. // Égrener le riz et servir le curry par-dessus.',
'blanquette|Éplucher {carotte} de carottes et les couper en rondelles. Hacher {oignon} d’oignon. Couper {champi} de champignons en quarts. Couper la dinde ({dinde}) en cubes de 3 cm. Diluer le bouillon cube ({bouillon}) dans 300 ml d’eau chaude. // Dans une cocotte, faire fondre le beurre ({beurre}) à feu moyen. Faire revenir la dinde et l’oignon 5 min, sans coloration : la viande doit simplement blanchir. // Saupoudrer de farine ({farine}), mélanger 1 min, puis verser le bouillon petit à petit en remuant pour éviter les grumeaux. Ajouter les carottes. // Couvrir et mijoter 30 min à feu doux. Ajouter les champignons et cuire encore 10 min : la viande doit être tendre à la fourchette et la sauce nappante. // Pendant ce temps, cuire {riz} de riz 12 min dans une casserole d’eau salée. // Hors du feu, incorporer la crème ({creme}) et un filet de jus de citron (le citron : {citron} pièce). Goûter, ajuster le sel et le poivre. Servir sur le riz.',
'cordonbleu|Éplucher {pdt} de pommes de terre, les couper en morceaux et les cuire 20 min dans l’eau salée frémissante. Préchauffer le four à 200 °C. // Ouvrir le poulet ({poulet}) en deux dans l’épaisseur, sans le couper complètement, comme un livre. L’aplatir légèrement entre deux feuilles de film. Garnir l’intérieur de jambon ({jambon}) et de gruyère ({gruyere}), refermer et bien serrer les bords. // Préparer 3 assiettes : farine ({farine}), {oeufs} œuf(s) battu(s) avec une pincée de sel, chapelure ({chapelure}). Passer chaque cordon bleu dans la farine, l’œuf, puis la chapelure en appuyant bien. // Chauffer un filet d’huile dans une poêle allant au four. Dorer le cordon bleu 3 min de chaque côté, puis l’enfourner 12 à 15 min : le poulet doit être cuit à cœur et le fromage fondu. // Cuire les haricots verts ({hv}) 8 min à l’eau bouillante salée. Égoutter les pommes de terre, les écraser avec le lait chaud ({lait}) et le beurre ({beurre}), saler et poivrer. // Servir le cordon bleu avec la purée et les haricots verts.',
'cabsesame|Préchauffer le four à 200 °C. Rincer {basmati} de riz basmati, le verser dans une fois et demie son volume d’eau salée, couvrir et cuire 10 min à feu très doux, puis laisser gonfler 5 min hors du feu. // Mélanger la sauce soja ({soja}) et le miel ({miel}) dans une assiette creuse. Verser les graines de sésame ({sesame}) dans une autre assiette. // Sécher le cabillaud ({cabillaud}) avec du papier absorbant. Le passer côté dessus dans le mélange soja-miel, puis dans les graines de sésame en appuyant pour qu’elles adhèrent. // Poser le poisson sur une plaque recouverte de papier cuisson, avec un filet d’huile ({huile}). Cuire 10 à 12 min : il est prêt quand il s’effeuille facilement et que le centre est nacré. // Détailler le brocoli ({brocoli}) en petits bouquets et le cuire à la vapeur ou à l’eau bouillante salée 5 min, il doit rester croquant. // Servir le cabillaud sur le riz avec le brocoli.',
'cabamande|Éplucher {pdt} de pommes de terre, les couper en morceaux et les cuire 20 min dans l’eau salée. Préchauffer le four à 200 °C. // Mélanger les amandes effilées ({amandes}) avec la chapelure ({chapelure}), du sel et du poivre dans une assiette. // Sécher le cabillaud ({cabillaud}), saler, puis badigeonner le dessus de moutarde ({moutarde}). Presser le mélange amandes-chapelure dessus. // Poser le poisson sur une plaque recouverte de papier cuisson. Cuire 12 à 15 min : la croûte doit être dorée et le poisson s’effeuiller à la fourchette. // Cuire les haricots verts ({hv}) 8 min à l’eau bouillante salée. Égoutter les pommes de terre, les écraser avec le lait chaud ({lait}) et le beurre ({beurre}), saler et poivrer. // Servir le cabillaud avec la purée et les haricots verts.',
'cabvierge|Éplucher {pdt} de pommes de terre, les couper en gros cubes et les cuire 15 à 20 min dans l’eau salée, jusqu’à ce qu’une lame s’y enfonce sans résistance. // Préparer la sauce vierge : couper les tomates ({tomate}) en petits dés, hacher finement l’échalote ({echalote}) et ciseler {herbes} botte(s) d’herbes. Mélanger avec {huile} d’huile d’olive, le jus de citron ({citron} pièce), du sel et du poivre. Laisser reposer 10 min pour que les saveurs se mélangent. // Sécher le cabillaud ({cabillaud}) et saler. Chauffer un filet d’huile dans une poêle à feu moyen-vif. // Cuire le poisson 4 min côté peau (ou côté présentation), le retourner et cuire encore 3 à 4 min à feu doux. Il est prêt quand il s’effeuille facilement. // Égoutter les pommes de terre. Servir le poisson avec les pommes de terre, nappé de sauce vierge à température ambiante.',
'cassolette|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les couper en rondelles de 5 mm et les cuire 8 min à l’eau salée. Égoutter. // Couper {poireau} de poireaux en rondelles et les laver. Les faire fondre 8 min dans une poêle avec le beurre ({beurre}) et une pincée de sel, à feu doux, jusqu’à ce qu’ils soient tendres. // Ajouter la crème ({creme}) et la moutarde ({moutarde}), mélanger et laisser épaissir 2 min. Ajouter le jus de citron (le citron : {citron} pièce). // Couper le colin ({colin}) en gros morceaux, saler légèrement. Les répartir dans un plat à gratin, verser la sauce aux poireaux par-dessus. // Disposer les rondelles de pommes de terre en écailles sur le dessus, parsemer de gruyère ({gruyere}). Cuire 15 à 18 min : le dessus doit être doré et le poisson cuit (il s’effeuille facilement).',
'tourtepoisson|Préchauffer le four à 200 °C. Hacher {oignon} d’oignon. Émincer {fenouil} de fenouil finement. Couper les tomates ({tomate}) en dés. Ciseler {herbes} botte(s) d’herbes. // Dans une poêle, faire revenir l’oignon et le fenouil 6 min dans l’huile ({huile}) à feu moyen. Ajouter les tomates et cuire 5 min jusqu’à ce que le jus s’évapore. Laisser tiédir. // Couper le colin ({colin}) en cubes de 2 cm. Mélanger avec la préparation de légumes, la crème ({creme}), les herbes, du sel et du poivre. // Dérouler la pâte feuilletée ({feuillet}) sur une plaque. Déposer la garniture au centre, en laissant 3 cm de bord. Replier les bords vers le centre en les pinçant, pour former une tourte rustique ouverte. // Cuire 25 à 30 min : la pâte doit être bien dorée et gonflée, le poisson cuit. Laisser reposer 5 min avant de servir.',
'saumonpesto|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les couper en quartiers et les mélanger avec la moitié de l’huile ({huile}), du sel et du poivre. Les étaler sur une plaque et cuire 20 min en les retournant à mi-cuisson. // Mélanger le pesto ({pesto}) avec la chapelure ({chapelure}) dans un bol jusqu’à obtenir une pâte granuleuse. // Poser les pavés de saumon ({saumon}) sur une plaque avec du papier cuisson. Tasser la pâte au pesto sur le dessus. // Enfourner le saumon 10 à 12 min : le dessus doit être doré et le centre juste nacré. // Cuire les haricots verts ({hv}) 8 min à l’eau bouillante salée, égoutter, assaisonner avec le reste d’huile. Servir le tout.',
'crevchorizo|Hacher {oignon} d’oignon. Couper {poivron} de poivron en dés et le chorizo ({chorizo}) en petits dés. Verser {riz} de riz dans une casserole avec {epices} d’épices (paprika, curcuma) et une fois et demie son volume d’eau salée. // Cuire le riz 12 min à couvert à feu doux, jusqu’à absorption complète de l’eau. // Dans une grande poêle, dorer le chorizo 2 min à sec : il rend son gras. Ajouter l’oignon et le poivron, cuire 5 min. // Ajouter les tomates concassées ({tomconc}) et mijoter 5 min. Ajouter les crevettes ({crevettes}) et chauffer 2 min seulement : elles sont déjà cuites. // Servir la poêlée sur le riz.',
'polpette|Hacher {oignon} d’oignon, {ail} gousse(s) d’ail et ciseler {herbes} botte(s) de persil. Dans un saladier, mélanger le bœuf ({boeuf}) avec la moitié de l’oignon, la moitié de l’ail, {oeufs} œuf(s), la chapelure ({chapelure}), le parmesan ({parmesan}), sel et poivre. Pétrir du bout des doigts. // Former de petites boulettes de 3 cm avec les mains mouillées. // Faire revenir le reste d’oignon et d’ail dans un filet d’huile 3 min dans une sauteuse. Ajouter les tomates concassées ({tomconc}), le persil, sel et poivre. Porter à frémissement. // Déposer les boulettes dans la sauce, couvrir et mijoter 20 min à feu doux en retournant les boulettes à mi-cuisson : elles doivent être cuites à cœur (aucune trace rose). // Cuire {pates} de spaghetti dans une grande casserole d’eau bouillante salée selon le paquet. Égoutter en gardant un peu d’eau de cuisson. // Mélanger les pâtes avec un peu de sauce et d’eau de cuisson, servir avec les boulettes.',
'pastamex|Préchauffer le four à 200 °C. Hacher {oignon} d’oignon et couper {poivron} de poivron en dés. Égoutter le maïs ({mais}). Cuire {pates} de penne 2 min de moins que le temps indiqué (elles finiront au four), égoutter. // Dans une sauteuse, faire revenir l’oignon et le poivron 4 min. Ajouter le bœuf ({boeuf}) et l’émietter à la spatule, cuire 5 min jusqu’à ce qu’il soit bien coloré. // Ajouter les épices ({epices} : paprika, cumin, piment doux), remuer 30 s. Verser les tomates concassées ({tomconc}) et le maïs. Mijoter 8 min. // Mélanger les penne avec la sauce, verser dans un plat à gratin et parsemer de gruyère ({gruyere}). // Gratiner 8 à 10 min : le fromage doit être fondu et légèrement doré.',
'wrapsboeufsoja|Mélanger la sauce soja ({soja}), le miel ({miel}), le gingembre râpé ({gingembre}) et {ail} gousse(s) d’ail écrasée(s) dans un bol. Râper {carotte} de carottes, couper {concombre} de concombre en bâtonnets et laver la salade ({salade}). // Chauffer une poêle à feu vif. Faire cuire le bœuf ({boeuf}) 5 min en l’émiettant, jusqu’à ce qu’il soit bien doré. // Verser la sauce dans la poêle et laisser caraméliser 1 à 2 min en remuant : la viande doit être laquée et brillante. // Réchauffer les tortillas ({tortillas}) 20 s par face dans une poêle sèche. // Garnir chaque tortilla de salade, bœuf laqué, carotte et concombre. Rouler en serrant et couper en deux.',
'wokboeuf|Cuire {nouilles} de nouilles selon le paquet, égoutter et rincer à l’eau froide. Hacher {ail} gousse(s) d’ail et râper {gingembre} de gingembre. // Chauffer l’huile ({huile}) dans un wok ou une grande poêle à feu vif. Faire cuire le bœuf ({boeuf}) 4 min en l’émiettant, jusqu’à ce qu’il soit bien doré. Le réserver. // Dans la même poêle, sauter la poêlée de légumes ({poelee}) 5 min à feu vif avec l’ail et le gingembre : les légumes doivent être chauds mais encore croquants. // Remettre le bœuf, ajouter les nouilles et la sauce soja ({soja}). Sauter 2 à 3 min en remuant sans cesse jusqu’à ce que tout soit bien enrobé. Servir aussitôt.',
'magret|Préchauffer le four à 200 °C. Éplucher {pdt} de pommes de terre, les couper en cubes de 2 cm et les cuire 8 min à l’eau salée. Égoutter. // Quadriller la peau du magret ({magret}) avec un couteau, sans entamer la chair. Saler et poivrer. // Poser le magret côté peau dans une poêle froide, sans huile. Chauffer à feu moyen et laisser cuire 8 à 10 min : la graisse fond et la peau devient dorée et croustillante. Éliminer l’excès de graisse en cours de cuisson (en garder 1 cuillère). // Retourner le magret et cuire 3 min côté chair, puis le passer au four 4 min pour une cuisson rosée. Le laisser reposer 5 min sous du papier alu avant de trancher. // Dans la graisse de canard conservée, faire sauter les pommes de terre 10 min avec {ail} gousse(s) d’ail, jusqu’à ce qu’elles soient dorées. Cuire les haricots verts ({hv}) 8 min à l’eau salée. // Mélanger le miel ({miel}) et le vinaigre balsamique ({balsamique}) dans la poêle chaude du magret, laisser réduire 1 min. Trancher le magret et napper de sauce.',
'mignonmoutarde|Éplucher {pdt} de pommes de terre, les couper en rondelles de 1 cm. Émincer l’échalote ({echalote}) et couper {champi} de champignons en lamelles. // Dans une poêle, chauffer la moitié de l’huile ({huile}) à feu moyen. Dorer les pommes de terre 15 min en les retournant, jusqu’à ce qu’elles soient dorées et fondantes. Saler. // Couper le filet mignon ({filetmignon}) en médaillons de 2 cm, saler et poivrer. Dans une autre poêle avec le reste d’huile, les saisir 3 min de chaque côté à feu vif. Les réserver sous du papier alu. // Dans la même poêle, faire revenir l’échalote et les champignons 5 min jusqu’à ce qu’ils soient dorés. // Ajouter la crème ({creme}) et la moutarde ({moutarde}), laisser réduire 3 min. Remettre le porc avec son jus, réchauffer 1 min : il doit être cuit mais encore tendre (aucune trace rose vif). Servir avec les pommes de terre.',
'gnocchipoulfen|Hacher {oignon} d’oignon. Émincer {fenouil} de fenouil finement. Couper les tomates ({tomate}) en dés. Couper le poulet ({poulet}) en petits cubes. Ciseler {herbes} botte(s) de basilic ou de persil. // Dans une sauteuse, saisir le poulet 5 min dans un filet d’huile à feu vif. Ajouter l’oignon et le fenouil, cuire 5 min. // Ajouter les tomates, couvrir et cuire 5 min à feu moyen. Verser la crème ({creme}) et laisser réduire 2 min. // Cuire les gnocchis ({gnocchi}) dans l’eau bouillante salée : ils sont prêts dès qu’ils remontent à la surface (2 min). Les égoutter. // Les mélanger à la sauce, ajouter les herbes et la salade ({salade}), servir aussitôt.',
'quesadillas|Couper {poivron} de poivron en lanières fines. Couper le poulet ({poulet}) en petites lanières, les mélanger avec {epices} d’épices (paprika, cumin) et du sel. Égoutter le maïs ({mais}). // Chauffer l’huile ({huile}) dans une poêle à feu vif. Saisir le poulet 4 min, ajouter le poivron et le maïs, cuire 4 min. Réserver. // Sauce : mélanger {yaourt} yaourt(s) avec du sel, du poivre et un peu de jus de citron. // Poser une tortilla ({tortillas}) dans la poêle chaude. Parsemer de gruyère ({gruyere}), ajouter la garniture, refermer avec la 2e tortilla. // Cuire 2 à 3 min par face à feu moyen : les tortillas doivent être dorées et le fromage fondu. Couper en parts, servir avec la sauce.',
'burritobowl|Cuire {riz} de riz dans une fois et demie son volume d’eau salée, couvrir, 12 min à feu doux. Égoutter et rincer les haricots noirs ({haricotsn} boîte) et le maïs ({mais}). // Dans une poêle, chauffer les haricots et le maïs 5 min avec {epices} d’épices (cumin, paprika), sel et poivre. // Couper les tomates ({tomate}) en dés, ciseler {herbes} botte(s) de coriandre ou de persil, mélanger avec le jus du citron ({citron} pièce) : c’est la salsa. // Couper l’avocat ({avocat}) en tranches. Assaisonner {yaourt} yaourt(s) avec du sel. // Dans un bol, disposer le riz, les haricots, la salsa, l’avocat et le yaourt.',
'tomkha|Râper {gingembre} de gingembre. Couper {champi} de champignons en lamelles et le poulet ({poulet}) en fines lanières. Diluer le bouillon cube ({bouillon}) dans 250 ml d’eau chaude. // Dans une casserole, porter à frémissement le bouillon, le lait de coco ({laitcoco}) et le gingembre. Laisser infuser 5 min à feu doux. // Ajouter le poulet et les champignons, cuire 8 min à frémissement : le poulet doit être blanc et cuit à cœur. // Ajouter les nouilles ({nouilles}) et cuire 3 à 4 min selon le paquet. // Hors du feu, ajouter la sauce soja ({soja}) et le jus du citron ({citron} pièce). Goûter : ça doit être parfumé, acidulé et salé. Servir bien chaud.',
'padthai|Cuire {nouilles} de nouilles selon le paquet, égoutter et rincer. Mélanger la sauce soja ({soja}), le jus du citron ({citron} pièce), le miel ({miel}) et le beurre de cacahuète ({cacahuete}). Râper {carotte} de carottes. Hacher {ail} gousse(s) d’ail. // Casser {oeufs} œuf(s) dans un bol et les battre. Chauffer un filet d’huile dans un wok ou une grande poêle à feu vif. // Faire revenir l’ail et la carotte 2 min. Ajouter les crevettes ({crevettes}) et chauffer 1 min. // Pousser la garniture sur le côté, verser l’œuf battu, laisser prendre 30 s puis mélanger en brouillant. // Ajouter les nouilles et la sauce, sauter 2 min à feu vif en remuant sans cesse jusqu’à ce que tout soit enrobé. Servir aussitôt avec un quartier de citron.',
'patatefarcie|Préchauffer le four à 200 °C. Piquer {patatedouce} de patate douce à la fourchette. La poser sur une plaque et cuire 40 à 45 min : elle doit être tendre sous la lame. // Hacher {oignon} d’oignon. Égoutter et rincer les haricots rouges ({haricotsr} boîte) et le maïs ({mais}). // Faire revenir l’oignon 4 min dans l’huile ({huile}), ajouter les haricots, le maïs et {epices} d’épices. Cuire 5 min. // Ouvrir la patate douce en deux, écraser légèrement la chair. Garnir de haricots et de maïs, émietter la feta ({feta}) dessus. // Servir avec {yaourt} yaourt(s) salé(s) en filet.',
'parmentierpd|Préchauffer le four à 200 °C. Éplucher {patatedouce} de patate douce, la couper en cubes et la cuire 15 min à l’eau salée. // Rincer {lentilles} de lentilles, les cuire 20 min dans 3 fois leur volume d’eau. Égoutter. // Hacher {oignon} d’oignon et râper {carotte} de carottes. Les faire revenir 5 min dans une poêle. Ajouter les tomates concassées ({tomconc}) et les lentilles, mijoter 5 min. // Écraser la patate douce avec le lait ({lait}) et le beurre ({beurre}), saler et poivrer. // Verser les lentilles dans un plat, couvrir de purée et parsemer de gruyère ({gruyere}). Gratiner 15 min jusqu’à ce que le dessus soit doré.',
'lasavegepin|Préchauffer le four à 200 °C. Hacher {oignon} d’oignon et le faire revenir 4 min dans l’huile ({huile}). Ajouter les tomates concassées ({tomconc}), sel et poivre, mijoter 10 min. // Décongeler les épinards ({epinards}) ou les faire cuire 5 min dans une poêle, bien les essorer. Les mélanger avec la ricotta ({ricotta}), du sel, du poivre et une pincée de muscade. // Dans un plat, alterner une couche de sauce tomate, une couche de feuilles de lasagne ({lasagne}), une couche de farce aux épinards, jusqu’à épuisement. Finir par de la sauce. // Couvrir de mozzarella ({mozza}) en tranches et de parmesan ({parmesan}). // Cuire 30 min à 200 °C : le dessus doit être bien doré et bouillonnant. Laisser reposer 10 min avant de servir pour qu’elle se tienne bien.',
'burgerchevre|Éplucher {oignon} d’oignon et l’émincer. Le faire cuire à feu doux 15 min dans un filet d’huile avec une pincée de sel et {miel} de miel, en remuant, jusqu’à ce qu’il soit fondant et caramélisé. // Préchauffer le four à 220 °C. Éplucher {pdt} de pommes de terre, les couper en frites, les rincer, les sécher, les mélanger avec {huile} d’huile et du sel. Cuire 25 à 30 min en les retournant à mi-cuisson. // Former un steak avec le bœuf ({boeuf}), saler et poivrer. Le cuire à feu vif 3 à 4 min par face selon la cuisson souhaitée. // Poser le chèvre ({chevre}) en tranches sur le steak 1 min avant la fin pour qu’il ramollisse. // Toaster les pains à burger ({painburger}) 1 min. Monter : pain, salade ({salade}), steak et chèvre, oignons confits, chapeau. Servir avec les frites.',
'pastacourgricotta|Couper {courgette} de courgettes en demi-rondelles. Hacher {ail} gousse(s) d’ail. Râper le zeste du citron ({citron} pièce) et presser son jus. // Cuire {pates} de pâtes dans l’eau bouillante salée selon le paquet. Garder un verre d’eau de cuisson. // Dans une poêle, chauffer l’huile ({huile}) à feu vif, faire dorer les courgettes 6 min avec l’ail, sel et poivre. // Mélanger la ricotta ({ricotta}) avec le zeste, le jus de citron et 2 cuillères d’eau de cuisson pour obtenir une crème lisse. // Verser les pâtes dans la poêle, ajouter la crème de ricotta et mélanger hors du feu, en ajoutant de l’eau de cuisson si besoin. Parsemer de parmesan ({parmesan}) et servir.',
'pdtfarciesrac|Préchauffer le four à 200 °C. Laver {pdt} de pommes de terre, les piquer à la fourchette et les cuire 45 à 50 min jusqu’à ce qu’elles soient tendres. // Hacher {oignon} d’oignon. Dans une poêle, dorer les lardons ({lardons}) 4 min, ajouter l’oignon, cuire 4 min. // Ouvrir les pommes de terre en deux, écraser légèrement la chair. Garnir de lardons et d’oignon, couvrir de raclette ({raclette}) en tranches. // Passer 8 à 10 min au four : le fromage doit être fondu et bien doré. // Laver la salade ({salade}) et l’assaisonner avec le vinaigre ({vinaigre}) et l’huile ({huile}). Servir.',
'crepessalees|Tamiser {farine} de farine dans un saladier, creuser un puits, y casser {oeufs} œuf(s). Verser {lait} de lait peu à peu en fouettant pour éviter les grumeaux, ajouter une pincée de sel. // Laisser reposer la pâte 10 min. Couper {jambon} de jambon et râper {gruyere} de gruyère. // Chauffer une poêle à feu moyen avec un peu de beurre ({beurre}). Verser une petite louche de pâte et incliner pour l’étaler finement. // Cuire 1 min 30 jusqu’à ce que les bords se décollent, retourner, cuire 30 s. Empiler les crêpes. // Garnir la moitié de chaque crêpe de jambon et de gruyère, plier en quatre. // Remettre 2 min à la poêle à feu doux, couvert, pour que le fromage fonde.',
'lasagnes|Préchauffer le four à 180 °C. Hacher {oignon} d’oignon et {ail} gousse(s) d’ail, râper {carotte} de carottes. // Faire revenir oignon, carotte et ail 5 min, ajouter {boeuf} de bœuf et le faire colorer 5 min. Ajouter {tomconc} de tomates, sel, poivre, mijoter 20 min. // Béchamel : fondre {beurre} de beurre dans une casserole, ajouter {farine} de farine, remuer 1 min, verser {lait} de lait froid petit à petit en fouettant. Cuire 5 min jusqu’à ce que ça nappe. Saler, muscade. // Dans un plat, alterner sauce bolognaise, feuilles de lasagne ({lasagne}), béchamel, en finissant par la béchamel. // Parsemer de {gruyere} de gruyère. Cuire 30 à 35 min jusqu’à ce que le dessus soit doré. // Laisser reposer 10 min avant de découper, pour que les parts tiennent.',
'gnocchitom|Préchauffer le four à 200 °C. Hacher {oignon} d’oignon. Couper {mozza} de mozzarella en tranches. // Faire revenir l’oignon dans {huile} d’huile 3 min. Ajouter {tomconc} de tomates, sel, poivre, mijoter 8 min. // Cuire les gnocchis ({gnocchi}) dans l’eau bouillante salée : ils sont prêts quand ils remontent à la surface (2 min). Égoutter. // Mélanger gnocchis et sauce dans un plat, couvrir de mozzarella. // Gratiner 10 min jusqu’à ce que le fromage soit doré. Ajouter des herbes fraîches avant de servir.',
'aglio|Mettre l’eau des pâtes à bouillir. Éplucher {ail} gousse(s) d’ail et les émincer finement. Ciseler {herbes} botte(s) de persil. // Cuire {pates} de spaghetti 1 min de moins que le temps du paquet. Garder un verre d’eau de cuisson. // Pendant ce temps, chauffer {huile} d’huile à feu doux dans une grande poêle. Ajouter l’ail et cuire 2 min : il doit dorer à peine, sinon il devient amer. // Ajouter les spaghetti égouttés et un peu d’eau de cuisson, mélanger 1 min pour créer une sauce onctueuse. // Servir avec persil, poivre et {parmesan} de parmesan.',
'patescourg|Mettre l’eau des pâtes à bouillir. Laver {courgette} de courgettes, les couper en petits dés. Hacher {ail} gousse(s) d’ail. // Cuire {pates} de pâtes selon le temps du paquet, garder un peu d’eau. // Chauffer {huile} d’huile dans une poêle, cuire les courgettes 8 min à feu moyen-vif jusqu’à légère coloration. Ajouter l’ail 1 min. // Verser {creme} de crème, saler, poivrer, laisser réduire 2 min. // Mélanger avec les pâtes et un peu d’eau de cuisson. Parsemer de {parmesan} de parmesan.',
